name: Run edit admin update
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/tmp-edit-admin-ui-v2.yml').read_text()
          start=source.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=source.index("\n          PY",start)
          code=textwrap.dedent(source[start:end])
          exec(compile(code,'ui_patch.py','exec'))
          PY
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/tmp-edit-admin-ui-v2.yml .github/workflows/tmp-run-edit-admin.yml .github/workflows/tmp-home-layout-ui-adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout-edit.html home-layout-admin.html .github/workflows
          git commit -m "Rework edit and admin operation flow"
          git push
