name: Temporary typography unification v2
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography scale
        shell: bash
        run: |
          python -c 'from pathlib import Path;p=Path("home-layout.html");s=p.read_text();b="/* typography-v1: 20 / 18 / 16 / 14 / 12 */\n.topTitle{font-size:20px}\n.stepTitle{font-size:18px}\n.back,.action,.deviceSelect,.stepNo{font-size:16px}\n.stepText,.initialStatus,.receivedHead,.receivedRow,.initialBadge,.empty,.message{font-size:12px}\n.stepText,.initialStatus,.receivedRow,.empty,.message{line-height:1.3}";p.write_text(s.replace("</style>",b+"\n</style>",1))'
          python -c 'from pathlib import Path;p=Path("home-layout-edit.html");s=p.read_text();b="/* typography-v1: 20 / 18 / 16 / 14 / 12 */\n.title{font-size:20px}\n.panelTitle{font-size:18px}\n.label{font-size:14px}\nselect,input,.choice,.displayField,.rangeAdditionalText,.button,.campaignRow,.summaryValue{font-size:16px}\n.hint,.analysisMessage,.summaryLabel,.baseMark,.status{font-size:12px}\n.hint,.analysisMessage,.status{line-height:1.3}\n.saveToastBox{font-size:20px}\n.confirmTitle{font-size:20px}\n.confirmMessage,.confirmActions button{font-size:16px}";p.write_text(s.replace("</style>",b+"\n</style>",1))'
          python -c 'from pathlib import Path;p=Path("home-layout-admin.html");s=p.read_text();b="/* typography-v1: 20 / 18 / 16 / 14 / 12 */\n.title{font-size:20px}\n.panel h2,#accounts.panel h2{font-size:18px}\n#bulk .muted{font-size:14px}\nbody,button,select,input,.bulkChoices label,.rangeBulk input,.bulkRangeText,.bulkStatic{font-size:16px}\n.muted,.status,.table,.accountSummary th,.accountHistoryStatus,.accountHistoryActions a{font-size:12px}\n.accountSummary,.accountSummary tr.total td{font-size:14px}\n.number{font-size:16px}\n.menu button{font-size:12px}";p.write_text(s.replace("</style>",b+"\n</style>",1))'
          python -c 'from pathlib import Path;p=Path("home-layout-read.html");s=p.read_text();b="/* typography-v1: 20 / 18 / 16 / 14 / 12 */\n.title{font-size:20px}\n.panelTitle{font-size:18px}\n.fileName,.button{font-size:16px}\n.empty{font-size:14px}\n.hint,.meta{font-size:12px}\n.hint,.meta{line-height:1.35}";p.write_text(s.replace("</style>",b+"\n</style>",1))'
          python -c 'from pathlib import Path;p=Path("home-layout-monthly-history.html");s=p.read_text();b="/* typography-v1: 20 / 18 / 16 / 14 / 12 */\n.title{font-size:20px}\n.panel h2{font-size:18px}\n.historyTable{font-size:14px}\n.historyTable th,.muted,.status{font-size:12px}";p.write_text(s.replace("</style>",b+"\n</style>",1))'
          python -c 'from pathlib import Path;import re;p=Path("sw.js");s=p.read_text();s=re.sub(r"const CACHE=\x27[^\x27]+\x27;","const CACHE=\x27winning-url-manager-share-v41-typography-unified\x27;",s,count=1);s=s.replace("\x27./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2\x27,\x27./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2\x27","\x27./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2\x27");p.write_text(s)'
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/tmp-typography-unify.yml .github/workflows/tmp-typography-unify-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout.html home-layout-edit.html home-layout-admin.html home-layout-read.html home-layout-monthly-history.html sw.js .github/workflows
          git commit -m "Unify typography across home layout pages"
          git push