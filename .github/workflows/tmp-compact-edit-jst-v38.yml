name: Temporary compact edit layout and JST display
on:
  push:
    paths:
      - '.github/workflows/tmp-compact-edit-jst-v38.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact edit page and fix JST display
        run: |
          python3 - <<'PY'
          from pathlib import Path

          edit = Path('home-layout-edit.html')
          s = edit.read_text(encoding='utf-8')
          reps = {
            '.wrap{width:min(720px,100%);margin:0 auto;padding:12px 12px calc(30px + env(safe-area-inset-bottom))}': '.wrap{width:min(720px,100%);margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}',
            '.panel{padding:15px;margin-bottom:14px}': '.panel{padding:10px;margin-bottom:8px}',
            '.panelTitle{margin:0 0 13px;font-size:20px}': '.panelTitle{margin:0 0 8px;font-size:19px}',
            '.grid{display:grid;gap:12px}.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}': '.grid{display:grid;gap:8px}.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}',
            '.field{display:grid;gap:6px}.fullRow{grid-column:1/-1}.field:has(#baseFile){display:none}': '.field{display:grid;gap:4px}.fullRow{grid-column:1/-1}.field:has(#baseFile){display:none}',
            '.label{font-size:14px;color:#ddd}': '.label{font-size:13px;color:#ddd}',
            'select,input{width:100%;min-height:48px;padding:8px 10px;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit}': 'select,input{width:100%;min-height:42px;padding:5px 8px;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit}',
            '.hint{margin:0;color:#aaa;font-size:12px;line-height:1.55}': '.hint{margin:0;color:#aaa;font-size:10.5px;line-height:1.25;white-space:nowrap}',
            '.button{width:100%;min-height:76px;padding:8px 6px;font-size:17px;font-weight:700;line-height:1.45}': '.button{width:100%;min-height:58px;padding:5px 5px;font-size:16px;font-weight:700;line-height:1.3}',
            '.status{display:none;margin-top:14px;padding:12px;border:2px solid #fff;line-height:1.65}': '.status{display:none;margin-top:8px;padding:8px;border:2px solid #fff;line-height:1.4}',
            '.analysisRow,.createActions,.workGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.analysisRow .button{min-width:0}.analysisMessage{display:grid;place-items:center;min-height:76px;margin:0;padding:7px 5px;border:2px solid #777;text-align:center;font-size:12px;line-height:1.5;white-space:pre-line}': '.analysisRow,.createActions,.workGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.analysisRow .button{min-width:0}.analysisMessage{display:grid;place-items:center;min-height:58px;margin:0;padding:5px 4px;border:2px solid #777;text-align:center;font-size:11.5px;line-height:1.35;white-space:pre-line}',
            '.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{position:relative;display:grid;place-items:center;min-width:0;min-height:48px;padding:4px 2px;border:2px solid #fff;cursor:pointer;text-align:center;font-size:12px;line-height:1.25}': '.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{position:relative;display:grid;place-items:center;min-width:0;min-height:42px;padding:3px 2px;border:2px solid #fff;cursor:pointer;text-align:center;font-size:12px;line-height:1.2}',
            '.rangeAdditionalText{display:none;min-height:48px;padding:6px 10px;border:2px solid #fff;background:#000;color:#fff;place-items:center;text-align:center;line-height:1.12}': '.rangeAdditionalText{display:none;min-height:42px;padding:4px 8px;border:2px solid #fff;background:#000;color:#fff;place-items:center;text-align:center;line-height:1.08}',
            '.displayField{min-height:48px;padding:8px 10px;border:2px solid #fff;background:#000;color:#fff;display:grid;place-items:center;text-align:center}': '.displayField{min-height:42px;padding:5px 8px;border:2px solid #fff;background:#000;color:#fff;display:grid;place-items:center;text-align:center}',
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit(f'edit pattern missing: {old[:80]}')
              s=s.replace(old,new,1)
          edit.write_text(s,encoding='utf-8')

          admin = Path('home-layout-admin.html')
          a = admin.read_text(encoding='utf-8')
          needle = "function applyBulkForm(){const s=bulkSettings||{};"
          if needle not in a:
              raise SystemExit('applyBulkForm pattern missing')
          fmt = "function formatJst(value){if(!value)return'';const raw=String(value).trim();const normalized=/(?:[zZ]|[+-]\\d{2}:?\\d{2})$/.test(raw)?raw:raw.replace(' ','T')+'Z';const d=new Date(normalized);return Number.isNaN(d.getTime())?raw:d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}\n"
          a=a.replace(needle,fmt+needle,1)
          old="new Date(s.updated_at).toLocaleString('ja-JP')"
          if old not in a:
              raise SystemExit('timestamp pattern missing')
          a=a.replace(old,"formatJst(s.updated_at)",1)
          admin.write_text(a,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          first=w.splitlines()[0]
          w=w.replace(first,"const CACHE='winning-url-manager-share-v38-compact-edit-jst';",1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/tmp-compact-edit-jst-v38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-layout-edit.html home-layout-admin.html sw.js .github/workflows/tmp-compact-edit-jst-v38.yml
          git commit -m 'Compact edit page without changing header and show JST'
          git push
