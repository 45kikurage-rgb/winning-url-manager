name: Apply layout bulk patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply layout bulk patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout editor and cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('home-layout-edit.html')
          s=p.read_text()
          s=s.replace("let serverCampaigns=[];\nfunction resetGenerateButton()", "let serverCampaigns=[];\nlet managedSettings=null;\nfunction resetGenerateButton()")
          needle="function resetGenerateButton(){output=null;const button=$('generate');if(!button)return;button.innerHTML='更新ファイルを<br>作成する';button.classList.remove('download');button.disabled=true}\n"
          addition='''\nasync function loadManagedSettings(){\n  const res=await apiCall('/api/layout/settings');\n  managedSettings=res.settings||null;\n  applyManagedSettings();\n  return managedSettings;\n}\nfunction applyManagedSettings(){\n  if(!managedSettings?.campaign_id)return;\n  const campaign=serverCampaigns.find(row=>row.id===managedSettings.campaign_id);\n  if(campaign&&[...$(\'campaignSelect\').options].some(option=>option.value===campaign.name))$(\'campaignSelect\').value=campaign.name;\n  const result=document.querySelector(\'input[name="drawResult"][value="\'+managedSettings.draw_result+\'"]\');if(result)result.checked=true;\n  const target=document.querySelector(\'input[name="workTarget"][value="\'+managedSettings.work_target+\'"]\');if(target)target.checked=true;\n  $(\'rangeStart\').value=Number(managedSettings.range_start||1);$(\'rangeEnd\').value=Number(managedSettings.range_end||150);\n  [$(\'campaignSelect\'),$(\'rangeStart\'),$(\'rangeEnd\')].forEach(el=>{el.disabled=true;el.title=\'管理画面の一括設定を使用中\';});\n  document.querySelectorAll(\'input[name="drawResult"],input[name="workTarget"]\').forEach(el=>{el.disabled=true;el.closest(\'.choice\')?.setAttribute(\'title\',\'管理画面の一括設定を使用中\');});\n}\n'''
          if 'let managedSettings=null;' not in s:
              s=s.replace(needle, needle+addition)
          s=s.replace("async function analyze(){\n  if(analysis?.workingDb)", "async function analyze(){\n  try{await loadManagedSettings()}catch(error){return showStatus($('analysisStatus'),'管理画面の一括設定を取得できません。\\n'+String(error?.message||error),'error')}\n  if(analysis?.workingDb)")
          s=s.replace("const novaName=stamp+'_端末'+device+'_'+safeName(analysis.campaign)+'_編集済.novabackup';", "const novaName='あ_'+stamp+'_端末'+device+'_'+safeName(analysis.campaign)+'_編集済.novabackup';")
          dlneedle="function download(blob,name){\n  const url=URL.createObjectURL(blob);\n  const anchor=document.createElement('a');\n  anchor.href=url;\n  anchor.download=name;\n  document.body.appendChild(anchor);\n  anchor.click();\n  anchor.remove();\n  setTimeout(()=>URL.revokeObjectURL(url),30000);\n}\n"
          cleanup='''async function autoCleanupAfterDownload(device){\n  const settings=migrateSettings(getSettings());\n  const current=settings.devices?.[device]||{};\n  const pinnedId=current.pinnedBaseFile;\n  if(!pinnedId)return 0;\n  const rows=await getAll();\n  const pinnedIds=new Set(Object.values(settings.devices||{}).map(data=>data.pinnedBaseFile).filter(Boolean));\n  const deleteIds=[];\n  for(const row of rows){\n    if(row.kind==='generated'&&row.device===device){deleteIds.push(row.id);continue}\n    if(row.kind==='generated')continue;\n    const assigned=settings.fileDevices?.[row.id]||{};\n    if(!assigned[device]||row.id===pinnedId)continue;\n    delete assigned[device];\n    const usedElsewhere=Object.values(assigned).some(Boolean);\n    if(!usedElsewhere&&!pinnedIds.has(row.id))deleteIds.push(row.id);\n    if(usedElsewhere)settings.fileDevices[row.id]=assigned;else delete settings.fileDevices[row.id];\n  }\n  if(deleteIds.length)await deleteRecords(deleteIds);\n  current.selectedBaseFile=pinnedId;current.baseFile=pinnedId;current.afterFile='';settings.devices[device]=current;saveSettings(settings);\n  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));\n  fillSelect($(\'baseFile\'),pinnedId,pinnedId);fillSelect($(\'afterFile\'),\'\');renderBaseState();\n  return deleteIds.length;\n}\n\n'''
          if 'async function autoCleanupAfterDownload' not in s:
              s=s.replace(dlneedle,dlneedle+cleanup)
          s=s.replace("try{await loadServerCampaigns()}catch(error){showStatus($('analysisStatus'),'キャンペーン一覧をサーバーから取得できませんでした。','error')}", "try{await loadServerCampaigns();await loadManagedSettings()}catch(error){showStatus($('analysisStatus'),'管理画面の一括設定を取得できませんでした。','error')}")
          s=s.replace('renderCampaignSelect(initialLogs);', 'renderCampaignSelect(initialLogs);applyManagedSettings();', 1)
          old="""    renderCampaigns(logs);\n    renderCampaignSelect(logs);\n  });"""
          new="""    renderCampaigns(logs);\n    renderCampaignSelect(logs);applyManagedSettings();\n  });"""
          s=s.replace(old,new)
          old_handler="""$('generate').addEventListener('click',()=>{\n  if(output){\n    download(output.blob,output.fileName);\n    apiCall('/api/layout/generations',{method:'POST',body:JSON.stringify({id:output.id,device:output.device,campaign_id:output.campaignId||null,file_name:output.fileName,account_count:(output.pages||[]).reduce((sum,page)=>sum+page.count,0),downloaded:true})}).catch(console.error);\n    $('generate').innerHTML='ダウンロード済み<br>もう一度ダウンロード';\n    showStatus($('generateStatus'),'ダウンロードを開始しました。\\n'+output.fileName);\n    return;\n  }\n  generate();\n});"""
          new_handler="""$('generate').addEventListener('click',async()=>{\n  if(output){\n    const downloaded=output;\n    download(downloaded.blob,downloaded.fileName);\n    apiCall('/api/layout/generations',{method:'POST',body:JSON.stringify({id:downloaded.id,device:downloaded.device,campaign_id:downloaded.campaignId||null,file_name:downloaded.fileName,account_count:(downloaded.pages||[]).reduce((sum,page)=>sum+page.count,0),downloaded:true})}).catch(console.error);\n    const deleted=await autoCleanupAfterDownload(downloaded.device);\n    resetGenerateButton();\n    $('summary').hidden=true;\n    showStatus($('generateStatus'),'ダウンロードを開始しました。\\n'+downloaded.fileName+'\\n★初期以外の使用データを自動削除：'+deleted+'件');\n    return;\n  }\n  generate();\n});"""
          s=s.replace(old_handler,new_handler)
          p.write_text(s)
          sw=Path('sw.js')
          sw.write_text(sw.read_text().replace("winning-url-manager-share-v25-visibility","winning-url-manager-share-v26-layout-bulk"))
      - name: Verify and commit
        run: |
          python - <<'PY'
          import re
          s=open('home-layout-edit.html').read()
          open('/tmp/home-layout-edit.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/home-layout-edit.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add home-layout-edit.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Finish layout bulk settings"
          git push
