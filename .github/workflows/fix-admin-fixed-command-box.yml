name: Fix admin fixed command box

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-fixed-command-box.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix fixed command box layout
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('home-layout-admin.html')
          s = p.read_text(encoding='utf-8')

          old = '.menu{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:12px 0 0;padding:0}'
          new = '.menu{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:0;padding:0;background:#000}'
          if old not in s:
              raise SystemExit('menu css target not found')
          s = s.replace(old, new, 1)

          s = s.replace('.bottomSpacer{height:24px}', '.bottomSpacer{height:151px}', 1)
          s = s.replace('.bottomSpacer{height:24px}}', '.bottomSpacer{height:151px}}', 1)

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          import re
          t2, n = re.subn(r"const CACHE='winning-url-manager-share-v\d+[^']*';", "const CACHE='winning-url-manager-share-v29-admin-fixed-command-box';", t, count=1)
          if n != 1:
              raise SystemExit('service worker cache target not found')
          sw.write_text(t2, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-layout-admin.html sw.js
          git commit -m 'Fix admin command box to bottom viewport' || exit 0
          git push
