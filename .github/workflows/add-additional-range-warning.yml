name: Add additional range warning
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_additional_range_warning.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('home-layout-edit.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/edit.js').write_text(s[a:b])
          PY
          node --check /tmp/edit.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout-edit.html sw.js
          git diff --cached --quiet || git commit -m "Warn when additional draw range exceeds campaign targets"
          git push
