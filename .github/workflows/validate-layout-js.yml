name: One-time layout JavaScript validation

on:
  push:
    paths:
      - '.github/workflows/validate-layout-js.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['home-layout.html','home-layout-edit.html']:
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
              checked=0
              for i,script in enumerate(scripts):
                  if not script.strip():
                      continue
                  p=Path(f'/tmp/{name}.{i}.js')
                  p.write_text(script,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
                  checked+=1
              print(name,'checked',checked,'inline script(s)')
          PY
