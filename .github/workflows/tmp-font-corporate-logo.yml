name: Temporary Corporate Logo switch
on:
  push:
    paths:
      - '.github/workflows/tmp-font-corporate-logo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Corporate Logo and update layout pages
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://logotype.jp/wp-content/uploads/2022/10/Corporate-Logo-Bold-ver3.zip' -o /tmp/corporate-logo.zip
          rm -rf /tmp/corporate-logo
          mkdir -p /tmp/corporate-logo
          unzip -q /tmp/corporate-logo.zip -d /tmp/corporate-logo
          FONT=$(find /tmp/corporate-logo -type f -iname 'Corporate-Logo-Bold-ver3.otf' | head -n 1)
          test -n "$FONT"
          cp "$FONT" fonts/Corporate-Logo-Bold-ver3.otf
          python - <<'PY'
          from pathlib import Path
          pages = [
              'home-layout.html',
              'home-layout-edit.html',
              'home-layout-read.html',
              'home-layout-admin.html',
              'home-layout-monthly-history.html',
          ]
          for name in pages:
              p = Path(name)
              s = p.read_text()
              s = s.replace('font-family:"Corporate Logo Rounded"', 'font-family:"Corporate Logo"')
              s = s.replace('src:url("./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2") format("woff2")', 'src:url("./fonts/Corporate-Logo-Bold-ver3.otf") format("opentype")')
              s = s.replace('"Corporate Logo Rounded","Hiragino Maru Gothic ProN"', '"Corporate Logo","Hiragino Maru Gothic ProN"')
              p.write_text(s)

          sw = Path('sw.js')
          s = sw.read_text()
          import re
          s = re.sub(r"const CACHE='[^']+';", "const CACHE='winning-url-manager-share-v39-corporate-logo';", s, count=1)
          new_asset = "'./fonts/Corporate-Logo-Bold-ver3.otf'"
          if new_asset not in s:
              old_asset = "'./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2'"
              s = s.replace(old_asset, old_asset + ',' + new_asset)
          sw.write_text(s)
          PY
      - name: Commit changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-font-corporate-logo.yml .github/workflows/tmp-run-edit-admin.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-layout.html home-layout-edit.html home-layout-read.html home-layout-admin.html home-layout-monthly-history.html sw.js fonts/Corporate-Logo-Bold-ver3.otf .github/workflows
          git commit -m 'Switch home layout pages to Corporate Logo'
          git push
