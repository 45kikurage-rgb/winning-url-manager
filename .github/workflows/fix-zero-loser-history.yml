name: One-time zero-loser history fix

on:
  push:
    paths:
      - '.github/workflows/fix-zero-loser-history.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch home-layout-edit.html
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('home-layout-edit.html')
          text = path.read_text(encoding='utf-8')

          old1 = """    if(workTarget==='default'){\n      if(!row7Packages.length)throw new Error('1ページ目の7段目にLINEがありません。');\n      workRows=[...byPackage.entries()].filter(([,row])=>row.lineNumber>=start&&row.lineNumber<=end).map(([id,row])=>({id,row}));"""
          new1 = """    if(workTarget==='default'){\n      workRows=[...byPackage.entries()].filter(([,row])=>row.lineNumber>=start&&row.lineNumber<=end).map(([id,row])=>({id,row}));"""
          if text.count(old1) != 1:
              raise SystemExit(f'patch 1 expected 1 match, got {text.count(old1)}')
          text = text.replace(old1, new1, 1)

          old2 = """    $('summary').hidden=false;\n    if(workTarget==='default'&&!matched.length){\n      analysis.workingDb.close();\n      analysis=null;\n      return showStatus($('analysisStatus'),'7段目に、初期データと一致するLINEがありません。','error');\n    }\n    $('generate').disabled=false;\n    renderCampaigns(logs);\n    renderCampaignSelect(logs,campaign);\n    showStatus($('analysisStatus'),missing.length?'当落を登録しました。\\n初期にないIDは配置しません。':'当落を登録しました。\\nファイルを作成できます。');"""
          new2 = """    $('summary').hidden=false;\n    if(workTarget==='default'&&row7Packages.length&&!matched.length){\n      analysis.workingDb.close();\n      analysis=null;\n      return showStatus($('analysisStatus'),'7段目に、初期データと一致するLINEがありません。','error');\n    }\n    const noLosersInRange=workTarget==='default'&&selectedResult()==='loser'&&row7Packages.length===0;\n    const hasAdditionalPages=logs.order.some(name=>(logs.campaigns[name]?.packages||[]).length>0);\n    renderCampaigns(logs);\n    renderCampaignSelect(logs,campaign);\n    if(noLosersInRange&&!hasAdditionalPages){\n      analysis.workingDb.close();\n      analysis=null;\n      $('generate').disabled=true;\n      return showStatus($('analysisStatus'),'当落履歴を登録しました。\\n追加ページなし・履歴登録完了');\n    }\n    $('generate').disabled=false;\n    if(noLosersInRange){\n      showStatus($('analysisStatus'),'当落履歴を登録しました。\\n今回のハズレ0件。更新ファイルを作成できます。');\n    }else{\n      showStatus($('analysisStatus'),missing.length?'当落を登録しました。\\n初期にないIDは配置しません。':'当落を登録しました。\\nファイルを作成できます。');\n    }"""
          if text.count(old2) != 1:
              raise SystemExit(f'patch 2 expected 1 match, got {text.count(old2)}')
          text = text.replace(old2, new2, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-layout-edit.html
          git commit -m 'Register draw history when there are zero losers'
          git push