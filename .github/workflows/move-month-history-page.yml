name: Move monthly history to separate page
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin and service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home-layout-admin.html')
          s=p.read_text()
          s=s.replace('#accounts.panel h2{margin:0 0 6px;font-size:17px}.monthHistory{margin-top:16px;padding-top:10px;border-top:2px solid #fff}.monthHistory h3{margin:0 0 8px;font-size:16px}.historyTable{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px}.historyTable th,.historyTable td{height:30px;padding:3px 2px;border:1px solid #777;text-align:center;white-space:nowrap}.historyTable th{font-size:11px;color:#ddd}', '#accounts.panel h2{margin:0 0 6px;font-size:17px}.accountHistoryActions{display:flex;justify-content:flex-end;margin-top:8px}.accountHistoryActions a{width:34%;min-height:40px;border:2px solid #fff;background:#000;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:12px}')
          s=s.replace('<section id="accounts" class="panel cut show"><h2>端末/垢数</h2><div id="accountList"></div><div id="monthlyHistory" class="monthHistory"><h3>月別履歴</h3><div id="monthlyHistoryList"></div></div></section>', '<section id="accounts" class="panel cut show"><h2>端末/垢数</h2><div id="accountList"></div><div class="accountHistoryActions"><a href="./home-layout-monthly-history.html">月別履歴</a></div></section>')
          old="""  const historyRows=monthKeys.map(key=>{const [y,m]=key.split('.').map(Number),pm=previousMonth(y,m),pk=monthKey(pm.y,pm.m),count=monthTotals.get(key)||0,previous=monthTotals.has(pk)?monthTotals.get(pk):count,diff=count-previous;return `<tr><td>${key}</td><td>${count}</td><td class=\"${diffClass(diff)}\">${diffText(diff)}</td></tr>`}).join('');
  $('monthlyHistoryList').innerHTML=`<table class=\"historyTable\"><tr><th>年月</th><th>垢数</th><th>前月比</th></tr>${historyRows}</table>`;
"""
          s=s.replace(old,'')
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          t=t.replace("winning-url-manager-share-v31-admin-fixed-header-history","winning-url-manager-share-v32-month-history-page")
          t=t.replace("'./home-layout-admin.html'","'./home-layout-admin.html','./home-layout-monthly-history.html'")
          sw.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout-admin.html home-layout-monthly-history.html sw.js
          git commit -m "Move monthly account history to separate page"
          git push
