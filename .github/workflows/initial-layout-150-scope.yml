name: One-time initial layout 150 scope

on:
  push:
    paths:
      - '.github/workflows/initial-layout-150-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch initial layout handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          # ---------------- home-layout.html ----------------
          path = Path('home-layout.html')
          text = path.read_text(encoding='utf-8')

          text = replace_once(text,
          """.message{min-height:13px;margin:3px 0 0;color:#ffd43b;font-size:10.5px;text-align:center}\n""",
          """.message{min-height:13px;margin:3px 0 0;color:#ffd43b;font-size:10.5px;text-align:center}\n.confirmModal{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58)}.confirmModal.show{display:flex}.confirmBox{width:min(430px,100%);min-height:280px;display:flex;flex-direction:column;justify-content:space-between;padding:26px 22px 18px;border-radius:24px;background:#fff;color:#3f3f48}.confirmTitle{margin-bottom:12px;font-size:20px;font-weight:700}.confirmMessage{white-space:pre-line;font-size:16px;line-height:1.55}.confirmActions{display:flex;justify-content:flex-end;gap:16px;margin-top:22px}.confirmActions button{min-width:90px;padding:10px;border:0;background:transparent;color:#4d4f82;font-family:inherit!important;font-size:16px;font-weight:700}\n""",
          'home css')

          text = replace_once(text,
          """</main>\n<script>\nconst DB_NAME='winning-url-manager-home-layout';\nconst STORE_NAME='backups';\nconst SETTINGS_KEY='home-layout-settings-v1';\nconst $=id=>document.getElementById(id);\n""",
          """</main>\n<div id=\"confirmModal\" class=\"confirmModal\" aria-hidden=\"true\"><div class=\"confirmBox\" role=\"dialog\" aria-modal=\"true\"><div><div id=\"confirmTitle\" class=\"confirmTitle\"></div><div id=\"confirmMessage\" class=\"confirmMessage\"></div></div><div class=\"confirmActions\"><button id=\"confirmCancel\" type=\"button\">キャンセル</button><button id=\"confirmOk\" type=\"button\">OK</button></div></div></div>\n<script src=\"https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js\"></script>\n<script src=\"https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js\"></script>\n<script>\nconst DB_NAME='winning-url-manager-home-layout';\nconst STORE_NAME='backups';\nconst SETTINGS_KEY='home-layout-settings-v1';\nconst API='https://winning-url-api.45kikurage.workers.dev';\nconst SQL_WASM='https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.wasm';\nconst $=id=>document.getElementById(id);\nlet sqlPromise=null;\nlet confirmResolve=null;\n""",
          'home script header')

          text = replace_once(text,
          """function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return {}}}\nfunction saveSettings(settings){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}\n\nfunction initDeviceSelect(){\n""",
          """function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return {}}}\nfunction saveSettings(settings){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}\nfunction showConfirm(title,message){\n  $('confirmTitle').textContent=title;$('confirmMessage').textContent=message;\n  $('confirmModal').classList.add('show');$('confirmModal').setAttribute('aria-hidden','false');\n  return new Promise(resolve=>{confirmResolve=resolve});\n}\nfunction closeConfirm(value){if(!confirmResolve)return;$('confirmModal').classList.remove('show');$('confirmModal').setAttribute('aria-hidden','true');const resolve=confirmResolve;confirmResolve=null;resolve(value)}\n$('confirmCancel').onclick=()=>closeConfirm(false);$('confirmOk').onclick=()=>closeConfirm(true);\nfunction packageId(intent){const match=String(intent||'').match(/(?:component|package)=([^/;]+)/i);return match?match[1]:''}\nfunction isLine(row){return /^jp\\.naver\\.line\\./i.test(packageId(row.intent))}\nfunction lineNumber(title,index){\n  const value=String(title||'').trim().toLowerCase();\n  if(value==='00')return 100;\n  if(/^\\d{1,2}$/.test(value))return Number(value);\n  const match=value.match(/^([a-z])(\\d)$/);\n  if(match){const block=match[1].charCodeAt(0)-97;const digit=Number(match[2])||10;return 100+block*10+digit}\n  return index+1;\n}\nfunction query(db,sql,params=[]){const stmt=db.prepare(sql);const rows=[];try{stmt.bind(params);while(stmt.step())rows.push(stmt.getAsObject());return rows}finally{stmt.free()}}\nasync function sqlEngine(){if(!sqlPromise){if(typeof initSqlJs!=='function')throw new Error('解析プログラムを読み込めません。通信状態を確認してください。');sqlPromise=initSqlJs({locateFile:()=>SQL_WASM})}return sqlPromise}\nasync function apiCall(path,options={}){\n  let token='';try{token=localStorage.getItem('winning-url-manager-token')||''}catch{}\n  const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{'X-Manager-Token':token}:{}),...(options.headers||{})}});\n  const raw=await response.text();let body;try{body=JSON.parse(raw)}catch{body={error:raw}}\n  if(response.status===401)throw new Error('管理端末の認証が必要です。先に管理画面を開いて認証してください。');\n  if(!response.ok)throw new Error(body.error||('HTTP '+response.status));return body;\n}\nasync function extractDefaultLayout(file,previousLayout=[]){\n  if(typeof JSZip==='undefined')throw new Error('バックアップ読込プログラムを読み込めません。');\n  const zip=await JSZip.loadAsync(await file.arrayBuffer());\n  const dbEntry=zip.file('nova.db');if(!dbEntry)throw new Error('nova.dbがないため、NOVAバックアップとして読めません。');\n  const SQL=await sqlEngine();const db=new SQL.Database(new Uint8Array(await dbEntry.async('arraybuffer')));\n  try{\n    const rows=query(db,'SELECT * FROM favorites');\n    const desktopScreens=[...new Set(rows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)).filter(Number.isFinite))].sort((a,b)=>a-b);\n    const defaultScreens=desktopScreens.slice(0,5);\n    if(!defaultScreens.length)throw new Error('ホーム画面の1〜5ページを確認できません。');\n    const allowed=new Set(defaultScreens);\n    const candidates=rows.filter(row=>Number(row.container)===-100&&Number(row.itemType)===0&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5&&allowed.has(Number(row.screen))&&isLine(row))\n      .sort((a,b)=>Number(a.screen)-Number(b.screen)||Number(a.cellY)-Number(b.cellY)||Number(a.cellX)-Number(b.cellX)||Number(a._id)-Number(b._id));\n    const byPackage=new Map();\n    for(const row of candidates){\n      const appId=packageId(row.intent);if(!appId||byPackage.has(appId))continue;\n      const no=lineNumber(row.title,byPackage.size);\n      byPackage.set(appId,{appId,lineNumber:no,displayName:String(row.title||no),screen:Number(row.screen),cellX:Number(row.cellX),cellY:Number(row.cellY)});\n    }\n    const layout=[...byPackage.values()];\n    if(layout.length>150)throw new Error('初期配置が150アカウントを超えています。151アカウント以上はチャットで相談してください。');\n    const defaultIds=new Set(layout.map(row=>row.appId));\n    const previousIds=new Set((Array.isArray(previousLayout)?previousLayout:[]).map(row=>row.appId).filter(Boolean));\n    const outsideIds=new Set(rows.filter(row=>Number(row.container)===-100&&Number(row.itemType)===0&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5&&!allowed.has(Number(row.screen))&&isLine(row)).map(row=>packageId(row.intent)).filter(Boolean));\n    const outsideNew=[...outsideIds].filter(id=>!defaultIds.has(id)&&!previousIds.has(id));\n    if(layout.length>=150&&outsideNew.length)throw new Error('1〜5ページの150枠より外に新しいLINEアカウントがあります。151アカウント以上は変更せず、チャットで相談してください。');\n    return {layout,defaultScreens};\n  }finally{db.close()}\n}\n\nfunction initDeviceSelect(){\n""",
          'home helpers')

          text = replace_once(text,
          """async function renderInitialStatus(){\n  const device=$('initialDevice').value||'01';\n  const settings=loadSettings();\n  const id=settings.devices?.[device]?.pinnedBaseFile||settings.devices?.[device]?.baseFile;\n  if(!id){$('initialStatus').textContent=`端末${device}：初期データ未設定`;return}\n  const rows=await getAll();\n  const row=rows.find(item=>item.id===id);\n  $('initialStatus').textContent=row?`端末${device}：固定中｜${row.fileName}`:`端末${device}：初期データ未設定`;\n}\n""",
          """async function renderInitialStatus(){\n  const device=$('initialDevice').value||'01';\n  const settings=loadSettings();\n  const current=settings.devices?.[device]||{};\n  const id=current.pinnedBaseFile||current.baseFile;\n  if(!id){$('initialStatus').textContent=`端末${device}：初期データ未設定`;return}\n  const rows=await getAll();\n  const row=rows.find(item=>item.id===id);\n  const count=Array.isArray(current.defaultLayout)?current.defaultLayout.length:0;\n  $('initialStatus').textContent=row?`端末${device}：固定中｜${row.fileName}${count?`｜${count}垢`:''}`:`端末${device}：初期データ未設定`;\n}\n""",
          'home initial status')

          old_handler = """$('initialFileInput').addEventListener('change',async event=>{\n  const file=event.target.files?.[0];\n  event.target.value='';\n  if(!file)return;\n  if(!String(file.name||'').toLowerCase().endsWith('.novabackup')){\n    $('message').textContent='NOVAバックアップ（.novabackup）を選択してください。';\n    return;\n  }\n  const device=$('initialDevice').value||'01';\n  const id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;\n  await put({id,kind:'source',fileName:file.name,fileSize:file.size,mimeType:file.type||'application/octet-stream',lastModified:file.lastModified||Date.now(),blob:file,receivedAt:Date.now(),initialFor:device});\n  const settings=loadSettings();\n  settings.devices=settings.devices||{};\n  settings.devices[device]={...(settings.devices[device]||{}),baseFile:id,pinnedBaseFile:id};\n  saveSettings(settings);\n  await Promise.all([renderFiles(),renderInitialStatus()]);\n  $('message').textContent=`端末${device}の初期データを固定しました。変更するまでこのデータを使用します。`;\n});\n"""
          new_handler = """$('initialFileInput').addEventListener('change',async event=>{\n  const file=event.target.files?.[0];\n  event.target.value='';\n  if(!file)return;\n  if(!String(file.name||'').toLowerCase().endsWith('.novabackup')){\n    $('message').textContent='NOVAバックアップ（.novabackup）を選択してください。';\n    return;\n  }\n  const device=$('initialDevice').value||'01';\n  const settings=loadSettings();settings.devices=settings.devices||{};\n  const previous={...(settings.devices[device]||{})};\n  $('message').textContent=`端末${device}の1〜5ページを解析しています。`;\n  try{\n    const extracted=await extractDefaultLayout(file,previous.defaultLayout||[]);\n    const oldLayout=Array.isArray(previous.defaultLayout)?previous.defaultLayout:[];\n    const oldIds=new Set(oldLayout.map(row=>row.appId));const newIds=new Set(extracted.layout.map(row=>row.appId));\n    const added=extracted.layout.filter(row=>!oldIds.has(row.appId));\n    const removed=oldLayout.filter(row=>!newIds.has(row.appId));\n    const message=[\n      `端末${device}`,\n      `現在：${oldLayout.length||'未記録'}垢`,\n      `更新後：${extracted.layout.length}垢`,\n      `追加：${added.length}件`,\n      `削除：${removed.length}件`,\n      '',\n      '1〜5ページ・5×6だけを初期配置として記録します。',\n      '6ページ目以降の再抽選配置は初期データに含めません。',\n      '',\n      'この内容で更新しますか？'\n    ].join('\\n');\n    if(!await showConfirm('初期データ更新',message)){ $('message').textContent='初期データの更新をキャンセルしました。';return; }\n    const accounts=extracted.layout.map(row=>({app_id:row.appId,line_number:row.lineNumber,display_name:row.displayName}));\n    await apiCall('/api/layout/accounts/sync',{method:'POST',body:JSON.stringify({device,accounts})});\n    const id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;\n    await put({id,kind:'source',fileName:file.name,fileSize:file.size,mimeType:file.type||'application/octet-stream',lastModified:file.lastModified||Date.now(),blob:file,receivedAt:Date.now(),initialFor:device});\n    settings.devices[device]={...previous,baseFile:id,pinnedBaseFile:id,selectedBaseFile:id,defaultLayout:extracted.layout,defaultScreens:extracted.defaultScreens,defaultLayoutUpdatedAt:new Date().toISOString()};\n    settings.fileDevices=settings.fileDevices||{};settings.fileDevices[id]=settings.fileDevices[id]||{};settings.fileDevices[id][device]=true;\n    saveSettings(settings);\n    await Promise.all([renderFiles(),renderInitialStatus()]);\n    $('message').textContent=`端末${device}の初期配置を${extracted.layout.length}垢で更新しました。追加${added.length}件／削除${removed.length}件／サーバー同期完了。`;\n  }catch(error){\n    $('message').textContent=String(error?.message||error);\n  }\n});\n"""
          text = replace_once(text, old_handler, new_handler, 'home initial handler')
          path.write_text(text, encoding='utf-8')

          # ---------------- home-layout-edit.html ----------------
          path = Path('home-layout-edit.html')
          text = path.read_text(encoding='utf-8')

          marker = """function lineNumber(title,index){\n  const value=String(title||'').trim().toLowerCase();\n  if(value==='00')return 100;\n  if(/^\\d{1,2}$/.test(value))return Number(value);\n  const match=value.match(/^([a-z])(\\d)$/);\n  if(match){const block=match[1].charCodeAt(0)-97;const digit=Number(match[2])||10;return 100+block*10+digit}\n  return index+1;\n}\n"""
          helper = marker + """function baseDefaultSelection(baseRows){\n  const current=currentDeviceSettings();\n  const stored=Array.isArray(current.defaultLayout)?current.defaultLayout:[];\n  if(stored.length){\n    const rowsById=new Map();\n    for(const row of baseRows){\n      if(Number(row.itemType)!==0||!isLine(row))continue;\n      const id=packageId(row.intent);if(!id)continue;\n      const list=rowsById.get(id)||[];list.push(row);rowsById.set(id,list);\n    }\n    const canonical=[];\n    for(const [index,entry] of stored.entries()){\n      const candidates=rowsById.get(entry.appId)||[];\n      const exact=candidates.find(row=>Number(row.container)===-100&&Number(row.screen)===Number(entry.screen)&&Number(row.cellX)===Number(entry.cellX)&&Number(row.cellY)===Number(entry.cellY));\n      const fallback=candidates.find(row=>Number(row.container)===-100&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5)||candidates[0];\n      const row=exact||fallback;if(row)canonical.push({...row,lineNumber:Number(entry.lineNumber)||lineNumber(row.title,index)});\n    }\n    const screens=[...new Set((Array.isArray(current.defaultScreens)?current.defaultScreens:stored.map(row=>row.screen)).map(Number).filter(Number.isFinite))].sort((a,b)=>a-b).slice(0,5);\n    return {canonical,defaultScreens:screens};\n  }\n  const screens=[...new Set(baseRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)).filter(Number.isFinite))].sort((a,b)=>a-b).slice(0,5);\n  const allowed=new Set(screens);\n  const rows=baseRows.filter(row=>Number(row.container)===-100&&Number(row.itemType)===0&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5&&allowed.has(Number(row.screen))&&isLine(row))\n    .sort((a,b)=>Number(a.screen)-Number(b.screen)||Number(a.cellY)-Number(b.cellY)||Number(a.cellX)-Number(b.cellX)||Number(a._id)-Number(b._id));\n  const byPackage=new Map();\n  for(const row of rows){const id=packageId(row.intent);if(id&&!byPackage.has(id))byPackage.set(id,{...row,lineNumber:lineNumber(row.title,byPackage.size)})}\n  return {canonical:[...byPackage.values()],defaultScreens:screens};\n}\n"""
          text = replace_once(text, marker, helper, 'edit helper')

          old_canonical = """    const canonical=baseRows.filter(row=>\n      Number(row.container)===-100&&\n      Number(row.itemType)===0&&\n      Number(row.cellY)>=0&&Number(row.cellY)<=5&&\n      isLine(row)\n    )\n      .sort((a,b)=>Number(a.screen)-Number(b.screen)||Number(a.cellY)-Number(b.cellY)||Number(a.cellX)-Number(b.cellX)||Number(a._id)-Number(b._id));\n    const byPackage=new Map();\n    for(const [index,row] of canonical.entries()){\n      const id=packageId(row.intent);\n      if(id&&!byPackage.has(id))byPackage.set(id,{...row,lineNumber:lineNumber(row.title,index)});\n    }\n"""
          new_canonical = """    const baseDefault=baseDefaultSelection(baseRows);\n    const canonical=baseDefault.canonical;\n    const byPackage=new Map();\n    for(const [index,row] of canonical.entries()){\n      const id=packageId(row.intent);\n      if(id&&!byPackage.has(id))byPackage.set(id,{...row,lineNumber:Number(row.lineNumber)||lineNumber(row.title,index)});\n    }\n"""
          text = replace_once(text, old_canonical, new_canonical, 'edit canonical')

          text = replace_once(text,
          """    const maxScreen=Math.max(0,...baseRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)||0));\n""",
          """    const maxScreen=Math.max(0,...baseDefault.defaultScreens,...canonicalScreens);\n""",
          'edit max screen')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patched JavaScript markers
        run: |
          grep -q "defaultLayoutUpdatedAt" home-layout.html
          grep -q "function baseDefaultSelection" home-layout-edit.html
          grep -q "const maxScreen=Math.max(0,...baseDefault.defaultScreens,...canonicalScreens);" home-layout-edit.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-layout.html home-layout-edit.html
          git commit -m 'Limit initial layout to first five pages and sync capacity'
          git push