name: Temporary single-slot range display
on:
  push:
    paths:
      - '.github/workflows/tmp-range-single-slot-v37.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single-slot range display
        run: |
          python - <<'PY'
          from pathlib import Path

          edit_path=Path('home-layout-edit.html')
          admin_path=Path('home-layout-admin.html')
          sw_path=Path('sw.js')
          edit=edit_path.read_text(encoding='utf-8')
          admin=admin_path.read_text(encoding='utf-8')
          sw=sw_path.read_text(encoding='utf-8')

          # Edit page: one visual slot switches between numeric inputs and two-line additional-page text.
          old_css='.rangeRow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}.rangeRow[hidden]{display:none!important}.rangeRow input{min-width:0;text-align:center}.displayField[hidden]{display:none!important}'
          new_css='.rangeSwitch{width:100%;min-width:0}.rangeInputs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}.rangeInputs input{min-width:0;text-align:center}.rangeAdditionalText{display:none;min-height:48px;padding:6px 10px;border:2px solid #fff;background:#000;color:#fff;place-items:center;text-align:center;line-height:1.12}.rangeSwitch.additional .rangeInputs{display:none}.rangeSwitch.additional .rangeAdditionalText{display:grid}.displayField[hidden]{display:none!important}'
          assert old_css in edit, 'edit range CSS anchor not found'
          edit=edit.replace(old_css,new_css,1)

          old_html='''          <div id="rangeDefault" class="rangeRow"><input id="rangeStart" type="number" min="1" inputmode="numeric" placeholder="開始"><span>～</span><input id="rangeEnd" type="number" min="1" inputmode="numeric" placeholder="終了"></div>\n          <div id="rangeAdditional" class="displayField twoLine" hidden>追加<br>ページ</div>'''
          new_html='''          <div id="rangeSwitch" class="rangeSwitch">\n            <div class="rangeInputs"><input id="rangeStart" type="number" min="1" inputmode="numeric" placeholder="開始"><span>～</span><input id="rangeEnd" type="number" min="1" inputmode="numeric" placeholder="終了"></div>\n            <div class="rangeAdditionalText">追加<br>ページ</div>\n          </div>'''
          assert old_html in edit, 'edit range HTML anchor not found'
          edit=edit.replace(old_html,new_html,1)

          old_js='''function syncWorkModeUI(){\n  const additional=selectedWorkTarget()==='additional';\n  const rangeDefault=$('rangeDefault'),rangeAdditional=$('rangeAdditional'),campaignDisplay=$('campaignDisplay');\n  if(rangeDefault)rangeDefault.hidden=additional;if(rangeAdditional)rangeAdditional.hidden=!additional;\n  const selected=$('campaignSelect')?.selectedOptions?.[0];\n  if(campaignDisplay)campaignDisplay.textContent=additional?'追加ページ':(selected?.textContent||'未設定');\n}'''
          new_js='''function syncWorkModeUI(){\n  const additional=selectedWorkTarget()==='additional';\n  const rangeSwitch=$('rangeSwitch'),campaignDisplay=$('campaignDisplay');\n  if(rangeSwitch)rangeSwitch.classList.toggle('additional',additional);\n  const selected=$('campaignSelect')?.selectedOptions?.[0];\n  if(campaignDisplay)campaignDisplay.textContent=additional?'追加ページ':(selected?.textContent||'未設定');\n}'''
          assert old_js in edit, 'edit syncWorkModeUI anchor not found'
          edit=edit.replace(old_js,new_js,1)
          edit=edit.replace("navigator.serviceWorker.register('./sw.js')","navigator.serviceWorker.register('./sw.js?v=37-range-slot')",1)

          # Admin page: same slot concept, but additional-page text is one line.
          old_admin_css='.rangeBulk{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;min-width:0;max-width:100%}.rangeBulk[hidden]{display:none!important}.rangeBulk input{text-align:center;width:100%;min-width:0;max-width:100%} .fieldBulk select{width:100%}.bulkStatic{min-height:48px;border:2px solid #fff;display:grid;place-items:center;text-align:center;line-height:1.25;padding:6px}.bulkStatic[hidden]{display:none!important}'
          new_admin_css='.bulkRangeSwitch{width:100%;min-width:0;max-width:100%}.rangeBulk{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;min-width:0;max-width:100%}.rangeBulk input{text-align:center;width:100%;min-width:0;max-width:100%}.bulkRangeText{display:none;min-height:48px;border:2px solid #fff;place-items:center;text-align:center;padding:6px}.bulkRangeSwitch.additional .rangeBulk{display:none}.bulkRangeSwitch.additional .bulkRangeText{display:grid} .fieldBulk select{width:100%}.fieldBulk select[hidden]{display:none!important}.bulkStatic{min-height:48px;border:2px solid #fff;display:grid;place-items:center;text-align:center;line-height:1.25;padding:6px}.bulkStatic[hidden]{display:none!important}'
          assert old_admin_css in admin, 'admin range CSS anchor not found'
          admin=admin.replace(old_admin_css,new_admin_css,1)

          old_admin_html='''    <div class="fieldBulk"><span class="muted">作業範囲</span><div id="bulkRangeDefault" class="rangeBulk"><input id="bulkStart" type="number" min="1" value="1" inputmode="numeric"><span>～</span><input id="bulkEnd" type="number" min="1" value="150" inputmode="numeric"></div><div id="bulkRangeAdditional" class="bulkStatic" hidden>追加ページ</div></div>'''
          new_admin_html='''    <div class="fieldBulk"><span class="muted">作業範囲</span><div id="bulkRangeSwitch" class="bulkRangeSwitch"><div class="rangeBulk"><input id="bulkStart" type="number" min="1" value="1" inputmode="numeric"><span>～</span><input id="bulkEnd" type="number" min="1" value="150" inputmode="numeric"></div><div class="bulkRangeText">追加ページ</div></div></div>'''
          assert old_admin_html in admin, 'admin range HTML anchor not found'
          admin=admin.replace(old_admin_html,new_admin_html,1)

          old_admin_js="function syncBulkModeUI(){const additional=(document.querySelector('input[name=\"bulkTarget\"]:checked')?.value||'default')==='additional';$('bulkRangeDefault').hidden=additional;$('bulkRangeAdditional').hidden=!additional;$('bulkCampaign').hidden=additional;$('bulkCampaignAdditional').hidden=!additional;}"
          new_admin_js="function syncBulkModeUI(){const additional=(document.querySelector('input[name=\"bulkTarget\"]:checked')?.value||'default')==='additional';$('bulkRangeSwitch').classList.toggle('additional',additional);$('bulkCampaign').hidden=additional;$('bulkCampaignAdditional').hidden=!additional;}"
          assert old_admin_js in admin, 'admin syncBulkModeUI anchor not found'
          admin=admin.replace(old_admin_js,new_admin_js,1)

          # Force a new service-worker cache generation so mobile/PWA clients pick up the new UI.
          old_cache="const CACHE='winning-url-manager-share-v36-additional-range-warning';"
          new_cache="const CACHE='winning-url-manager-share-v37-single-range-slot';"
          assert old_cache in sw, 'service worker cache anchor not found'
          sw=sw.replace(old_cache,new_cache,1)

          edit_path.write_text(edit,encoding='utf-8')
          admin_path.write_text(admin,encoding='utf-8')
          sw_path.write_text(sw,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-range-single-slot-v37.yml
          git add home-layout-edit.html home-layout-admin.html sw.js
          git commit -m "Use one range slot for additional page mode"
          git push
