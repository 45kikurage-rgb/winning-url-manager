name: Update admin device summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time workflow for admin device summary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('home-layout-admin.html')
          s=p.read_text()

          old='.menu{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:0;padding:0;background:#000}.menu button{width:100%;padding:6px 3px;font-size:13px;font-weight:900}.menu button:nth-child(1),.menu button:nth-child(2){grid-column:span 3}.menu button:nth-child(3),.menu button:nth-child(4),.menu button:nth-child(5){grid-column:span 2}'
          new='.menu{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0;padding:0;background:#000}.menu button{width:100%;padding:6px 2px;font-size:12px;font-weight:900}'
          if old not in s: raise SystemExit('menu css anchor not found')
          s=s.replace(old,new,1)

          anchor='.fieldBulk select{width:100%}#bulkSave{max-width:100%}'
          add=''' .fieldBulk select{width:100%}#bulkSave{max-width:100%}#accountList{width:100%;overflow:visible}.accountSummary{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}.accountSummary th,.accountSummary td{height:34px;padding:4px 2px;border:1px solid #777;text-align:center;white-space:nowrap;overflow:hidden}.accountSummary th{font-size:12px;color:#ddd}.accountSummary th:nth-child(1){width:19%}.accountSummary th:nth-child(2){width:25%}.accountSummary th:nth-child(3){width:28%}.accountSummary th:nth-child(4){width:28%}.accountSummary td{font-variant-numeric:tabular-nums}.accountSummary tr.total td{font-size:15px;font-weight:900;border-top:2px solid #fff}.diffPlus{color:#aaddff}.diffMinus{color:#ff9b9b}.diffZero{color:#fff}'''
          if anchor not in s: raise SystemExit('account css anchor not found')
          s=s.replace(anchor,add,1)

          s=s.replace('@media(max-width:390px){.panel{padding:10px}.table{font-size:10px}.menu button{font-size:11px}}','@media(max-width:390px){.panel{padding:10px}.table{font-size:10px}.menu button{font-size:10px}.accountSummary{font-size:13px}.accountSummary th{font-size:11px}.accountSummary th,.accountSummary td{height:32px;padding:3px 1px}}',1)

          s=s.replace('<section id="correction" class="panel cut"><h2>当落訂正</h2>','<section id="correction" class="panel cut"><h2>当落修正</h2>',1)
          s=s.replace('<section id="accounts" class="panel cut show"><h2>端末・アカウント</h2><div id="accountList" class="scroll"></div></section>','<section id="accounts" class="panel cut show"><h2>端末/垢数</h2><div id="accountList"></div></section>',1)

          oldmenu='''<nav class="menu" aria-label="管理メニュー">\n  <button data-panel="campaigns">キャンペーン編集</button>\n  <button data-panel="bulk">作業一括設定</button>\n  <button data-panel="csv">CSV出力</button>\n  <button data-panel="stats">統計</button>\n  <button data-panel="correction">当落訂正</button>\n</nav>'''
          newmenu='''<nav class="menu" aria-label="管理メニュー">\n  <button data-panel="campaigns">キャンペーン編集</button>\n  <button data-panel="bulk">作業一括設定</button>\n  <button data-panel="correction">当落修正</button>\n  <button data-panel="csv">CSV出力</button>\n  <button data-panel="stats">統計</button>\n  <button data-panel="accounts">端末/垢数</button>\n</nav>'''
          if oldmenu not in s: raise SystemExit('menu html anchor not found')
          s=s.replace(oldmenu,newmenu,1)

          oldrender="  $('accountList').innerHTML=`<table class=\"table\"><tr><th>端末</th><th>LINE</th><th>アプリID</th><th>状態</th></tr>${data.accounts.map(row=>`<tr><td>${esc(row.device_id)}</td><td>${esc(row.line_number||row.display_name)}</td><td>${esc(row.app_id)}</td><td>${row.is_active?'使用中':'休止'}</td></tr>`).join('')}</table>`;"
          newrender="""  const deviceKey=value=>String(value??'').padStart(2,'0');\n  const currentByDevice=new Map();\n  data.accounts.filter(row=>row.is_active).forEach(row=>{const key=deviceKey(row.device_id);currentByDevice.set(key,(currentByDevice.get(key)||0)+1)});\n  const now=new Date(),prevDate=new Date(now.getFullYear(),now.getMonth()-1,1),prevYear=prevDate.getFullYear(),prevMonth=prevDate.getMonth()+1;\n  const parseMonth=value=>{const text=String(value??'').trim();let m=text.match(/^(\\d{4})[-\\/](\\d{1,2})/);if(!m)m=text.match(/^(\\d{4})年(\\d{1,2})月/);if(!m&&/^\\d{6}$/.test(text))m=[text,text.slice(0,4),text.slice(4,6)];return m?{y:Number(m[1]),m:Number(m[2])}:null};\n  let prevRows=data.capacity.filter(row=>{const p=parseMonth(row.month);return p&&p.y===prevYear&&p.m===prevMonth});\n  if(!prevRows.length){const candidates=data.capacity.map(row=>({row,p:parseMonth(row.month)})).filter(x=>x.p&&(x.p.y<now.getFullYear()||(x.p.y===now.getFullYear()&&x.p.m<now.getMonth()+1)));candidates.sort((a,b)=>(b.p.y*12+b.p.m)-(a.p.y*12+a.p.m));if(candidates.length){const y=candidates[0].p.y,m=candidates[0].p.m;prevRows=candidates.filter(x=>x.p.y===y&&x.p.m===m).map(x=>x.row)}}\n  const prevByDevice=new Map();prevRows.forEach(row=>prevByDevice.set(deviceKey(row.device_id),Number(row.account_count||0)));\n  const deviceIds=Array.from({length:15},(_,i)=>String(i+1).padStart(2,'0'));\n  const diffText=n=>n===0?'±0':(n>0?`+${n}`:`${n}`),diffClass=n=>n>0?'diffPlus':n<0?'diffMinus':'diffZero';\n  let totalNow=0,totalPrev=0;const summaryRows=deviceIds.map(id=>{const current=currentByDevice.get(id)||0,previous=prevByDevice.get(id)||0,diff=current-previous;totalNow+=current;totalPrev+=previous;return `<tr><td>${id}</td><td>${current}</td><td>${previous}</td><td class=\"${diffClass(diff)}\">${diffText(diff)}</td></tr>`}).join('');\n  const totalDiff=totalNow-totalPrev;\n  $('accountList').innerHTML=`<table class=\"accountSummary\"><thead><tr><th>端末</th><th>LINE数</th><th>前月末</th><th>前月比</th></tr></thead><tbody>${summaryRows}<tr class=\"total\"><td>合計</td><td>${totalNow}</td><td>${totalPrev}</td><td class=\"${diffClass(totalDiff)}\">${diffText(totalDiff)}</td></tr></tbody></table>`;"""
          if oldrender not in s: raise SystemExit('account render anchor not found')
          s=s.replace(oldrender,newrender,1)
          p.write_text(s)

          sw=Path('sw.js')
          t=sw.read_text()
          import re
          t=re.sub(r"const CACHE='[^']+';","const CACHE='winning-url-manager-share-v30-admin-device-summary';",t,count=1)
          sw.write_text(t)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add home-layout-admin.html sw.js
          git commit -m "Update admin device summary and menu" || exit 0
          git push
