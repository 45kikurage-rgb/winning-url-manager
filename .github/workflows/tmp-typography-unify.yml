name: Temporary typography unification
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify typography across layout pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = {
            'home-layout.html': r'''
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.topTitle{font-size:20px}
.stepTitle{font-size:18px}
.back,.action,.deviceSelect,.stepNo{font-size:16px}
.stepText,.initialStatus,.receivedHead,.receivedRow,.initialBadge,.empty,.message{font-size:12px}
.stepText,.initialStatus,.receivedRow,.empty,.message{line-height:1.3}
''',
            'home-layout-edit.html': r'''
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panelTitle{font-size:18px}
.label{font-size:14px}
select,input,.choice,.displayField,.rangeAdditionalText,.button,.campaignRow,.summaryValue{font-size:16px}
.hint,.analysisMessage,.summaryLabel,.baseMark,.status{font-size:12px}
.hint,.analysisMessage,.status{line-height:1.3}
.saveToastBox{font-size:20px}
.confirmTitle{font-size:20px}
.confirmMessage,.confirmActions button{font-size:16px}
''',
            'home-layout-admin.html': r'''
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panel h2,#accounts.panel h2{font-size:18px}
#bulk .muted{font-size:14px}
body,button,select,input,.bulkChoices label,.rangeBulk input,.bulkRangeText,.bulkStatic{font-size:16px}
.muted,.status,.table,.accountSummary th,.accountHistoryStatus,.accountHistoryActions a{font-size:12px}
.accountSummary,.accountSummary tr.total td{font-size:14px}
.number{font-size:16px}
.menu button{font-size:12px}
''',
            'home-layout-read.html': r'''
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panelTitle{font-size:18px}
.fileName,.button{font-size:16px}
.empty{font-size:14px}
.hint,.meta{font-size:12px}
.hint,.meta{line-height:1.35}
''',
            'home-layout-monthly-history.html': r'''
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panel h2{font-size:18px}
.historyTable{font-size:14px}
.historyTable th,.muted,.status{font-size:12px}
'''
          }

          marker='/* typography-v1:'
          for name, block in blocks.items():
              p=Path(name)
              s=p.read_text()
              if marker in s:
                  start=s.index(marker)
                  end=s.index('</style>', start)
                  s=s[:start]+s[end:]
              if '</style>' not in s:
                  raise SystemExit(f'missing style close: {name}')
              s=s.replace('</style>', block.strip()+'\n</style>', 1)
              p.write_text(s)

          sw=Path('sw.js')
          s=sw.read_text()
          import re
          s=re.sub(r"const CACHE='[^']+';", "const CACHE='winning-url-manager-share-v41-typography-unified';", s, count=1)
          s=s.replace("'./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2','./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2'", "'./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2'")
          sw.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-typography-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout.html home-layout-edit.html home-layout-admin.html home-layout-read.html home-layout-monthly-history.html sw.js .github/workflows
          git commit -m "Unify typography across home layout pages"
          git push