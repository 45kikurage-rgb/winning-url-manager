name: Temporary typography unification
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify typography across layout pages
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/typography.py
          python /tmp/typography.py
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-typography-unify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout.html home-layout-edit.html home-layout-admin.html home-layout-read.html home-layout-monthly-history.html sw.js .github/workflows
          git commit -m "Unify typography across home layout pages"
          git push