name: Fix admin monthly history
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/patch_admin_month_history.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-layout-admin.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin header, compact summary, and monthly account history"
          git push
