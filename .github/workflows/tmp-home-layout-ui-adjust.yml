name: Temporary home layout UI adjustment

on:
  push:
    paths:
      - '.github/workflows/tmp-home-layout-ui-adjust.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Home page: top title frame bottom spacing = description-line height
          p = Path('home-layout.html')
          s = p.read_text(encoding='utf-8')
          old = '.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:stretch;margin-bottom:6px}'
          new = '.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:stretch;margin-bottom:15px}'
          if old not in s:
              raise SystemExit('home-layout.html target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Edit page: initial-data controls are already prepared on the prior screen,
          # so hide that whole row while keeping the underlying element/data available to JS.
          p = Path('home-layout-edit.html')
          s = p.read_text(encoding='utf-8')
          old = '.field{display:grid;gap:6px}.fullRow{grid-column:1/-1}'
          new = '.field{display:grid;gap:6px}.fullRow{grid-column:1/-1}.field:has(#baseFile){display:none}'
          if old not in s:
              raise SystemExit('home-layout-edit.html target CSS not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-home-layout-ui-adjust.yml
          git add home-layout.html home-layout-edit.html
          git commit -m "Adjust home layout spacing and hide edit-page initial data"
          git push
