<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>作成済みファイル</title>
<style>
@font-face{font-family:"Corporate Logo Rounded";src:url("./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:"Corporate Logo Rounded","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:16px;font-weight:700;font-synthesis:none;letter-spacing:.02em}
.wrap{width:min(720px,100%);margin:0 auto;padding:12px 12px calc(30px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;margin-bottom:14px}
.cut{border:3px solid #fff;background:#000;color:#fff;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.back,.button{display:grid;place-items:center;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit;text-align:center;text-decoration:none;cursor:pointer}
.back{min-height:58px}
.title{display:grid;place-items:center;min-width:0;padding:8px;font-size:20px;font-weight:700;text-align:center}
.panel{padding:15px}
.panelTitle{margin:0 0 8px;font-size:20px}
.hint{margin:0 0 14px;color:#aaa;font-size:13px;line-height:1.6}
.list{display:grid;gap:12px}
.row{padding:13px}.row.latest{border-color:#70c8ff}
.rowHead{display:grid;grid-template-columns:92px minmax(0,1fr);gap:9px;align-items:center}.deviceTag{display:grid;place-items:center;min-height:58px;border:2px solid #70c8ff;color:#70c8ff;font-size:20px;text-align:center}.fileInfo{min-width:0}
.fileName{font-size:15px;line-height:1.5;word-break:break-all}
.meta{margin:7px 0 11px;color:#aaa;font-size:12px;line-height:1.55}
.actions{display:grid;gap:8px}
.button{min-height:48px;padding:8px;font-size:15px}
.button:hover,.button:focus-visible,.button:active,.back:hover,.back:focus-visible{background:#fff;color:#000;outline:none}
.nova{border-color:#ffd43b;color:#ffd43b}
.empty{padding:18px;border:2px solid #777;color:#888;text-align:center;line-height:1.7}
.sectionLabel{margin:2px 0 8px;color:#ffd43b;font-size:14px}.olderFiles{margin-top:16px;border:1px solid #777}.olderFiles summary{min-height:48px;padding:14px;cursor:pointer;color:#bbb}.olderList{display:grid;gap:10px;padding:0 10px 10px}.saveNotice{display:none;margin-top:8px;padding:8px;border:1px solid #00d46a;color:#00d46a;font-size:13px;text-align:center}.saveNotice.show{display:block}
@media(max-width:390px){.wrap{padding-left:9px;padding-right:9px}.top{grid-template-columns:76px minmax(0,1fr)}.title{font-size:18px}.panel{padding:12px}.rowHead{grid-template-columns:82px minmax(0,1fr)}.deviceTag{font-size:18px}}
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panelTitle{font-size:18px}
.fileName,.button{font-size:16px}
.empty{font-size:14px}
.hint,.meta{font-size:12px}
.hint,.meta{line-height:1.35}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="./home-layout.html">◀ 戻る</a>
    <div class="title cut">作成済みファイル</div>
  </header>
  <section class="panel cut">
    <h1 class="panelTitle">再保存・復旧用</h1>
    <p class="hint">通常は作成画面で保存します。保存し直す時は、対象端末の最新ファイルを選び、NOVAで復元してください。</p>
    <div id="list" class="list"></div>
    <div id="saveNotice" class="saveNotice" aria-live="polite"></div>
  </section>
</main>
<script>
const DB_NAME='winning-url-manager-home-layout';
const STORE_NAME='backups';
function openDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(STORE_NAME))request.result.createObjectStore(STORE_NAME,{keyPath:'id'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function getAll(){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readonly');
    const request=tx.objectStore(STORE_NAME).getAll();
    tx.oncomplete=()=>{db.close();resolve(request.result)};
    tx.onerror=()=>{db.close();reject(tx.error||request.error)};
  });
}
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatTime=value=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(value));
function download(blob,name){
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=name;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function render(){
  const rows=(await getAll()).filter(row=>row.kind==='generated').sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  const list=document.getElementById('list');
  if(!rows.length){
    list.innerHTML='<div class="empty">作成済みファイルはありません。<br>編集ページから作成してください。</div>';
    return;
  }
  const latest=[],older=[],seen=new Set();
  rows.forEach((row,index)=>{const device=String(row.device||'--');if(seen.has(device))older.push({row,index});else{seen.add(device);latest.push({row,index})}});
  const rowHtml=({row,index},isLatest)=>{
    const pages=(row.pages||[]).map(page=>esc(page.campaign)+'：'+(Number(page.start)+1)+'～'+(Number(page.end)+1)+'ページ').join(' ／ ');
    return '<article class="row cut'+(isLatest?' latest':'')+'"><div class="rowHead"><div class="deviceTag">端末'+esc(row.device)+'</div><div class="fileInfo"><div class="fileName">'+esc(row.fileName)+'</div><div class="meta">作成 '+formatTime(row.receivedAt)+(pages?'<br>'+pages:'')+'</div></div></div><div class="actions"><button class="button nova" type="button" data-index="'+index+'">端末'+esc(row.device)+'用を再保存</button></div></article>';
  };
  list.innerHTML='<div><div class="sectionLabel">各端末の最新ファイル</div><div class="list">'+latest.map(item=>rowHtml(item,true)).join('')+'</div></div>'+(older.length?'<details class="olderFiles"><summary>以前のファイル '+older.length+'件</summary><div class="olderList">'+older.map(item=>rowHtml(item,false)).join('')+'</div></details>':'');
  list.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
    const row=rows[Number(button.dataset.index)];
    download(row.blob,row.fileName);
    const notice=document.getElementById('saveNotice');notice.textContent='端末'+row.device+'用ファイルの保存操作を開始しました。';notice.classList.add('show');
  }));
}
render().catch(()=>{document.getElementById('list').innerHTML='<div class="empty">作成済みファイルを読み込めませんでした。</div>'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=60-campaign-order',{updateViaCache:'none'}).catch(console.error));
</script>
</body>
</html>
