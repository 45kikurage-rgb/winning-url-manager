<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="./icon-any.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<title>ホーム画面編集</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:"DotGothic16","Courier New",monospace;font-size:16px}
.wrap{width:min(720px,100%);margin:0 auto;padding:12px 12px calc(30px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;margin-bottom:14px}
.cut{border:3px solid #fff;background:#000;color:#fff;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.back,.button{display:grid;place-items:center;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit;text-align:center;text-decoration:none;cursor:pointer}
.back{min-height:58px}
.title{display:grid;place-items:center;min-width:0;padding:8px;font-size:20px;font-weight:700;text-align:center}
.panel{padding:15px;margin-bottom:14px}
.panelTitle{margin:0 0 13px;font-size:20px}
.grid{display:grid;gap:12px}
.field{display:grid;gap:6px}
.label{font-size:14px;color:#ddd}
select,input{width:100%;min-height:48px;padding:8px 10px;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit}
.miniButton{width:100%;min-height:42px;padding:7px 9px;border:2px solid #ffd43b;border-radius:0;background:#000;color:#ffd43b;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.miniButton:hover,.miniButton:focus-visible{background:#ffd43b;color:#000;outline:none}
.baseMark{min-height:20px;color:#ffd43b;font-size:12px;line-height:1.5}
.hint{margin:0;color:#aaa;font-size:12px;line-height:1.55}
.button{width:100%;min-height:56px;padding:10px;font-size:18px;font-weight:700}
.button:hover,.button:focus-visible,.button:active,.back:hover,.back:focus-visible{background:#fff;color:#000;outline:none}
.button[disabled]{border-color:#666;color:#777;cursor:not-allowed}
.status{display:none;margin-top:14px;padding:12px;border:2px solid #fff;line-height:1.65}
.status.show{display:block}
.status.error{border-color:#ff5b5b;color:#ff8a8a}
.status.ok{border-color:#ffd43b;color:#fff}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.summaryItem{padding:9px;border:1px solid #777}
.summaryLabel{font-size:12px;color:#aaa}
.summaryValue{margin-top:3px;font-size:18px;color:#ffd43b}
.campaigns{display:grid;gap:8px;margin-top:12px}
.campaignRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px;border:1px solid #777;font-size:14px}
.campaignName{min-width:0;overflow-wrap:anywhere}
.campaignEnd{flex:0 0 auto;min-width:74px;min-height:40px;padding:6px 12px;border:2px solid #ff5b5b;border-radius:0;background:#000;color:#ff8a8a;font:inherit;font-weight:700;cursor:pointer}
.campaignEnd:hover,.campaignEnd:focus-visible{background:#ff5b5b;color:#000;outline:none}
.downloads{display:none;gap:10px;margin-top:14px}
.downloads.show{display:grid}
.download{border-color:#ffd43b;color:#ffd43b}
.danger{margin-top:10px;border-color:#ff5b5b;color:#ff8a8a}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}.downloads.show{grid-template-columns:1fr 1fr}}
@media(max-width:390px){.wrap{padding-left:9px;padding-right:9px}.top{grid-template-columns:76px minmax(0,1fr)}.title{font-size:18px}.panel{padding:12px}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="./home-layout.html">◀ 戻る</a>
    <div class="title cut">ホーム画面編集</div>
  </header>

  <section class="panel cut">
    <h1 class="panelTitle">1. 端末とデータ</h1>
    <div class="grid two">
      <label class="field"><span class="label">対象端末</span><select id="device"></select></label>
      <label class="field"><span class="label">過去のキャンペーン</span><select id="campaignSelect"></select></label>
      <label id="campaignNewField" class="field"><span class="label">新規キャンペーン名</span><input id="campaign" type="text" maxlength="30" placeholder="例：202609プレモル"></label>
      <div class="field"><span class="label">初期データ</span><select id="baseFile"></select><button id="pinBase" class="miniButton" type="button">★ 初期データとして固定</button><span id="baseMark" class="baseMark"></span></div>
      <label class="field"><span class="label">抽選後データ</span><select id="afterFile"></select></label>
    </div>
    <p class="hint">端末06を含め、選択した端末の初期データに実在するアプリIDだけを使います。番号からアプリIDは作りません。</p>
  </section>

  <section class="panel cut">
    <h2 class="panelTitle">2. 解析</h2>
    <button id="analyze" class="button" type="button">7段目のハズレLINEを確認</button>
    <div id="analysisStatus" class="status" aria-live="polite"></div>
    <div id="summary" class="summary" hidden></div>
  </section>

  <section class="panel cut">
    <h2 class="panelTitle">3. 作成</h2>
    <p class="hint">1～6段目のLINEを初期配置へ戻し、最下部のドックは抽選後の状態を維持します。1ページ目・7段目・右端のフォルダー内LINEを、追加ページへ5×6で配置します。</p>
    <div id="campaigns" class="campaigns"></div>
    <button id="generate" class="button" type="button" disabled>更新ファイルを作成</button>
    <div id="generateStatus" class="status" aria-live="polite"></div>
    <div id="downloads" class="downloads">
      <button id="downloadNova" class="button download" type="button">NOVA復元用を保存</button>
      <button id="downloadBundle" class="button download" type="button">バックアップZIPを保存</button>
    </div>
    <button id="completeWork" class="button danger" type="button">作業完了（使用済みデータ削除）</button>
    <div id="cleanupStatus" class="status" aria-live="polite"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<script>
const DB_NAME='winning-url-manager-home-layout';
const STORE_NAME='backups';
const SETTINGS_KEY='home-layout-settings-v1';
const LOG_KEY='home-layout-campaign-logs-v2';
const SQL_WASM='https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.wasm';
const $=id=>document.getElementById(id);
let sourceFiles=[];
let analysis=null;
let output=null;
let sqlPromise=null;
let bundleDownloaded=false;

function openDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(STORE_NAME))request.result.createObjectStore(STORE_NAME,{keyPath:'id'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function dbAction(mode,action){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,mode);
    const request=action(tx.objectStore(STORE_NAME));
    tx.oncomplete=()=>{db.close();resolve(request.result)};
    tx.onerror=()=>{db.close();reject(tx.error||request.error)};
  });
}
const getAll=()=>dbAction('readonly',store=>store.getAll());
const put=record=>dbAction('readwrite',store=>store.put(record));
async function deleteRecords(ids){
  if(!ids.length)return;
  const db=await openDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readwrite');
    const store=tx.objectStore(STORE_NAME);
    ids.forEach(id=>store.delete(id));
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=tx.onerror;
  });
  db.close();
}
const getSettings=()=>{try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return {}}};
const saveSettings=value=>localStorage.setItem(SETTINGS_KEY,JSON.stringify(value));
const getLogs=()=>{try{return JSON.parse(localStorage.getItem(LOG_KEY)||'{}')}catch{return {}}};
const saveLogs=value=>localStorage.setItem(LOG_KEY,JSON.stringify(value));
const safeName=value=>String(value||'campaign').replace(/[\\/:*?"<>|]/g,'_').trim()||'campaign';
const timestamp=()=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date()).replace(/[/:\s]/g,'-');

function showStatus(target,text,type='ok'){
  target.textContent=text;
  target.className='status show '+type;
}
function packageId(intent){
  const match=String(intent||'').match(/(?:component|package)=([^/;]+)/i);
  return match?match[1]:'';
}
function isLine(row){
  return /^jp\.naver\.line\./i.test(packageId(row.intent));
}
function query(db,sql,params=[]){
  const stmt=db.prepare(sql);
  const rows=[];
  try{
    stmt.bind(params);
    while(stmt.step())rows.push(stmt.getAsObject());
    return rows;
  }finally{stmt.free()}
}
async function sqlEngine(){
  if(!sqlPromise){
    if(typeof initSqlJs!=='function')throw new Error('解析プログラムを読み込めません。通信状態を確認してください。');
    sqlPromise=initSqlJs({locateFile:()=>SQL_WASM});
  }
  return sqlPromise;
}
async function openNova(record){
  if(!record?.blob)throw new Error('NOVAバックアップを選択してください。');
  if(typeof JSZip==='undefined')throw new Error('バックアップ読込プログラムを読み込めません。');
  const zip=await JSZip.loadAsync(await record.blob.arrayBuffer());
  const dbEntry=zip.file('nova.db');
  if(!dbEntry)throw new Error('nova.dbがないため、NOVAバックアップとして読めません。');
  const SQL=await sqlEngine();
  const db=new SQL.Database(new Uint8Array(await dbEntry.async('arraybuffer')));
  const table=query(db,"SELECT name FROM sqlite_master WHERE type='table' AND name='favorites'");
  if(!table.length){db.close();throw new Error('ホーム画面データが見つかりません。')}
  return {zip,db};
}
function selectRecord(id){return sourceFiles.find(row=>row.id===id)}
function fillSelect(select,selected,pinnedId=''){
  select.innerHTML='<option value="">選択してください</option>'+sourceFiles.map(row=>'<option value="'+row.id+'">'+(row.id===pinnedId?'★初期｜':'')+String(row.fileName||'NOVAバックアップ').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</option>').join('');
  if(selected&&sourceFiles.some(row=>row.id===selected))select.value=selected;
}
function assignFile(settings,id,device){
  if(!id)return;
  settings.fileDevices=settings.fileDevices||{};
  settings.fileDevices[id]=settings.fileDevices[id]||{};
  settings.fileDevices[id][device]=true;
}
function migrateSettings(settings){
  settings.devices=settings.devices||{};
  for(const [device,data] of Object.entries(settings.devices)){
    if(!data.pinnedBaseFile&&data.baseFile)data.pinnedBaseFile=data.baseFile;
    if(!data.selectedBaseFile)data.selectedBaseFile=data.baseFile||data.pinnedBaseFile||'';
    assignFile(settings,data.pinnedBaseFile,device);
    assignFile(settings,data.selectedBaseFile,device);
    assignFile(settings,data.afterFile,device);
  }
  return settings;
}
function currentDeviceSettings(settings=getSettings()){
  return settings.devices?.[$('device').value]||{};
}
function renderBaseState(){
  const data=currentDeviceSettings();
  const pinned=selectRecord(data.pinnedBaseFile);
  $('baseMark').textContent=pinned?'★初期：'+pinned.fileName:'初期データはまだ固定されていません。';
  fillSelect($('baseFile'),$('baseFile').value||data.selectedBaseFile||data.pinnedBaseFile,data.pinnedBaseFile);
}
function updateSettings(){
  const previous=migrateSettings(getSettings());
  const device=$('device').value;
  const value={...previous,device,devices:{...(previous.devices||{})}};
  const current={...(value.devices[device]||{})};
  current.selectedBaseFile=$('baseFile').value;
  current.baseFile=current.selectedBaseFile;
  current.afterFile=$('afterFile').value;
  value.devices[device]=current;
  assignFile(value,current.selectedBaseFile,device);
  assignFile(value,current.afterFile,device);
  saveSettings(value);
}
function pinInitialFile(){
  const id=$('baseFile').value;
  const record=selectRecord(id);
  if(!record)return showStatus($('analysisStatus'),'固定する初期データを選択してください。','error');
  const settings=migrateSettings(getSettings());
  const device=$('device').value;
  const current={...(settings.devices?.[device]||{})};
  const old=selectRecord(current.pinnedBaseFile);
  const message=old&&old.id!==id?'端末 '+device+' の初期データを更新しますか？\n現在：'+old.fileName+'\n更新後：'+record.fileName:'「'+record.fileName+'」を端末 '+device+' の初期データとして固定しますか？';
  if(!confirm(message))return;
  settings.devices=settings.devices||{};
  current.pinnedBaseFile=id;
  current.selectedBaseFile=id;
  current.baseFile=id;
  settings.devices[device]=current;
  assignFile(settings,id,device);
  saveSettings(settings);
  renderBaseState();
  showStatus($('analysisStatus'),'「'+record.fileName+'」を★初期として固定しました。');
}
function deviceLogs(device){
  const all=getLogs();
  return all[device]||{order:[],campaigns:{}};
}
function escapeHtml(value){
  return String(value).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function currentCampaign(){
  return $('campaignSelect').value==='__new__'?$('campaign').value.trim():$('campaignSelect').value;
}
function renderCampaignSelect(logs,selected){
  const names=logs.order.filter(name=>logs.campaigns[name]);
  $('campaignSelect').innerHTML='<option value="__new__">新規キャンペーンを入力</option>'+names.map(name=>'<option value="'+escapeHtml(name)+'">'+escapeHtml(name)+'</option>').join('');
  $('campaignSelect').value=selected&&names.includes(selected)?selected:'__new__';
  $('campaignNewField').hidden=$('campaignSelect').value!=='__new__';
}
function renderCampaigns(logs){
  const rows=logs.order.filter(name=>logs.campaigns[name]).map(name=>{
    const count=(logs.campaigns[name]?.packages||[]).length;
    return '<div class="campaignRow"><span class="campaignName">'+escapeHtml(name)+'（'+count+'件）</span><button class="campaignEnd" type="button" data-campaign="'+escapeHtml(name)+'">終了</button></div>';
  });
  $('campaigns').innerHTML=rows.length?rows.join(''):'<p class="hint">キャンペーンログはまだありません。</p>';
}
function endCampaign(name){
  if(!confirm('「'+name+'」を終了しますか？\nハズレログを削除し、次回から追加ページへ配置しません。'))return;
  const device=$('device').value;
  const all=getLogs();
  const logs=all[device]||{order:[],campaigns:{}};
  delete logs.campaigns[name];
  logs.order=logs.order.filter(item=>item!==name);
  logs.updatedAt=new Date().toISOString();
  all[device]=logs;
  saveLogs(all);
  renderCampaigns(logs);
  renderCampaignSelect(logs);
  analysis=null;
  output=null;
  $('generate').disabled=true;
  $('summary').hidden=true;
  $('downloads').classList.remove('show');
  showStatus($('generateStatus'),'「'+name+'」を終了し、ログを削除しました。');
}

async function analyze(){
  if(analysis?.workingDb)analysis.workingDb.close();
  analysis=null;
  output=null;
  $('generate').disabled=true;
  $('downloads').classList.remove('show');
  $('summary').hidden=true;
  const campaign=currentCampaign();
  const base=selectRecord($('baseFile').value);
  const after=selectRecord($('afterFile').value);
  if(!campaign)return showStatus($('analysisStatus'),'キャンペーン名を入力してください。','error');
  if(!base||!after)return showStatus($('analysisStatus'),'初期データと抽選後データを選択してください。','error');
  const pinnedId=currentDeviceSettings().pinnedBaseFile;
  if(!pinnedId)return showStatus($('analysisStatus'),'先に初期データを選び、「★ 初期データとして固定」を押してください。','error');
  if(base.id!==pinnedId)return showStatus($('analysisStatus'),'選択した初期データに★初期の印がありません。固定してから解析してください。','error');
  if(base.id===after.id)return showStatus($('analysisStatus'),'初期データと抽選後データは別のファイルを選択してください。','error');
  showStatus($('analysisStatus'),'NOVAバックアップを解析しています。');
  let baseOpened,afterOpened;
  try{
    baseOpened=await openNova(base);
    afterOpened=await openNova(after);
    const baseRows=query(baseOpened.db,'SELECT * FROM favorites');
    const afterRows=query(afterOpened.db,'SELECT * FROM favorites');
    const canonical=baseRows.filter(row=>
      Number(row.container)===-100&&
      Number(row.itemType)===0&&
      Number(row.cellY)>=0&&Number(row.cellY)<=5&&
      isLine(row)
    )
      .sort((a,b)=>Number(a.screen)-Number(b.screen)||Number(a.cellY)-Number(b.cellY)||Number(a.cellX)-Number(b.cellX)||Number(a._id)-Number(b._id));
    const byPackage=new Map();
    for(const row of canonical){const id=packageId(row.intent);if(id&&!byPackage.has(id))byPackage.set(id,row)}
    const priority=[...byPackage.keys()];
    const canonicalScreens=canonical.map(row=>Number(row.screen)).filter(Number.isFinite);
    const desktopScreens=afterRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)).filter(Number.isFinite);
    const firstScreen=Math.min(...(canonicalScreens.length?canonicalScreens:desktopScreens));
    const desktopFolders=afterRows
      .filter(row=>Number(row.container)===-100)
      .map(folder=>({
        folder,
        line:afterRows.filter(row=>Number(row.container)===Number(folder._id)&&Number(row.itemType)===0&&isLine(row))
      }))
      .filter(item=>item.line.length);
    const byBottomRight=(a,b)=>Number(b.folder.cellY)-Number(a.folder.cellY)||Number(b.folder.cellX)-Number(a.folder.cellX)||Number(a.folder._id)-Number(b.folder._id);
    const exactFolder=desktopFolders.find(item=>
      Number(item.folder.screen)===firstScreen&&
      Number(item.folder.cellX)===4&&
      Number(item.folder.cellY)===6
    );
    const firstPageFolders=desktopFolders.filter(item=>Number(item.folder.screen)===firstScreen).sort(byBottomRight);
    const fallbackFolders=[...desktopFolders].sort((a,b)=>Number(a.folder.screen)-Number(b.folder.screen)||byBottomRight(a,b));
    const loserFolderData=exactFolder||firstPageFolders.find(item=>Number(item.folder.cellY)>=6)||firstPageFolders[0]||fallbackFolders[0];
    if(!loserFolderData)throw new Error('1ページ目の下段に、LINEを含むハズレ垢フォルダーがありません。');
    const loserFolder=loserFolderData.folder;
    const folderLine=loserFolderData.line;
    const folderPackages=[...new Set(folderLine.map(row=>packageId(row.intent)).filter(Boolean))];
    const loserSet=new Set(folderPackages);
    const matched=priority.filter(id=>loserSet.has(id));
    const missing=folderPackages.filter(id=>!byPackage.has(id));
    const maxScreen=Math.max(0,...baseRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)||0));
    analysis={
      campaign,base,after,
      workingZip:afterOpened.zip,
      workingDb:afterOpened.db,
      baseRows,afterRows,byPackage,priority,
      folderId:Number(loserFolder._id),
      folderPackages,matched,missing,maxScreen
    };
    baseOpened.db.close();
    const summary=[
      ['初期LINE',byPackage.size+'件'],
      ['7段目LINE',folderPackages.length+'件'],
      ['配置対象',matched.length+'件'],
      ['初期にないID',missing.length+'件']
    ];
    $('summary').innerHTML=summary.map(item=>'<div class="summaryItem"><div class="summaryLabel">'+item[0]+'</div><div class="summaryValue">'+item[1]+'</div></div>').join('');
    $('summary').hidden=false;
    if(!matched.length){
      analysis.workingDb.close();
      analysis=null;
      return showStatus($('analysisStatus'),'7段目右端のフォルダー内に、初期データと一致するLINEがありません。','error');
    }
    $('generate').disabled=false;
    showStatus($('analysisStatus'),missing.length?'一致するLINEを確認しました。初期データにないIDは配置しません。':'一致するLINEを確認しました。');
  }catch(error){
    if(baseOpened?.db)baseOpened.db.close();
    if(afterOpened?.db)afterOpened.db.close();
    showStatus($('analysisStatus'),String(error?.message||error),'error');
  }
}

function insertCopy(db,columns,source,id,title,screen,cellX,cellY){
  const customTitle=title!==null&&title!==undefined;
  const row={
    ...source,
    _id:id,
    title:customTitle?title:source.title,
    container:-100,
    screen,
    cellX,
    cellY,
    rank:0,
    modified:Date.now(),
    novaFlags:customTitle?(Number(source.novaFlags||0)|2):source.novaFlags
  };
  const names=columns.map(name=>'"'+String(name).replaceAll('"','""')+'"').join(',');
  const values=columns.map(()=>'?').join(',');
  const stmt=db.prepare('INSERT INTO favorites ('+names+') VALUES ('+values+')');
  try{stmt.run(columns.map(name=>row[name]===undefined?null:row[name]))}finally{stmt.free()}
}
async function generate(){
  if(!analysis)return;
  $('generate').disabled=true;
  bundleDownloaded=false;
  showStatus($('generateStatus'),'更新ファイルを作成しています。');
  try{
    const device=$('device').value;
    const allLogs=getLogs();
    const logs=allLogs[device]||{order:[],campaigns:{}};
    if(!logs.campaigns[analysis.campaign]){
      logs.order.push(analysis.campaign);
      logs.campaigns[analysis.campaign]={createdAt:new Date().toISOString(),packages:[]};
    }
    const mergedPackages=new Set([
      ...(logs.campaigns[analysis.campaign].packages||[]),
      ...analysis.matched
    ]);
    logs.campaigns[analysis.campaign].packages=analysis.priority.filter(id=>mergedPackages.has(id));
    logs.updatedAt=new Date().toISOString();
    allLogs[device]=logs;

    const db=analysis.workingDb;
    const columns=query(db,'PRAGMA table_info(favorites)').map(row=>row.name);
    let nextId=Number(query(db,'SELECT MAX(_id) AS id FROM favorites')[0]?.id||0)+1;
    let nextScreen=analysis.maxScreen+1;
    const pages=[];
    db.run('BEGIN');
    try{
      const staleDesktopLine=analysis.afterRows.filter(row=>
        Number(row.container)===-100&&
        Number(row.itemType)===0&&
        isLine(row)&&(
          Number(row.screen)>analysis.maxScreen||
          (Number(row.cellY)>=0&&Number(row.cellY)<=5)
        )
      );
      const remove=db.prepare('DELETE FROM favorites WHERE _id=?');
      try{for(const row of staleDesktopLine)remove.run([Number(row._id)])}finally{remove.free()}
      for(const source of analysis.byPackage.values()){
        insertCopy(db,columns,source,nextId++,null,Number(source.screen),Number(source.cellX),Number(source.cellY));
      }
      for(const name of logs.order){
        const ids=(logs.campaigns[name]?.packages||[]).filter(id=>analysis.byPackage.has(id));
        const startScreen=nextScreen;
        ids.forEach((packageName,index)=>{
          const pageOffset=Math.floor(index/30);
          const slot=index%30;
          insertCopy(db,columns,analysis.byPackage.get(packageName),nextId++,name,nextScreen+pageOffset,slot%5,Math.floor(slot/5));
        });
        const pageCount=Math.ceil(ids.length/30);
        if(pageCount){
          pages.push({campaign:name,count:ids.length,start:startScreen,end:startScreen+pageCount-1});
          nextScreen+=pageCount;
        }
      }
      db.run('COMMIT');
    }catch(error){db.run('ROLLBACK');throw error}

    const generatedDb=db.export();
    analysis.workingZip.file('nova.db',generatedDb);
    const novaBlob=await analysis.workingZip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const stamp=timestamp();
    const novaName='端末'+device+'_'+safeName(analysis.campaign)+'_'+stamp+'.novabackup';
    const logData={
      version:2,
      device,
      updatedAt:logs.updatedAt,
      source:{base:analysis.base.fileName,after:analysis.after.fileName},
      rule:{canonicalRows:'1-6',loserFolder:'page1-row7-right',dock:'keep-after-draw'},
      campaigns:logs.order.map(name=>({name,createdAt:logs.campaigns[name].createdAt,packages:logs.campaigns[name].packages})),
      pages
    };
    const bundle=new JSZip();
    bundle.file('01_初期データ_'+analysis.base.fileName,analysis.base.blob);
    bundle.file('02_抽選後データ_'+analysis.after.fileName,analysis.after.blob);
    bundle.file('03_作成データ_'+novaName,novaBlob);
    bundle.file('04_ハズレログ.json',JSON.stringify(logData,null,2));
    const bundleBlob=await bundle.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const bundleName='端末'+device+'_ホーム画面更新_'+stamp+'.zip';
    const record={
      id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
      kind:'generated',
      device,
      campaign:analysis.campaign,
      fileName:novaName,
      fileSize:novaBlob.size,
      blob:novaBlob,
      bundleName,
      bundleBlob,
      receivedAt:Date.now(),
      pages
    };
    await put(record);
    saveLogs(allLogs);
    output=record;
    analysis.workingDb.close();
    analysis=null;
    renderCampaigns(logs);
    renderCampaignSelect(logs,record.campaign);
    $('downloads').classList.add('show');
    const pageText=pages.map(page=>page.campaign+'：'+(page.start+1)+'～'+(page.end+1)+'ページ').join('／');
    showStatus($('generateStatus'),'作成完了 '+(pageText||'追加ページなし'));
  }catch(error){
    showStatus($('generateStatus'),String(error?.message||error),'error');
  }finally{
    $('generate').disabled=true;
  }
}
function download(blob,name){
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=name;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function completeWork(){
  const device=$('device').value;
  const settings=migrateSettings(getSettings());
  const current=settings.devices?.[device]||{};
  const pinnedId=current.pinnedBaseFile;
  if(!pinnedId)return showStatus($('cleanupStatus'),'★初期データがないため削除できません。','error');
  const rows=await getAll();
  const pinnedIds=new Set(Object.values(settings.devices||{}).map(data=>data.pinnedBaseFile).filter(Boolean));
  const deleteIds=[];
  for(const row of rows){
    if(row.kind==='generated'&&row.device===device){
      deleteIds.push(row.id);
      continue;
    }
    if(row.kind==='generated')continue;
    const assigned=settings.fileDevices?.[row.id]||{};
    if(!assigned[device]||row.id===pinnedId)continue;
    delete assigned[device];
    const usedElsewhere=Object.values(assigned).some(Boolean);
    if(!usedElsewhere&&!pinnedIds.has(row.id))deleteIds.push(row.id);
    if(usedElsewhere)settings.fileDevices[row.id]=assigned;
    else delete settings.fileDevices[row.id];
  }
  if(!deleteIds.length)return showStatus($('cleanupStatus'),'この端末に削除対象の使用済みデータはありません。');
  const backupWarning=bundleDownloaded?'':'\nバックアップZIPを保存済みか確認してください。';
  if(!confirm('端末 '+device+' の使用済みデータ '+deleteIds.length+'件を削除しますか？\n★初期データとキャンペーンログは残ります。'+backupWarning))return;
  await deleteRecords(deleteIds);
  current.selectedBaseFile=pinnedId;
  current.baseFile=pinnedId;
  current.afterFile='';
  settings.devices[device]=current;
  saveSettings(settings);
  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  fillSelect($('baseFile'),pinnedId,pinnedId);
  fillSelect($('afterFile'),'');
  renderBaseState();
  output=null;
  bundleDownloaded=false;
  $('downloads').classList.remove('show');
  showStatus($('cleanupStatus'),'作業完了：端末 '+device+' の使用済みデータを'+deleteIds.length+'件削除しました。');
}

async function init(){
  for(let i=1;i<=15;i++){
    const value=String(i).padStart(2,'0');
    $('device').insertAdjacentHTML('beforeend','<option value="'+value+'">端末 '+value+(value==='06'?'（専用）':'')+'</option>');
  }
  const settings=migrateSettings(getSettings());
  $('device').value=settings.device||'01';
  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  const savedDevice=settings.devices?.[$('device').value]||settings;
  if(!settings.devices?.[$('device').value]&&savedDevice.baseFile){
    settings.devices=settings.devices||{};
    settings.devices[$('device').value]={...savedDevice,pinnedBaseFile:savedDevice.baseFile,selectedBaseFile:savedDevice.baseFile};
    assignFile(settings,savedDevice.baseFile,$('device').value);
    assignFile(settings,savedDevice.afterFile,$('device').value);
  }
  saveSettings(settings);
  const activeSettings=settings.devices?.[$('device').value]||savedDevice;
  fillSelect($('baseFile'),activeSettings.selectedBaseFile||activeSettings.pinnedBaseFile||activeSettings.baseFile,activeSettings.pinnedBaseFile);
  fillSelect($('afterFile'),activeSettings.afterFile);
  renderBaseState();
  renderCampaignSelect(deviceLogs($('device').value));
  $('device').addEventListener('change',()=>{
    const next=getSettings().devices?.[$('device').value]||{};
    fillSelect($('baseFile'),next.selectedBaseFile||next.pinnedBaseFile||next.baseFile,next.pinnedBaseFile);
    fillSelect($('afterFile'),next.afterFile);
    updateSettings();
    renderBaseState();
    analysis=null;
    $('generate').disabled=true;
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
    const logs=deviceLogs($('device').value);
    renderCampaigns(logs);
    renderCampaignSelect(logs);
  });
  $('campaignSelect').addEventListener('change',()=>{
    $('campaignNewField').hidden=$('campaignSelect').value!=='__new__';
    analysis=null;
    $('generate').disabled=true;
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
  });
  [$('baseFile'),$('afterFile')].forEach(element=>element.addEventListener('change',()=>{
    updateSettings();
    renderBaseState();
    analysis=null;
    $('generate').disabled=true;
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
  }));
  renderCampaigns(deviceLogs($('device').value));
  if(!sourceFiles.length)showStatus($('analysisStatus'),'先に「ファイル貼りつけ」からNOVAバックアップを保存してください。','error');
}

$('analyze').addEventListener('click',analyze);
$('generate').addEventListener('click',generate);
$('pinBase').addEventListener('click',pinInitialFile);
$('campaigns').addEventListener('click',event=>{
  const button=event.target.closest('.campaignEnd');
  if(button)endCampaign(button.dataset.campaign);
});
$('downloadNova').addEventListener('click',()=>output&&download(output.blob,output.fileName));
$('downloadBundle').addEventListener('click',()=>{
  if(!output)return;
  download(output.bundleBlob,output.bundleName);
  bundleDownloaded=true;
  showStatus($('cleanupStatus'),'バックアップZIPを保存しました。復元確認後に「作業完了」を押してください。');
});
$('completeWork').addEventListener('click',()=>completeWork().catch(error=>showStatus($('cleanupStatus'),String(error?.message||error),'error')));
init().catch(error=>showStatus($('analysisStatus'),String(error?.message||error),'error'));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
