<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>ホーム画面編集</title>
<style>
@font-face{font-family:"Corporate Logo Rounded";src:url("./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:"Corporate Logo Rounded","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:16px;font-weight:700;font-synthesis:none;letter-spacing:.02em}
button,input,select,textarea,option{font-family:inherit!important}
.wrap{width:min(720px,100%);margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;margin-bottom:14px}
.cut{border:3px solid #fff;background:#000;color:#fff;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.back,.button{display:grid;place-items:center;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit;text-align:center;text-decoration:none;cursor:pointer}
.back{min-height:58px}
.title{display:grid;place-items:center;min-width:0;padding:8px;font-size:20px;font-weight:700;text-align:center}
.panel{padding:10px;margin-bottom:8px}
.panelTitle{margin:0 0 8px;font-size:19px}
.grid{display:grid;gap:8px}.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field{display:grid;gap:4px}.fullRow{grid-column:1/-1}.field:has(#baseFile){display:none}
.label{font-size:13px;color:#ddd}
select,input{width:100%;min-height:42px;padding:5px 8px;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit}
.miniButton{width:100%;min-height:42px;padding:7px 9px;border:2px solid #ffd43b;border-radius:0;background:#000;color:#ffd43b;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.miniButton:hover,.miniButton:focus-visible{background:#ffd43b;color:#000;outline:none}
.baseMark{min-height:20px;color:#ffd43b;font-size:12px;line-height:1.5}
.hint{margin:0;color:#aaa;font-size:10.5px;line-height:1.25;white-space:nowrap}
.bootstrapNotice{margin:0 0 10px;padding:8px;border:2px solid #ffd43b;background:#211a00;color:#fff;text-align:center;font-size:14px;line-height:1.35}
.button{width:100%;min-height:58px;padding:5px 5px;font-size:16px;font-weight:700;line-height:1.3}
.button:hover,.button:focus-visible,.button:active,.back:hover,.back:focus-visible{background:#fff;color:#000;outline:none}
.button[disabled]{border-color:#666;color:#777;cursor:not-allowed}
.status{display:none;margin-top:8px;padding:8px;border:2px solid #fff;line-height:1.4}
.status.show{display:block}
.status.error{border-color:#ff5b5b;color:#ff8a8a}
.status.ok{border-color:#ffd43b;color:#fff}
.analysisRow,.createActions,.workGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.analysisRow .button{min-width:0}.analysisMessage{display:grid;place-items:center;min-height:58px;margin:0;padding:5px 4px;border:2px solid #777;text-align:center;font-size:11.5px;line-height:1.35;white-space:pre-line}.analysisMessage.show{border-color:#ffd43b}.analysisMessage.error{border-color:#ff5b5b;color:#ff8a8a}
.fileAge{display:grid;place-items:center;min-height:86px;margin-top:7px;padding:8px;border:3px solid #70c8ff;background:#071a2a;color:#fff;text-align:center;line-height:1.05}.fileAge[hidden]{display:none}.fileAge strong{display:block;color:#70c8ff;font-size:34px;line-height:1}.fileAge span{display:block;margin-top:6px;font-size:17px}.fileAge.caution{border-color:#ffd43b;background:#211a00}.fileAge.caution strong{color:#ffd43b}.fileAge.stale,.fileAge.future,.fileAge.unknown{border-color:#ff5b5b;background:#240609}.fileAge.stale strong,.fileAge.future strong,.fileAge.unknown strong{color:#ff8a8a}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.summaryItem{padding:9px;border:1px solid #777}
.summaryLabel{font-size:12px;color:#aaa}
.summaryValue{margin-top:3px;font-size:18px;color:#ffd43b}
.campaigns{display:grid;gap:8px;margin-top:12px}
.campaignRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px;border:1px solid #777;font-size:14px}
.campaignName{min-width:0;overflow-wrap:anywhere}
.campaignEnd{flex:0 0 auto;min-width:74px;min-height:40px;padding:6px 12px;border:2px solid #ff5b5b;border-radius:0;background:#000;color:#ff8a8a;font:inherit;font-weight:700;cursor:pointer}
.campaignEnd:hover,.campaignEnd:focus-visible{background:#ff5b5b;color:#000;outline:none}
.downloads{display:none;gap:10px;margin-top:14px}
.downloads.show{display:grid}
.download{border-color:#ffd43b;color:#ffd43b}
.danger{margin-top:0;border-color:#ff5b5b;color:#ff8a8a}
.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{position:relative;display:grid;place-items:center;min-width:0;min-height:42px;padding:3px 2px;border:2px solid #fff;cursor:pointer;text-align:center;font-size:12px;line-height:1.2}.choice input{position:absolute;opacity:0}.choice:has(input:checked){border-color:#70c8ff;background:#14375a;color:#fff;box-shadow:inset 0 0 0 2px #70c8ff}.rangeSwitch{width:100%;min-width:0}.rangeInputs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center}.rangeInputs input{min-width:0;text-align:center}.rangeAdditionalText{display:none;min-height:42px;padding:4px 8px;border:2px solid #fff;background:#000;color:#fff;place-items:center;text-align:center;line-height:1.08}.rangeSwitch.additional .rangeInputs{display:none}.rangeSwitch.additional .rangeAdditionalText{display:grid}.displayField[hidden]{display:none!important}.warning{border-color:#ff5b5b!important;color:#ffb0b0!important;white-space:pre-line}.hiddenCompat{display:none!important}.displayField{min-height:42px;padding:5px 8px;border:2px solid #fff;background:#000;color:#fff;display:grid;place-items:center;text-align:center}.twoLine{line-height:1.25}.saveToast{position:fixed;inset:0;z-index:1400;display:none;place-items:center;background:rgba(0,0,0,.45);padding:20px}.saveToast.show{display:grid}.saveToastBox{width:min(390px,92vw);padding:28px 18px;border:3px solid #fff;background:#000;color:#fff;text-align:center;font-size:20px;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}.button.blankAction:disabled{border-color:#555;color:transparent;background:#000;opacity:.55}
.confirmModal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58)}.confirmModal.show{display:flex}.confirmBox{width:min(430px,100%);min-height:300px;max-height:calc(100dvh - 36px);display:flex;flex-direction:column;justify-content:space-between;padding:28px 24px 20px;border-radius:24px;background:#fff;color:#3f3f48;font-family:inherit}.confirmBox>div:first-child{min-height:0;overflow:auto}.confirmTitle{margin-bottom:14px;font-size:22px;font-weight:700}.confirmMessage{white-space:pre-line;font-size:18px;line-height:1.55}.confirmActions{display:flex;flex:0 0 auto;justify-content:flex-end;gap:16px;margin-top:24px}.confirmActions button{min-width:90px;padding:10px;border:0;background:transparent;color:#4d4f82;font-family:inherit!important;font-size:18px;font-weight:700;line-height:1.2}
@media(max-width:390px){.wrap{padding-left:9px;padding-right:9px}.top{grid-template-columns:76px minmax(0,1fr)}.title{font-size:18px}.panel{padding:12px}.summary{grid-template-columns:1fr}}
/* typography-v1: 20 / 18 / 16 / 14 / 12 */
.title{font-size:20px}
.panelTitle{font-size:18px}
.label{font-size:14px}
select,input,.choice,.displayField,.rangeAdditionalText,.button,.campaignRow,.summaryValue{font-size:16px}
.hint,.analysisMessage,.summaryLabel,.baseMark,.status{font-size:12px}
.hint,.analysisMessage,.status{line-height:1.3}
.saveToastBox{font-size:20px}
.confirmTitle{font-size:20px}
.confirmMessage,.confirmActions button{font-size:16px}
/* work-target-font-match-v1 */
.workGrid .choice{font-size:16px!important;line-height:1.08}
.rangeAdditionalText{font-size:16px!important;line-height:1.08}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="./home-layout.html">◀ 戻る</a>
    <div class="title cut">ホーム画面編集</div>
  </header>

  <section class="panel cut">
    <h1 class="panelTitle">1. 作業範囲</h1>
    <p id="bootstrapNotice" class="bootstrapNotice">15端末 初回設定モード<br>6ページ：プレモル ／ 7ページ：タコハイ</p>
    <div class="grid">
      <div class="workGrid">
        <div class="field"><span class="label">作業対象</span><div class="choiceRow">
          <label class="choice"><input type="radio" name="workTarget" value="default" checked>デフォルト<br>配置</label>
          <label class="choice"><input type="radio" name="workTarget" value="additional">追加<br>ページ</label>
        </div></div>
        <div class="field"><span class="label">作業範囲</span>
          <div id="rangeSwitch" class="rangeSwitch">
            <div class="rangeInputs"><input id="rangeStart" type="number" min="1" inputmode="numeric" placeholder="開始"><span>～</span><input id="rangeEnd" type="number" min="1" inputmode="numeric" placeholder="終了"></div>
            <div class="rangeAdditionalText">追加<br>ページ</div>
          </div>
        </div>
      </div>
      <div class="field"><span class="label">キャンペーン</span><div id="campaignDisplay" class="displayField">未設定</div><select id="campaignSelect" class="hiddenCompat"></select></div>
      <div class="field"><span class="label">除外対象</span><div class="choiceRow">
        <label class="choice"><input type="radio" name="drawResult" value="winner">当選</label>
        <label class="choice"><input type="radio" name="drawResult" value="loser" checked>ハズレ</label>
      </div></div>
      <label class="field"><span class="label">抽選後データ</span><select id="afterFile"></select><div id="fileAge" class="fileAge" hidden aria-live="polite"></div></label>
    </div>
    <div class="hiddenCompat" aria-hidden="true">
      <select id="device"></select>
      <select id="baseFile"></select>
      <button id="pinBase" type="button"></button>
      <span id="baseMark"></span>
    </div>
    <p class="hint">初期データは端末ごとに事前登録済みの固定データを使用します。</p>
  </section>

  <section class="panel cut">
    <h2 class="panelTitle">2. 解析</h2>
    <div class="analysisRow"><button id="analyze" class="button" type="button">除外対象を確認</button><div id="analysisStatus" class="analysisMessage" aria-live="polite"></div></div>
    <div id="summary" class="summary" hidden></div>
  </section>

  <section class="panel cut">
    <h2 class="panelTitle">3. 更新ファイルの作成</h2>
    <div id="campaigns" hidden></div>
    <div class="createActions"><button id="generate" class="button" type="button" disabled>更新ファイルを<br>作成する</button><button id="completeWork" class="button danger blankAction" type="button" disabled aria-label="一時保存データ削除"></button></div>
    <div id="generateStatus" class="status" aria-live="polite"></div>
    <div id="downloads" hidden></div>
    <div id="cleanupStatus" class="status" aria-live="polite"></div>
  </section>
</main>
<div id="confirmModal" class="confirmModal" aria-hidden="true"><div class="confirmBox" role="dialog" aria-modal="true"><div><div id="confirmTitle" class="confirmTitle"></div><div id="confirmMessage" class="confirmMessage"></div></div><div class="confirmActions"><button id="confirmCancel" type="button">キャンセル</button><button id="confirmOk" type="button">OK</button></div></div></div>
<div id="saveToast" class="saveToast" aria-hidden="true"><div class="saveToastBox">ファイルを保存しました。</div></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
<script src="./home-layout-marker-core.js?v=2"></script>
<script>
const DB_NAME='winning-url-manager-home-layout';
const STORE_NAME='backups';
const SETTINGS_KEY='home-layout-settings-v1';
const LOG_KEY='home-layout-campaign-logs-v2';
const SQL_WASM='https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.wasm';
const API='https://winning-url-api.45kikurage.workers.dev';
const LAYOUT_CLIENT_VERSION='2026-09-11-additional-visible-d1-v1';
const TEMP_INITIAL_SETUP=true;
const MarkerCore=globalThis.HomeLayoutMarkerCore;
const $=id=>document.getElementById(id);
let sourceFiles=[];
let analysis=null;
let output=null;
let sqlPromise=null;
let serverCampaigns=[];
let managedSettings=null;
let analyzeBusy=false;
function resetCleanupButton(){const button=$('completeWork');if(!button)return;button.disabled=true;button.innerHTML='';button.classList.add('blankAction')}
function revealCleanupButton(){const button=$('completeWork');if(!button)return;button.innerHTML='初期データ以外<br>一時保存データを削除';button.disabled=false;button.classList.remove('blankAction')}
function showSaveToast(){const toast=$('saveToast');toast.classList.add('show');toast.setAttribute('aria-hidden','false');setTimeout(()=>{toast.classList.remove('show');toast.setAttribute('aria-hidden','true');revealCleanupButton()},3000)}
function resetGenerateButton(){output=null;const button=$('generate');if(!button)return;button.innerHTML='更新ファイルを<br>作成する';button.classList.remove('download');button.disabled=true;resetCleanupButton()}

async function loadManagedSettings(){
  const res=await apiCall('/api/layout/settings');
  managedSettings=res.settings||null;
  applyManagedSettings();
  return managedSettings;
}
function applyManagedSettings(){
  if(TEMP_INITIAL_SETUP){applyInitialSetupModeUI();return}
  if(!managedSettings)return;
  const result=document.querySelector('input[name="drawResult"][value="'+managedSettings.draw_result+'"]');if(result)result.checked=true;
  const target=document.querySelector('input[name="workTarget"][value="'+managedSettings.work_target+'"]');if(target)target.checked=true;
  const campaign=serverCampaigns.find(row=>row.id===managedSettings.campaign_id);
  if(managedSettings.work_target!=='additional'&&campaign&&[...$('campaignSelect').options].some(option=>option.value===campaign.name))$('campaignSelect').value=campaign.name;
  $('rangeStart').value=Number(managedSettings.range_start||1);$('rangeEnd').value=Number(managedSettings.range_end||150);
  [$('campaignSelect'),$('rangeStart'),$('rangeEnd')].forEach(el=>{el.disabled=true;el.title='管理画面の一括設定を使用中';});
  document.querySelectorAll('input[name="drawResult"],input[name="workTarget"]').forEach(el=>{el.disabled=true;el.closest('.choice')?.setAttribute('title','管理画面の一括設定を使用中');});  syncWorkModeUI();
}


async function apiCall(path,options={}){
  let token='';try{token=localStorage.getItem('winning-url-manager-token')||''}catch{}
  const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json','X-Layout-Client-Version':LAYOUT_CLIENT_VERSION,...(token?{'X-Manager-Token':token}:{}),...(options.headers||{})}});
  if(response.status===401&&!options._retried){const entered=prompt('管理端末キーを入力してください。');if(entered){localStorage.setItem('winning-url-manager-token',entered);return apiCall(path,{...options,_retried:true})}}
  const text=await response.text();let data;try{data=JSON.parse(text)}catch{data={error:text}}
  if(!response.ok){const error=new Error(data.error||('HTTP '+response.status));error.data=data;throw error}
  return data;
}

function openDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(STORE_NAME))request.result.createObjectStore(STORE_NAME,{keyPath:'id'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function dbAction(mode,action){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,mode);
    const request=action(tx.objectStore(STORE_NAME));
    tx.oncomplete=()=>{db.close();resolve(request.result)};
    tx.onerror=()=>{db.close();reject(tx.error||request.error)};
  });
}
const getAll=()=>dbAction('readonly',store=>store.getAll());
const put=record=>dbAction('readwrite',store=>store.put(record));
async function deleteRecords(ids){
  if(!ids.length)return;
  const db=await openDb();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,'readwrite');
    const store=tx.objectStore(STORE_NAME);
    ids.forEach(id=>store.delete(id));
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=tx.onerror;
  });
  db.close();
}
const getSettings=()=>{try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return {}}};
const saveSettings=value=>localStorage.setItem(SETTINGS_KEY,JSON.stringify(value));
const getLogs=()=>{try{return JSON.parse(localStorage.getItem(LOG_KEY)||'{}')}catch{return {}}};
const saveLogs=value=>localStorage.setItem(LOG_KEY,JSON.stringify(value));
const safeName=value=>String(value||'campaign').replace(/[\\/:*?"<>|]/g,'_').trim()||'campaign';
const timestamp=()=>{
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).filter(part=>part.type!=='literal').map(part=>[part.type,part.value]));
  return `${parts.month}${parts.day}_${parts.hour}${parts.minute}`;
};
function backupCreatedAt(record){
  const match=String(record?.fileName||'').match(/(20\d{2})[-_](\d{2})[-_](\d{2})[_ T](\d{2})[-:](\d{2})/);
  if(match){
    const value=Date.parse(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:00+09:00`);
    if(Number.isFinite(value))return value;
  }
  const modified=Number(record?.lastModified||0);
  return Number.isFinite(modified)&&modified>0?modified:null;
}
function renderFileAge(){
  const target=$('fileAge');
  const record=selectRecord($('afterFile').value);
  if(!record){target.hidden=true;target.textContent='';return null}
  target.hidden=false;target.className='fileAge';
  const createdAt=backupCreatedAt(record);
  if(!createdAt){target.classList.add('unknown');target.innerHTML='<strong>時刻不明</strong><span>作成時刻を確認できません。</span>';return null}
  const ageMinutes=Math.floor((Date.now()-createdAt)/60000);
  const madeAt=new Date(createdAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  target.title='作成時刻：'+madeAt;
  if(ageMinutes<-2){target.classList.add('future');target.innerHTML='<strong>'+Math.abs(ageMinutes)+'分後</strong><span>端末時刻またはファイルを確認してください。</span>';return ageMinutes}
  const safeAge=Math.max(0,ageMinutes);
  if(safeAge>30)target.classList.add('stale');else if(safeAge>10)target.classList.add('caution');
  target.innerHTML='<strong>'+safeAge+'分前に</strong><span>作成したファイルです。</span>';
  return safeAge;
}

function showStatus(target,text,type='ok'){
  if(target.id==='analysisStatus')target.textContent=(type==='error'?'失敗':'成功')+(text?'\n'+text:'');else target.textContent=text;
  target.className=(target.id==='analysisStatus'?'analysisMessage':'status')+' show '+type;
}
let confirmResolve=null;
function showConfirm(title,message){
  $('confirmTitle').textContent=title;$('confirmMessage').textContent=message;
  $('confirmModal').classList.add('show');$('confirmModal').setAttribute('aria-hidden','false');
  return new Promise(resolve=>{confirmResolve=resolve});
}
function closeConfirm(value){if(!confirmResolve)return;$('confirmModal').classList.remove('show');$('confirmModal').setAttribute('aria-hidden','true');const resolve=confirmResolve;confirmResolve=null;resolve(value)}
$('confirmCancel').onclick=()=>closeConfirm(false);$('confirmOk').onclick=()=>closeConfirm(true);
function packageId(intent){
  const match=String(intent||'').match(/(?:component|package)=([^/;]+)/i);
  return match?match[1]:'';
}
function isLine(row){
  return /^jp\.naver\.line\./i.test(packageId(row.intent));
}
function query(db,sql,params=[]){
  const stmt=db.prepare(sql);
  const rows=[];
  try{
    stmt.bind(params);
    while(stmt.step())rows.push(stmt.getAsObject());
    return rows;
  }finally{stmt.free()}
}
async function sqlEngine(){
  if(!sqlPromise){
    if(typeof initSqlJs!=='function')throw new Error('解析プログラムを読み込めません。通信状態を確認してください。');
    sqlPromise=initSqlJs({locateFile:()=>SQL_WASM});
  }
  return sqlPromise;
}
async function openNova(record){
  if(!record?.blob)throw new Error('NOVAバックアップを選択してください。');
  if(typeof JSZip==='undefined')throw new Error('バックアップ読込プログラムを読み込めません。');
  const zip=await JSZip.loadAsync(await record.blob.arrayBuffer());
  const dbEntry=zip.file('nova.db');
  if(!dbEntry)throw new Error('nova.dbがないため、NOVAバックアップとして読めません。');
  const SQL=await sqlEngine();
  const db=new SQL.Database(new Uint8Array(await dbEntry.async('arraybuffer')));
  const table=query(db,"SELECT name FROM sqlite_master WHERE type='table' AND name='favorites'");
  if(!table.length){db.close();throw new Error('ホーム画面データが見つかりません。')}
  return {zip,db};
}
function selectRecord(id){return sourceFiles.find(row=>row.id===id)}
function fillSelect(select,selected,pinnedId=''){
  select.innerHTML='<option value="">選択してください</option>'+sourceFiles.map(row=>'<option value="'+row.id+'">'+(row.id===pinnedId?'★初期｜':'')+String(row.fileName||'NOVAバックアップ').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</option>').join('');
  if(selected&&sourceFiles.some(row=>row.id===selected))select.value=selected;
}
function assignFile(settings,id,device){
  if(!id)return;
  settings.fileDevices=settings.fileDevices||{};
  settings.fileDevices[id]=settings.fileDevices[id]||{};
  settings.fileDevices[id][device]=true;
}

function oppositeResult(value){return value==='winner'?'loser':'winner'}
function collectAdditionalCampaignGroups(afterRows,byPackage,campaigns,excludedResult,maxScreen){
  const campaignByName=new Map();
  for(const campaign of campaigns){
    campaignByName.set(String(campaign.name||''),campaign);
    for(const alias of campaign.aliases||[])campaignByName.set(String(alias||''),campaign);
  }
  const grouped=new Map();
  const unknownLabels=new Map();
  const missingAccounts=[];
  for(const row of afterRows){
    if(Number(row.itemType)!==0||!isLine(row))continue;
    const id=packageId(row.intent);
    if(!id)continue;
    const visible=Number(row.container)===-100&&Number(row.screen)>Number(maxScreen)&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5;
    // 除外フォルダ内は、抽選前からサーバーに保存されている外れ履歴を維持する。
    // 追加ページ5×6に残ったLINEだけを今回の反対結果として判定する。
    if(!visible)continue;
    const title=String(row.title||'').trim();
    const campaign=campaignByName.get(title);
    if(!campaign){
      const label=title||'名称なし';
      const unknown=unknownLabels.get(label)||{count:0,lineNumbers:new Set()};
      unknown.count++;
      const number=byPackage.get(id)?.lineNumber;
      if(Number.isFinite(number))unknown.lineNumbers.add(number);
      unknownLabels.set(label,unknown);
      continue;
    }
    if(!byPackage.has(id)){missingAccounts.push({label:title,appId:id});continue}
    let group=grouped.get(campaign.id);
    if(!group){group={campaign,items:new Map()};grouped.set(campaign.id,group)}
    const status=oppositeResult(excludedResult);
    const previous=group.items.get(id);
    if(previous&&previous.status!==status)throw new Error(campaign.name+'の同じLINEに異なる判定があります。配置を確認してください。');
    group.items.set(id,{id,row:byPackage.get(id),status,visible});
  }
  return {groups:[...grouped.values()].map(group=>({...group,items:[...group.items.values()]})),unknownLabels:[...unknownLabels].map(([label,value])=>({label,count:value.count,lineNumbers:[...value.lineNumbers].sort((a,b)=>a-b)})),missingAccounts};
}
function transitionTotal(preview){return Object.values(preview?.transitions||{}).reduce((sum,value)=>sum+Number(value||0),0)}
function projectedLogs(current,previews,priority){
  const logs=JSON.parse(JSON.stringify(current||{order:[],campaigns:{}}));
  logs.order=Array.isArray(logs.order)?logs.order:[];logs.campaigns=logs.campaigns||{};
  for(const batch of previews){
    const name=batch.campaign.name;
    if(!logs.order.includes(name))logs.order.push(name);
    const packages=new Set(logs.campaigns[name]?.packages||[]);
    for(const update of batch.updates){
      const appId=String(update.account_id||'').replace(/^[^:]+:/,'');
      if(update.status==='loser')packages.add(appId);else packages.delete(appId);
    }
    logs.campaigns[name]={...(logs.campaigns[name]||{}),campaignId:batch.campaign.id,createdAt:logs.campaigns[name]?.createdAt||new Date().toISOString(),packages:priority.filter(id=>packages.has(id))};
  }
  logs.updatedAt=new Date().toISOString();
  return logs;
}

function lineNumber(title,index){
  const value=String(title||'').trim().toLowerCase();
  if(value==='00')return 100;
  if(/^\d{1,2}$/.test(value))return Number(value);
  const match=value.match(/^([a-z])(\d)$/);
  if(match){const block=match[1].charCodeAt(0)-97;const digit=Number(match[2])||10;return 100+block*10+digit}
  return index+1;
}
function baseDefaultSelection(baseRows){
  const current=currentDeviceSettings();
  const stored=Array.isArray(current.defaultLayout)?current.defaultLayout:[];
  if(stored.length){
    const rowsById=new Map();
    for(const row of baseRows){
      if(Number(row.itemType)!==0||!isLine(row))continue;
      const id=packageId(row.intent);if(!id)continue;
      const list=rowsById.get(id)||[];list.push(row);rowsById.set(id,list);
    }
    const canonical=[];
    for(const [index,entry] of stored.entries()){
      const candidates=rowsById.get(entry.appId)||[];
      const exact=candidates.find(row=>Number(row.container)===-100&&Number(row.screen)===Number(entry.screen)&&Number(row.cellX)===Number(entry.cellX)&&Number(row.cellY)===Number(entry.cellY));
      const fallback=candidates.find(row=>Number(row.container)===-100&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5)||candidates[0];
      const row=exact||fallback;if(row)canonical.push({...row,lineNumber:Number(entry.lineNumber)||lineNumber(row.title,index)});
    }
    const screens=[...new Set((Array.isArray(current.defaultScreens)?current.defaultScreens:stored.map(row=>row.screen)).map(Number).filter(Number.isFinite))].sort((a,b)=>a-b).slice(0,5);
    return {canonical,defaultScreens:screens};
  }
  const screens=[...new Set(baseRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)).filter(Number.isFinite))].sort((a,b)=>a-b).slice(0,5);
  const allowed=new Set(screens);
  const rows=baseRows.filter(row=>Number(row.container)===-100&&Number(row.itemType)===0&&Number(row.cellX)>=0&&Number(row.cellX)<=4&&Number(row.cellY)>=0&&Number(row.cellY)<=5&&allowed.has(Number(row.screen))&&isLine(row))
    .sort((a,b)=>Number(a.screen)-Number(b.screen)||Number(a.cellY)-Number(b.cellY)||Number(a.cellX)-Number(b.cellX)||Number(a._id)-Number(b._id));
  const byPackage=new Map();
  for(const row of rows){const id=packageId(row.intent);if(id&&!byPackage.has(id))byPackage.set(id,{...row,lineNumber:lineNumber(row.title,byPackage.size)})}
  return {canonical:[...byPackage.values()],defaultScreens:screens};
}

async function detectDeviceFromAfter(){
  const after=selectRecord($('afterFile').value);if(!after)throw new Error('抽選後データを選択してください。');
  const settings=migrateSettings(getSettings());
  const assigned=Object.keys(settings.fileDevices?.[after.id]||{}).filter(device=>settings.devices?.[device]?.pinnedBaseFile);
  let detected=assigned.length===1?assigned[0]:'';
  if(!detected){
    const openedAfter=await openNova(after);const afterRows=query(openedAfter.db,'SELECT * FROM favorites');
    const afterSet=new Set(afterRows.filter(row=>Number(row.itemType)===0&&isLine(row)).map(row=>packageId(row.intent)).filter(Boolean));openedAfter.db.close();
    const scores=[];
    for(const [device,data] of Object.entries(settings.devices||{})){
      const base=selectRecord(data.pinnedBaseFile);if(!base)continue;
      const openedBase=await openNova(base);const baseRows=query(openedBase.db,'SELECT * FROM favorites');
      const baseSet=new Set(baseRows.filter(row=>Number(row.itemType)===0&&isLine(row)).map(row=>packageId(row.intent)).filter(Boolean));openedBase.db.close();
      let score=0;for(const id of baseSet)if(afterSet.has(id))score++;scores.push({device,score});
    }
    scores.sort((a,b)=>b.score-a.score||a.device.localeCompare(b.device));
    if(scores[0]?.score>0&&(scores.length===1||scores[0].score>scores[1].score))detected=scores[0].device;
  }
  if(!detected)throw new Error('端末を自動判別できません。端末ごとの初期データを確認してください。');
  $('device').value=detected;
  const current=settings.devices?.[detected]||{};const pinned=current.pinnedBaseFile||current.baseFile;
  if(!pinned)throw new Error('端末'+detected+'の初期データがありません。');
  fillSelect($('baseFile'),pinned,pinned);$('baseFile').value=pinned;
  settings.device=detected;settings.devices=settings.devices||{};settings.devices[detected]={...current,baseFile:pinned,selectedBaseFile:pinned,afterFile:after.id};assignFile(settings,after.id,detected);saveSettings(settings);renderBaseState();
  return detected;
}

  try{

  }catch(error){return showStatus($('analysisStatus'),'キャンペーン情報を取得できません。\n'+String(error?.message||error),'error')}

  const base=selectRecord($('baseFile').value);
  if(!base)return showStatus($('analysisStatus'),'自動判別した端末の初期データがありません。','error');
  const pinnedId=currentDeviceSettings().pinnedBaseFile;
  if(!pinnedId)return showStatus($('analysisStatus'),'先に初期データを選び、「★ 初期データとして固定」を押してください。','error');
  if(base.id!==pinnedId)return showStatus($('analysisStatus'),'選択した初期データに★初期の印がありません。固定してから解析してください。','error');
  if(base.id===after.id)return showStatus($('analysisStatus'),'初期データと抽選後データは別のファイルを選択してください。','error');
  showStatus($('analysisStatus'),'NOVAバックアップを解析しています。');
  let baseOpened,afterOpened;
  try{
    baseOpened=await openNova(base);
    afterOpened=await openNova(after);
    const baseRows=query(baseOpened.db,'SELECT * FROM favorites');
    const afterRows=query(afterOpened.db,'SELECT * FROM favorites');
    const baseDefault=baseDefaultSelection(baseRows);
    const canonical=baseDefault.canonical;
    const byPackage=new Map();
    for(const [index,row] of canonical.entries()){
      const id=packageId(row.intent);
      if(id&&!byPackage.has(id))byPackage.set(id,{...row,lineNumber:Number(row.lineNumber)||lineNumber(row.title,index)});
    }
    const priority=[...byPackage.keys()];
    if(!priority.length)throw new Error('固定初期データからLINEアカウントを取得できません。');
    const canonicalScreens=canonical.map(row=>Number(row.screen)).filter(Number.isFinite);
    const desktopScreens=afterRows.filter(row=>Number(row.container)===-100).map(row=>Number(row.screen)).filter(Number.isFinite);
    const firstScreen=Math.min(...(canonicalScreens.length?canonicalScreens:desktopScreens));
    const desktopFolders=afterRows
      .filter(row=>Number(row.container)===-100)
      .map(folder=>({
        folder,
        line:afterRows.filter(row=>Number(row.container)===Number(folder._id)&&Number(row.itemType)===0&&isLine(row))
      }))
      .filter(item=>item.line.length);
    const maxScreen=Math.max(0,...baseDefault.defaultScreens,...canonicalScreens);
    // Nova の screen はページ順ではなく内部 ID で、ページ削除後などは欠番になる。
    // 画面表示用のページ番号は内部 ID ではなく、実在する初期ページ数から数える。
    const defaultPageCount=baseDefault.defaultScreens.length;
    if(defaultPageCount!==5)throw new Error('固定初期データのデフォルトページが5ページではありません。現在'+defaultPageCount+'ページです。');
    if(!MarkerCore)throw new Error('マーカー判定プログラムを読み込めません。画面を更新してください。');
    const markerLayout=TEMP_INITIAL_SETUP
      ?MarkerCore.collectBootstrapLayout(afterRows,serverCampaigns,baseDefault.defaultScreens,byPackage)
      :MarkerCore.collectMarkerLayout(afterRows,serverCampaigns,baseDefault.defaultScreens);
    const workTarget=TEMP_INITIAL_SETUP?'bootstrap':(markerLayout?'marker':requestedWorkTarget);
    if(workTarget==='additional')throw new Error('追加ページ判定には、各キャンペーンの「○○始」と最後の「配置終」マーカーが必要です。');
    if(workTarget==='default'&&!selectedCampaign)throw new Error('キャンペーン設定がありません。管理画面の作業一括設定を確認してください。');
    const row7Direct=afterRows.filter(row=>Number(row.container)===-100&&Number(row.screen)===firstScreen&&Number(row.cellY)>=6&&Number(row.itemType)===0&&isLine(row));
    const row7Folders=desktopFolders.filter(item=>Number(item.folder.screen)===firstScreen&&Number(item.folder.cellY)>=6);
    const row7Rows=[...row7Direct,...row7Folders.flatMap(item=>item.line)];
    const row7Packages=[...new Set(row7Rows.map(row=>packageId(row.intent)).filter(Boolean))];
    const row7Set=new Set(row7Packages);
    const matched=priority.filter(id=>row7Set.has(id));
    const missing=row7Packages.filter(id=>!byPackage.has(id));
    let start=Number($('rangeStart').value);
    let end=Number($('rangeEnd').value);
    if(workTarget==='default'&&(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start))throw new Error('作業範囲の開始番号と終了番号を正しく入力してください。');
    const device=$('device').value;
    const accountRows=[...byPackage.entries()].map(([appId,row])=>({app_id:appId,line_number:row.lineNumber,display_name:String(row.title||row.lineNumber)}));
    await apiCall('/api/layout/accounts/sync',{method:'POST',body:JSON.stringify({device,accounts:accountRows})});
    let serverLogs;
    try{serverLogs=await syncDeviceLogs(device)}catch(error){throw new Error('サーバーの当落履歴を取得できません。履歴と追加ページを更新していません。\n'+String(error?.message||error))}
    const campaignRecord=workTarget==='default'?await ensureCampaign(selectedCampaign):null;
    let workRows;
    let updates;
    let markerPlans=[];

    if(workTarget==='default'){
      workRows=[...byPackage.entries()].filter(([,row])=>row.lineNumber>=start&&row.lineNumber<=end).map(([id,row])=>({id,row}));
      if(!workRows.length)throw new Error('指定した作業範囲にLINEアカウントがありません。');
      const outside=matched.filter(id=>!workRows.some(item=>item.id===id));
      if(outside.length)throw new Error('7段目のLINEに作業範囲外のアカウントが含まれています。範囲を確認してください。');
      const rowResult=selectedResult();
      const otherResult=rowResult==='winner'?'loser':'winner';
      updates=workRows.map(item=>({account_id:device+':'+item.id,status:row7Set.has(item.id)?rowResult:otherResult}));
    }else{
      if(workTarget!=='bootstrap'){
        const markedIds=new Set(markerLayout.groups.map(group=>String(group.campaign.id)));
        const unmarkedLosers=Object.entries(serverLogs.campaigns||{}).filter(([,row])=>(row.packages||[]).length&&!markedIds.has(String(row.campaignId||'')));
        if(unmarkedLosers.length)throw new Error('未当選履歴があるのに開始マーカーがないキャンペーンがあります。\n'+unmarkedLosers.map(([name,row])=>name+'：'+row.packages.length+'件').join('\n'));
      }
      const preparedGroups=markerLayout.groups.map(group=>{
        if(workTarget==='bootstrap')return group;
        let ranges=MarkerCore.normalizeRanges(group.campaign.initial_draw_ranges);
        let rangeSource='管理画面';
        if(!ranges.length&&group.label.includes('プレモル')){ranges=[{start:1,end:150}];rangeSource='初期既定（1～150）'}
        if(!ranges.length&&group.label.includes('タコハイ')){ranges=[{start:1,end:45}];rangeSource='初期既定（1～45）'}
        if(!ranges.length)throw new Error('「'+group.label+'」の抽選済み範囲が未登録です。管理画面で登録してください。');
        return {...group,rangeSource,campaign:{...group.campaign,initial_draw_ranges:ranges}};
      });
      let statusRows;
      try{statusRows=await Promise.all(preparedGroups.map(group=>campaignAccounts(group.campaign,device)))}catch(error){throw new Error('サーバーの安全照合データを取得できません。判定は行っていません。\n'+String(error?.message||error))}
      markerPlans=preparedGroups.map((group,index)=>MarkerCore.planCampaign(group,statusRows[index],priority));
      workRows=markerPlans.flatMap(plan=>[...plan.active,...plan.winners]);
      updates=[];
    }
    const batches=isCampaignLayoutWork(workTarget)
      ?markerPlans.filter(plan=>plan.updates.length).map(plan=>({campaign:plan.campaign,updates:plan.updates,plan}))
      :[{campaign:campaignRecord,updates}];
    let previews=[];
    if(isCampaignLayoutWork(workTarget)){
      if(batches.length){
        const response=await apiCall('/api/layout/results/batch/preview',{method:'POST',body:JSON.stringify({device,batches:batches.map(batch=>({campaign_id:batch.campaign.id,updates:batch.updates}))})});
        if((response.batches||[]).length!==batches.length)throw new Error('キャンペーン別の確認結果が不足しています。登録は行いません。');
        previews=batches.map(batch=>{const preview=response.batches.find(row=>row.campaign_id===batch.campaign.id);if(!preview||transitionTotal(preview)!==batch.updates.length)throw new Error(batch.campaign.name+'の確認件数が一致しません。登録は行いません。');return {...batch,preview}});
      }
      const reversals=previews.filter(batch=>(batch.preview.warnings||[]).length);
      if(reversals.length)throw new Error('当選済みアカウントを未当選へ戻す判定が検出されたため停止しました。配置または履歴を確認してください。');
    }else{
      const preview=await apiCall('/api/layout/results/preview',{method:'POST',body:JSON.stringify({campaign_id:campaignRecord.id,device,updates})});
      if(transitionTotal(preview)!==updates.length)throw new Error('確認件数が一致しません。登録は行いません。');
      previews=[{...batches[0],preview}];
    }
    const previewText=previews.flatMap(({campaign:target,preview})=>{
      const t=preview.transitions||{};
      const warningLines=(preview.warnings||[]).map(row=>'端末'+row.device_id+'：LINE'+String(row.line_number||row.display_name||'--').padStart(2,'0'));
      return [`【${target.name}】`,`未抽選 → 当選　${t.undrawn_to_winner||0}件`,`未抽選 → 外れ　${t.undrawn_to_loser||0}件`,`外れ → 当選　${t.loser_to_winner||0}件`,`変更なし　${t.unchanged||0}件`,...(warningLines.length?[`⚠ 当選 → 外れ　${t.winner_to_loser||0}件`,'⚠ 対象アカウント',...warningLines]:[]),''];
    });
    const targetCount=previews.reduce((sum,row)=>sum+transitionTotal(row.preview),0);
    const changeCount=previews.reduce((sum,row)=>sum+Number(row.preview.change_count||0),0);
    const logs=projectedLogs(serverLogs,previews,priority);
    if(isCampaignLayoutWork(workTarget)){
      for(const plan of markerPlans){
        const actual=logs.campaigns[plan.campaign.name]?.packages||[];
        if(actual.length!==plan.loserIds.length||actual.some((id,index)=>id!==plan.loserIds[index]))throw new Error('サーバー履歴と実データ判定の照合に失敗しました：'+plan.label);
      }
    }
    const placementText=isCampaignLayoutWork(workTarget)
      ?[workTarget==='bootstrap'?'【初回設定：6・7ページの実データから作成】':'【NOVA実データから作成】',...markerPlans.flatMap(plan=>[
        plan.label+'（抽選済み '+markerRangeText(plan.ranges)+'／'+plan.rangeSource+'）',
        '実ページ未当選 '+plan.activeCount+'件・7段目当選 '+plan.winnerRowCount+'件・ページ外当選 '+plan.inferredWinnerCount+'件',
        '作成後 '+plan.placementIds.length+'件（未当選 '+plan.loserIds.length+'件＋未着手 '+plan.undrawnIds.length+'件）'
      ]),'']
      :[];
    const confirmTitle=isCampaignLayoutWork(workTarget)?(workTarget==='bootstrap'?'初回設定 ':'実データ判定 ')+targetCount+'件／履歴変更 '+changeCount+'件':'判定対象'+targetCount+'件／履歴変更'+changeCount+'件';
    if(!await showConfirm(confirmTitle,[...previewText,...placementText,'この内容で登録しますか？'].join('\n')))throw new Error('登録をキャンセルしました。');
    const allLogs=getLogs();
    // 生成する追加ページは、ブラウザー内の古い記録ではなく、解析直前に
    // サーバーから取得した当落履歴へ今回の判定を反映して作る。
    allLogs[device]=logs;
    analysis={
      campaign:isCampaignLayoutWork(workTarget)?markerPlans.map(plan=>plan.label).join('・'):selectedCampaign,base,after,workTarget,
      workingZip:afterOpened.zip,
      workingDb:afterOpened.db,
      baseRows,afterRows,byPackage,priority,
      campaignId:campaignRecord?.id||null,row7Packages,matched,missing,maxScreen,firstScreen,defaultPageCount,workCount:workRows.length,
      markerLayout,markerPlans,pendingPreviews:previews,projectedLogs:logs,allLogs
    };
    baseOpened.db.close();
    const summary=isCampaignLayoutWork(workTarget)?[
      ['初期LINE',byPackage.size+'件'],
      [workTarget==='bootstrap'?'読取ページ':'自動識別',workTarget==='bootstrap'?'6：プレモル → 7：タコハイ':markerPlans.map(plan=>plan.label).join(' → ')+' → 配置終'],
      ['実ページ未当選',markerPlans.reduce((sum,plan)=>sum+plan.activeCount,0)+'件'],
      ['7段目当選',markerPlans.reduce((sum,plan)=>sum+plan.winnerRowCount,0)+'件'],
      ['作成後LINE',markerPlans.reduce((sum,plan)=>sum+plan.placementIds.length,0)+'件'],
      ['未着手',markerPlans.reduce((sum,plan)=>sum+plan.undrawnIds.length,0)+'件']
    ]:[
      ['初期LINE',byPackage.size+'件'],
      ['7段目LINE',row7Packages.length+'件'],
      ['抽選した範囲',workRows.length+'件'],
      ['対象LINE',workRows.map(item=>item.row?.lineNumber).filter(Number.isFinite).join('・')||'--'],
      ['初期にないID',missing.length+'件']
    ];
    $('summary').innerHTML=summary.map(item=>'<div class="summaryItem"><div class="summaryLabel">'+item[0]+'</div><div class="summaryValue">'+item[1]+'</div></div>').join('');
    $('summary').hidden=false;
    if(workTarget==='default'&&row7Packages.length&&!matched.length){
      analysis.workingDb.close();
      analysis=null;
      return showStatus($('analysisStatus'),'7段目に、初期データと一致するLINEがありません。','error');
    }
    const noLosersInRange=workTarget==='default'&&selectedResult()==='loser'&&row7Packages.length===0;
    const hasAdditionalPages=logs.order.some(name=>(logs.campaigns[name]?.packages||[]).length>0);
    renderCampaigns(logs);
    renderCampaignSelect(logs,selectedCampaign);
    if(noLosersInRange&&!hasAdditionalPages){
      const committed=await commitResultBatches(device,workTarget,previews);
      if(!validateCommitResponse(committed,workTarget,previews))throw new Error('D1確定件数を確認できませんでした。');
      saveLogs(allLogs);
      analysis.workingDb.close();
      analysis=null;
      $('generate').disabled=true;
      return showStatus($('analysisStatus'),'当落履歴を登録しました。\n追加ページなし・履歴登録完了');
    }
    $('generate').disabled=false;
    if(isCampaignLayoutWork(workTarget)){
      showStatus($('analysisStatus'),workTarget==='bootstrap'?'6・7ページの実データを確認しました。\n更新ファイル作成後に履歴を確定します。':'NOVA実データを確認しました。\n更新ファイル作成後に履歴を確定します。');
    }else if(noLosersInRange){
      showStatus($('analysisStatus'),'当落を確認しました。\n今回のハズレ0件。更新ファイル作成後に履歴を確定します。');
    }else{
      showStatus($('analysisStatus'),missing.length?'当落を確認しました。\n初期にないIDは配置しません。':'当落を確認しました。\nファイル作成成功後に履歴を確定します。');
    }
  }catch(error){
    if(baseOpened?.db)baseOpened.db.close();
    if(afterOpened?.db)afterOpened.db.close();
    showStatus($('analysisStatus'),String(error?.message||error),'error');
  }
}

function insertCopy(db,columns,source,id,title,screen,cellX,cellY){
  const customTitle=title!==null&&title!==undefined;
  const row={
    ...source,
    _id:id,
    title:customTitle?title:source.title,
    container:-100,
    screen,
    cellX,
    cellY,
    rank:0,
    modified:Date.now(),
    novaFlags:customTitle?(Number(source.novaFlags||0)|2):source.novaFlags
  };
  const names=columns.map(name=>'"'+String(name).replaceAll('"','""')+'"').join(',');
  const values=columns.map(()=>'?').join(',');
  const stmt=db.prepare('INSERT INTO favorites ('+names+') VALUES ('+values+')');
  try{stmt.run(columns.map(name=>row[name]===undefined?null:row[name]))}finally{stmt.free()}
}
async function updateNovaPreferences(zip,screenCount,defaultPage){
  const entry=zip.file('nova.xml');
  if(!entry)throw new Error('nova.xmlがないため、ページ数とホーム位置を設定できません。');
  let xml;
  try{xml=MarkerCore.updateNovaXml(await entry.async('text'),screenCount,defaultPage)}catch(error){throw new Error(String(error?.message||error)+' 作成を停止しました。')}
  zip.file('nova.xml',xml);
}
function verifyDefaultLayout(db,byPackage){
  const rows=query(db,'SELECT * FROM favorites WHERE container=-100 AND itemType=0');
  for(const [appId,expected] of byPackage){
    const matches=rows.filter(row=>packageId(row.intent)===appId&&Number(row.screen)===Number(expected.screen)&&Number(row.cellX)===Number(expected.cellX)&&Number(row.cellY)===Number(expected.cellY));
    if(matches.length!==1)throw new Error('作成後のデフォルト配置を確認できません：LINE'+expected.lineNumber);
  }
}
async function generate(){
  if(!analysis)return;
  $('generate').disabled=true;
  showStatus($('generateStatus'),'更新ファイルを作成しています。');
  let pendingRecord=null;
  let resultsCommitted=false;
  try{
    const device=$('device').value;
    const allLogs=analysis.allLogs;
    const logs=analysis.projectedLogs;
    if(!isCampaignLayoutWork(analysis.workTarget)&&analysis.workTarget!=='additional'&&!logs.campaigns[analysis.campaign])throw new Error('先に当落を確認してください。');

    const db=analysis.workingDb;
    const columns=query(db,'PRAGMA table_info(favorites)').map(row=>row.name);
    let nextId=Number(query(db,'SELECT MAX(_id) AS id FROM favorites')[0]?.id||0)+1;
    let nextScreen=analysis.maxScreen+1;
    let nextLogicalPage=Number(analysis.defaultPageCount||0);
    const pages=[];
    db.run('BEGIN');
    try{
      const staleDesktopLine=analysis.afterRows.filter(row=>Number(row.container)===-100&&(
        isCampaignLayoutWork(analysis.workTarget)
          ?Number(row.screen)>analysis.maxScreen||(Number(row.itemType)===0&&isLine(row)&&Number(row.cellY)>=0&&Number(row.cellY)<=5)
          :Number(row.itemType)===0&&isLine(row)&&(Number(row.screen)>analysis.maxScreen||(Number(row.cellY)>=0&&Number(row.cellY)<=5))
      ));
      const staleIds=new Set(staleDesktopLine.map(row=>Number(row._id)));
      let foundChild=true;
      while(foundChild){
        foundChild=false;
        for(const row of analysis.afterRows){
          const id=Number(row._id);
          if(!staleIds.has(id)&&staleIds.has(Number(row.container))){staleIds.add(id);foundChild=true}
        }
      }
      const remove=db.prepare('DELETE FROM favorites WHERE _id=?');
      try{for(const id of staleIds)remove.run([id])}finally{remove.free()}
      for(const source of analysis.byPackage.values()){
        insertCopy(db,columns,source,nextId++,null,Number(source.screen),Number(source.cellX),Number(source.cellY));
      }
      if(isCampaignLayoutWork(analysis.workTarget)){
        for(const plan of analysis.markerPlans){
          const ids=plan.placementIds.filter(id=>analysis.byPackage.has(id));
          if(ids.length!==plan.placementIds.length)throw new Error('固定初期データにないLINEが作成対象に含まれています：'+plan.label);
          const startScreen=nextScreen;
          ids.forEach((packageName,index)=>{
            const pageOffset=Math.floor(index/30);
            const slot=index%30;
            insertCopy(db,columns,analysis.byPackage.get(packageName),nextId++,plan.label,nextScreen+pageOffset,slot%5,Math.floor(slot/5));
          });
          const pageCount=Math.max(1,Math.ceil(ids.length/30));
          insertCopy(db,columns,plan.marker,nextId++,plan.label+'始',startScreen,0,6);
          const logicalStart=nextLogicalPage;
          pages.push({campaign:plan.label,campaignId:plan.campaign.id,count:ids.length,loserCount:plan.loserIds.length,undrawnCount:plan.undrawnIds.length,start:logicalStart,end:logicalStart+pageCount-1,screenStart:startScreen,screenEnd:startScreen+pageCount-1});
          nextScreen+=pageCount;
          nextLogicalPage+=pageCount;
        }
        insertCopy(db,columns,analysis.markerLayout.endMarker,nextId++,'配置終',nextScreen,0,6);
        nextScreen++;
        nextLogicalPage++;
      }else{
        for(const name of logs.order){
          const ids=(logs.campaigns[name]?.packages||[]).filter(id=>analysis.byPackage.has(id));
          const startScreen=nextScreen;
          ids.forEach((packageName,index)=>{
            const pageOffset=Math.floor(index/30);
            const slot=index%30;
            insertCopy(db,columns,analysis.byPackage.get(packageName),nextId++,name,nextScreen+pageOffset,slot%5,Math.floor(slot/5));
          });
          const pageCount=Math.ceil(ids.length/30);
          if(pageCount){
            const logicalStart=nextLogicalPage;
            pages.push({campaign:name,count:ids.length,start:logicalStart,end:logicalStart+pageCount-1,screenStart:startScreen,screenEnd:startScreen+pageCount-1});
            nextScreen+=pageCount;
            nextLogicalPage+=pageCount;
          }
        }
      }
      db.run('COMMIT');
    }catch(error){db.run('ROLLBACK');throw error}

    verifyDefaultLayout(db,analysis.byPackage);
    if(isCampaignLayoutWork(analysis.workTarget)){
      const generatedRows=query(db,'SELECT * FROM favorites');
      const generatedLayout=MarkerCore.collectMarkerLayout(generatedRows,serverCampaigns,[...new Set([...analysis.byPackage.values()].map(row=>Number(row.screen)))]);
      MarkerCore.verifyGeneratedLayout(generatedLayout,analysis.markerPlans);
      await updateNovaPreferences(analysis.workingZip,nextLogicalPage,Math.min(4,analysis.defaultPageCount-1));
    }
    const integrity=query(db,'PRAGMA integrity_check');
    if(!integrity.length||String(Object.values(integrity[0])[0]||'').toLowerCase()!=='ok')throw new Error('作成したNovaデータの整合性確認に失敗しました。履歴は更新していません。');
    const generatedDb=db.export();
    analysis.workingZip.file('nova.db',generatedDb);
    const novaBlob=await analysis.workingZip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    const stamp=timestamp();
    const novaName='あ_'+stamp+'_端末'+device+'_'+safeName(analysis.campaign)+'_編集済.novabackup';
    const logData={
      version:2,
      device,
      updatedAt:logs.updatedAt,
      source:{base:analysis.base.fileName,after:analysis.after.fileName},
      rule:isCampaignLayoutWork(analysis.workTarget)
        ?{canonicalRows:'1-6',markerStart:'campaign-name-plus-start',markerEnd:'配置終',actualData:analysis.workTarget==='bootstrap'?'page6-premol-page7-taco-folders-supported':'rows1-6-unwon-row7-winner',undrawn:'outside-drawn-range',homePage:5,campaignUpdate:'server-safety-checked'}
        :{canonicalRows:'1-6',defaultJudgement:'page1-row7',additionalJudgement:'legacy',dock:'excluded-folder-keeps-server-result',campaignUpdate:'fresh-server-results'},
      campaigns:isCampaignLayoutWork(analysis.workTarget)
        ?analysis.markerPlans.map(plan=>({name:plan.label,campaignId:plan.campaign.id,ranges:plan.ranges,losers:plan.loserIds,undrawn:plan.undrawnIds,packages:plan.placementIds}))
        :logs.order.map(name=>({name,createdAt:logs.campaigns[name].createdAt,packages:logs.campaigns[name].packages})),
      pages
    };
    const generationId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
    const record={
      id:generationId,
      kind:'pending-generated',
      device,
      campaign:analysis.campaign,
      campaignId:analysis.campaignId,
      workTarget:analysis.workTarget,
      fileName:novaName,
      fileSize:novaBlob.size,
      blob:novaBlob,
      logData,
      receivedAt:Date.now(),
      pages
    };
    await put(record);
    pendingRecord=record;
    const committed=await commitResultBatches(device,analysis.workTarget,analysis.pendingPreviews);
    resultsCommitted=true;
    if(!validateCommitResponse(committed,analysis.workTarget,analysis.pendingPreviews))throw new Error('D1確定件数を確認できませんでした。');
    saveLogs(allLogs);
    record.kind='generated';
    await put(record);
    apiCall('/api/layout/generations',{method:'POST',body:JSON.stringify({id:generationId,device,campaign_id:analysis.campaignId,file_name:novaName,account_count:pages.reduce((sum,page)=>sum+page.count,0)})}).catch(console.error);
    output=record;
    analysis.workingDb.close();
    analysis=null;
    renderCampaigns(logs);
    renderCampaignSelect(logs,record.campaign);
    $('generate').disabled=false;$('generate').classList.add('download');$('generate').innerHTML='ファイルを<br>保存する';
    const pageParts=pages.map(page=>page.campaign+'：'+(page.start+1)+'～'+(page.end+1)+'ページ');
    if(isCampaignLayoutWork(record.workTarget))pageParts.push('配置終：'+nextLogicalPage+'ページ');
    const pageText=pageParts.join('／');
    showStatus($('generateStatus'),'作成完了 '+(pageText||'追加ページなし')+(isCampaignLayoutWork(record.workTarget)?'\n開始・終了マーカーを再配置し、ホーム位置を5ページ目に設定しました。':record.workTarget==='additional'?'\n復元後、除外対象フォルダの内容を確認してから、そのフォルダを削除してください。':''));
  }catch(error){
    if(pendingRecord&&!resultsCommitted)deleteRecords([pendingRecord.id]).catch(console.error);
    if(pendingRecord&&resultsCommitted){
      pendingRecord.kind='generated';await put(pendingRecord).catch(console.error);output=pendingRecord;
      if(analysis?.workingDb)analysis.workingDb.close();analysis=null;
      $('generate').disabled=false;$('generate').classList.add('download');$('generate').innerHTML='ファイルを\n保存する';
      showStatus($('generateStatus'),'履歴は確定済みです。保存一覧への登録に失敗しましたが、このボタンから更新ファイルを保存できます。\n'+String(error?.message||error),'error');
    }else showStatus($('generateStatus'),String(error?.message||error)+'\n履歴は更新していません。もう一度操作してください。','error');
  }finally{if(!output)$('generate').disabled=true}
}
function download(blob,name){
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=name;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function autoCleanupAfterDownload(device){
  const settings=migrateSettings(getSettings());
  const current=settings.devices?.[device]||{};
  const pinnedId=current.pinnedBaseFile;
  if(!pinnedId)return 0;
  const rows=await getAll();
  const pinnedIds=new Set(Object.values(settings.devices||{}).map(data=>data.pinnedBaseFile).filter(Boolean));
  const deleteIds=[];
  for(const row of rows){
    if(row.kind==='generated'&&row.device===device){deleteIds.push(row.id);continue}
    if(row.kind==='generated')continue;
    const assigned=settings.fileDevices?.[row.id]||{};
    if(!assigned[device]||row.id===pinnedId)continue;
    delete assigned[device];
    const usedElsewhere=Object.values(assigned).some(Boolean);
    if(!usedElsewhere&&!pinnedIds.has(row.id))deleteIds.push(row.id);
    if(usedElsewhere)settings.fileDevices[row.id]=assigned;else delete settings.fileDevices[row.id];
  }
  if(deleteIds.length)await deleteRecords(deleteIds);
  current.selectedBaseFile=pinnedId;current.baseFile=pinnedId;current.afterFile='';settings.devices[device]=current;saveSettings(settings);
  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&row.kind!=='pending-generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  fillSelect($('baseFile'),pinnedId,pinnedId);fillSelect($('afterFile'),'');renderBaseState();
  return deleteIds.length;
}

async function completeWork(){
  const device=$('device').value;
  const settings=migrateSettings(getSettings());
  const current=settings.devices?.[device]||{};
  const pinnedId=current.pinnedBaseFile;
  if(!pinnedId)return showStatus($('cleanupStatus'),'★初期データがないため削除できません。','error');
  const rows=await getAll();
  const pinnedIds=new Set(Object.values(settings.devices||{}).map(data=>data.pinnedBaseFile).filter(Boolean));
  const deleteIds=[];
  for(const row of rows){
    if(row.kind==='generated'&&row.device===device){
      deleteIds.push(row.id);
      continue;
    }
    if(row.kind==='generated')continue;
    const assigned=settings.fileDevices?.[row.id]||{};
    if(!assigned[device]||row.id===pinnedId)continue;
    delete assigned[device];
    const usedElsewhere=Object.values(assigned).some(Boolean);
    if(!usedElsewhere&&!pinnedIds.has(row.id))deleteIds.push(row.id);
    if(usedElsewhere)settings.fileDevices[row.id]=assigned;
    else delete settings.fileDevices[row.id];
  }
  if(!deleteIds.length)return showStatus($('cleanupStatus'),'この端末に削除対象の使用済みデータはありません。');
  if(!await showConfirm('使用済みデータ削除','端末 '+device+' の使用済みデータ '+deleteIds.length+'件を削除しますか？\n★初期データとキャンペーンログは残ります。'))return;
  await deleteRecords(deleteIds);
  current.selectedBaseFile=pinnedId;
  current.baseFile=pinnedId;
  current.afterFile='';
  settings.devices[device]=current;
  saveSettings(settings);
  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&row.kind!=='pending-generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  fillSelect($('baseFile'),pinnedId,pinnedId);
  fillSelect($('afterFile'),'');
  renderBaseState();
  resetGenerateButton();
  $('downloads').classList.remove('show');
  showStatus($('cleanupStatus'),'作業完了：端末 '+device+' の使用済みデータを'+deleteIds.length+'件削除しました。');
}

async function init(){
  $('bootstrapNotice').hidden=!TEMP_INITIAL_SETUP;
  if(TEMP_INITIAL_SETUP){document.body.classList.add('bootstrapMode');$('analyze').textContent='初回設定を確認'}
  try{
    await loadServerCampaigns();
    if(TEMP_INITIAL_SETUP)applyInitialSetupModeUI();else await loadManagedSettings();
  }catch(error){showStatus($('analysisStatus'),'キャンペーン情報を取得できませんでした。','error')}
  for(let i=1;i<=15;i++){
    const value=String(i).padStart(2,'0');
    $('device').insertAdjacentHTML('beforeend','<option value="'+value+'">端末 '+value+(value==='06'?'（専用）':'')+'</option>');
  }
  const settings=migrateSettings(getSettings());
  $('device').value=settings.device||'01';
  sourceFiles=(await getAll()).filter(row=>row.kind!=='generated'&&row.kind!=='pending-generated'&&String(row.fileName||'').toLowerCase().endsWith('.novabackup')).sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  const savedDevice=settings.devices?.[$('device').value]||settings;
  if(!settings.devices?.[$('device').value]&&savedDevice.baseFile){
    settings.devices=settings.devices||{};
    settings.devices[$('device').value]={...savedDevice,pinnedBaseFile:savedDevice.baseFile,selectedBaseFile:savedDevice.baseFile};
    assignFile(settings,savedDevice.baseFile,$('device').value);
    assignFile(settings,savedDevice.afterFile,$('device').value);
  }
  saveSettings(settings);
  const activeSettings=settings.devices?.[$('device').value]||savedDevice;
  fillSelect($('baseFile'),activeSettings.selectedBaseFile||activeSettings.pinnedBaseFile||activeSettings.baseFile,activeSettings.pinnedBaseFile);
  fillSelect($('afterFile'),activeSettings.afterFile);
  renderFileAge();
  renderBaseState();
  let initialLogs=deviceLogs($('device').value);try{initialLogs=await syncDeviceLogs($('device').value)}catch{}
  renderCampaignSelect(initialLogs);applyManagedSettings();
  $('device').addEventListener('change',async()=>{
    const next=getSettings().devices?.[$('device').value]||{};
    fillSelect($('baseFile'),next.selectedBaseFile||next.pinnedBaseFile||next.baseFile,next.pinnedBaseFile);
    fillSelect($('afterFile'),next.afterFile);
    renderFileAge();
    updateSettings();
    renderBaseState();
    analysis=null;
    resetGenerateButton();
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
    let logs=deviceLogs($('device').value);try{logs=await syncDeviceLogs($('device').value)}catch{}
    renderCampaigns(logs);
    renderCampaignSelect(logs);applyManagedSettings();
  });
  $('campaignSelect').addEventListener('change',()=>{
    analysis=null;
    resetGenerateButton();
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
  });
  [$('baseFile'),$('afterFile')].forEach(element=>element.addEventListener('change',()=>{
    updateSettings();
    renderBaseState();
    analysis=null;
    resetGenerateButton();
    $('summary').hidden=true;
    $('downloads').classList.remove('show');
    if(element.id==='afterFile')renderFileAge();
  }));
  renderCampaigns(initialLogs);
  if(!sourceFiles.length)showStatus($('analysisStatus'),'先に「ファイル貼りつけ」からNOVAバックアップを保存してください。','error');
}

document.querySelectorAll('input[name="workTarget"]').forEach(el=>el.addEventListener('change',syncWorkModeUI));
syncWorkModeUI();
$('analyze').addEventListener('click',async()=>{
  if(analyzeBusy)return;
  analyzeBusy=true;$('analyze').disabled=true;$('analyze').textContent='解析中…';
  try{await analyze()}finally{analyzeBusy=false;$('analyze').disabled=false;$('analyze').textContent=TEMP_INITIAL_SETUP?'初回設定を確認':'除外対象を確認'}
});
$('generate').addEventListener('click',async()=>{
  if(output){
    const downloaded=output;
    download(downloaded.blob,downloaded.fileName);
    apiCall('/api/layout/generations',{method:'POST',body:JSON.stringify({id:downloaded.id,device:downloaded.device,campaign_id:downloaded.campaignId||null,file_name:downloaded.fileName,account_count:(downloaded.pages||[]).reduce((sum,page)=>sum+page.count,0),downloaded:true})}).catch(console.error);
    output=null;$('generate').disabled=true;
    showSaveToast();
    return;
  }
  generate();
});
$('pinBase').addEventListener('click',pinInitialFile);
$('campaigns').addEventListener('click',event=>{
  const button=event.target.closest('.campaignEnd');
  if(button)endCampaign(button.dataset.campaign).catch(error=>showStatus($('generateStatus'),String(error?.message||error),'error'));
});
$('completeWork').addEventListener('click',()=>completeWork().catch(error=>showStatus($('cleanupStatus'),String(error?.message||error),'error')));
init().catch(error=>showStatus($('analysisStatus'),String(error?.message||error),'error'));
if('serviceWorker' in navigator)window.addEventListener('load',async()=>{
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
  try{
    const registration=await navigator.serviceWorker.register('./sw.js?v=56-bootstrap-pages-6-7',{updateViaCache:'none'});
    await registration.update();
  }catch(error){console.error(error)}
});
</script>
</body>
</html>
