<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>ホーム画面更新</title>
<style>
@font-face{font-family:"Corporate Logo";src:url("./fonts/Corporate-Logo-Bold-ver3.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:"Corporate Logo","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:17px;font-weight:700;font-synthesis:none;letter-spacing:.02em}
.wrap{width:min(720px,100%);margin:0 auto;padding:7px 10px calc(10px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:stretch;margin-bottom:15px}
.back,.topTitle,.stepCard,.received,.deviceSelect{border:3px solid #fff;background:#000;color:#fff;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}
.back,.action{font:inherit;color:#fff;background:#000;border:2px solid #fff;border-radius:0;text-decoration:none;text-align:center}
.back{display:grid;place-items:center;min-height:46px;font-size:16px}
.topTitle{display:grid;place-items:center;min-width:0;padding:5px 6px;font-size:20px;text-align:center}
.steps{display:grid;gap:15px}
.stepCard{padding:8px 10px}
.stepHead{display:grid;grid-template-columns:34px 6em minmax(0,1fr);gap:7px;align-items:center;margin-bottom:15px;min-height:34px}
.stepNo{display:grid;place-items:center;width:30px;height:30px;border:2px solid #fff;font-size:16px;color:#ffd43b}
.stepTitle{font-size:18px;line-height:1.18;white-space:nowrap}
.stepText{margin:0;font-size:11.4px;line-height:1.34;color:#bbb;overflow-wrap:anywhere}
.action{display:grid;place-items:center;width:100%;min-height:40px;padding:5px 9px;font-size:16.5px;line-height:1.15;cursor:pointer}
.action:hover,.action:focus-visible,.action:active,.back:hover,.back:focus-visible{background:#fff;color:#000;outline:none}
.fileInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.initialControls{display:grid;grid-template-columns:118px minmax(0,1fr);gap:7px;align-items:stretch}
.deviceSelect{width:100%;min-height:40px;padding:4px 26px 4px 9px;border-width:2px;font:inherit;font-size:15px;text-align:center;outline:none;appearance:auto}
.initialStatus{margin:4px 1px 0;color:#ffd43b;font-size:10.8px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.received{margin-top:5px;padding:6px 8px;border-width:2px}
.receivedHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:3px;border-bottom:1px solid #fff;font-size:11.5px}
.receivedCount{color:#ffd43b}
.receivedList{display:grid;gap:3px;margin-top:3px;max-height:50px;overflow:auto;overscroll-behavior:contain}
.receivedRow{padding:4px 6px;border:1px solid #666;font-size:10px;line-height:1.25;word-break:break-all}
.receivedMeta{margin-top:1px;color:#aaa}
.initialBadge{display:inline-block;margin:0 0 2px;padding:1px 4px;border:1px solid #ffd43b;color:#ffd43b;font-size:9.5px}
.empty{padding:1px 0;color:#888;font-size:10.5px}
.message{min-height:13px;margin:3px 0 0;color:#ffd43b;font-size:10.5px;text-align:center}
@media(max-width:390px){
  .wrap{padding-left:8px;padding-right:8px}
  .top{grid-template-columns:76px minmax(0,1fr)}
  .topTitle{font-size:18px}
  .stepHead{grid-template-columns:32px 6em minmax(0,1fr);gap:6px}
  .stepNo{width:28px;height:28px;font-size:15px}
  .stepTitle{font-size:17px}
  .stepText{font-size:10.7px}
  .stepCard{padding:7px 9px}
  .action{min-height:38px;font-size:16px}
  .initialControls{grid-template-columns:108px minmax(0,1fr)}
  .deviceSelect{min-height:38px;font-size:14px}
  .receivedList{max-height:46px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="./index.html">◀ 戻る</a>
    <div class="topTitle">ホーム画面更新</div>
  </header>

  <div class="steps">
    <section class="stepCard">
      <div class="stepHead">
        <div class="stepNo">初</div>
        <div class="stepTitle">初期データ</div>
        <p class="stepText">端末ごとの基準データを登録します。次に変更するまで固定して使用します。</p>
      </div>
      <div class="initialControls">
        <select id="initialDevice" class="deviceSelect" aria-label="初期データを登録する端末"></select>
        <label class="action" for="initialFileInput">初期データを貼り付け</label>
      </div>
      <input id="initialFileInput" class="fileInput" type="file" accept=".novabackup">
      <div id="initialStatus" class="initialStatus">端末01：初期データ未設定</div>
    </section>

    <section class="stepCard">
      <div class="stepHead">
        <div class="stepNo">1</div>
        <div class="stepTitle">貼り付け</div>
        <p class="stepText">NOVAバックアップを選択、またはAndroid共有メニューから受け取ります。</p>
      </div>
      <label class="action" for="backupFileInput">ファイルを貼りつけ</label>
      <input id="backupFileInput" class="fileInput" type="file" multiple accept=".novabackup">
      <div class="received">
        <div class="receivedHead"><span>受け取ったファイル</span><span id="receivedCount" class="receivedCount">0件</span></div>
        <div id="receivedList" class="receivedList"><div class="empty">ファイルはまだありません。</div></div>
      </div>
    </section>

    <section class="stepCard">
      <div class="stepHead">
        <div class="stepNo">2</div>
        <div class="stepTitle">編集</div>
        <p class="stepText">配置するLINE、ページ、並び順などを設定します。</p>
      </div>
      <a class="action" href="./home-layout-edit.html">編集ページへ</a>
    </section>

    <section class="stepCard">
      <div class="stepHead">
        <div class="stepNo">3</div>
        <div class="stepTitle">読み込み</div>
        <p class="stepText">作成したバックアップを確認し、端末で読み込みます。</p>
      </div>
      <a class="action" href="./home-layout-read.html">読み込みページへ</a>
    </section>

    <section class="stepCard">
      <div class="stepHead">
        <div class="stepNo">管</div>
        <div class="stepTitle">管理画面</div>
        <p class="stepText">キャンペーン、CSV、火力、統計、当落訂正、操作履歴などを管理します。</p>
      </div>
      <a class="action" href="./home-layout-admin.html">管理画面へ</a>
    </section>
  </div>
  <div id="message" class="message" aria-live="polite"></div>
</main>
<script>
const DB_NAME='winning-url-manager-home-layout';
const STORE_NAME='backups';
const SETTINGS_KEY='home-layout-settings-v1';
const $=id=>document.getElementById(id);

function openDb(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(STORE_NAME))request.result.createObjectStore(STORE_NAME,{keyPath:'id'});
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function dbAction(mode,action){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE_NAME,mode);
    const request=action(tx.objectStore(STORE_NAME));
    tx.oncomplete=()=>{db.close();resolve(request.result)};
    tx.onerror=()=>{db.close();reject(tx.error||request.error)};
  });
}
const getAll=()=>dbAction('readonly',store=>store.getAll());
const put=record=>dbAction('readwrite',store=>store.put(record));
const formatSize=size=>Number(size||0)>=1048576?`${(Number(size)/1048576).toFixed(1)}MB`:`${Math.ceil(Number(size||0)/1024)}KB`;
const formatTime=value=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(value));
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return {}}}
function saveSettings(settings){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}

function initDeviceSelect(){
  $('initialDevice').innerHTML=Array.from({length:15},(_,i)=>{
    const no=String(i+1).padStart(2,'0');
    return `<option value="${no}">端末 ${no}</option>`;
  }).join('');
  const last=localStorage.getItem('home-layout-initial-device')||'01';
  if([...$('initialDevice').options].some(o=>o.value===last))$('initialDevice').value=last;
}

async function renderInitialStatus(){
  const device=$('initialDevice').value||'01';
  const settings=loadSettings();
  const id=settings.devices?.[device]?.pinnedBaseFile||settings.devices?.[device]?.baseFile;
  if(!id){$('initialStatus').textContent=`端末${device}：初期データ未設定`;return}
  const rows=await getAll();
  const row=rows.find(item=>item.id===id);
  $('initialStatus').textContent=row?`端末${device}：固定中｜${row.fileName}`:`端末${device}：初期データ未設定`;
}

async function renderFiles(){
  const rows=(await getAll()).filter(row=>row.kind!=='generated').sort((a,b)=>Number(b.receivedAt||0)-Number(a.receivedAt||0));
  const settings=loadSettings();
  const pinned=new Map();
  for(const [device,data] of Object.entries(settings.devices||{})){
    const id=data.pinnedBaseFile||data.baseFile;
    if(id){const list=pinned.get(id)||[];list.push(device);pinned.set(id,list)}
  }
  $('receivedCount').textContent=`${rows.length}件`;
  $('receivedList').innerHTML=rows.length?rows.map(row=>`<div class="receivedRow">${pinned.has(row.id)?`<div class="initialBadge">★初期｜端末 ${esc(pinned.get(row.id).join('・'))}</div>`:''}<div>${esc(row.fileName)}</div><div class="receivedMeta">${formatSize(row.fileSize)} ／ ${formatTime(row.receivedAt)}</div></div>`).join(''):'<div class="empty">ファイルはまだありません。</div>';
}

$('initialDevice').addEventListener('change',async()=>{
  localStorage.setItem('home-layout-initial-device',$('initialDevice').value);
  await renderInitialStatus();
});

$('initialFileInput').addEventListener('change',async event=>{
  const file=event.target.files?.[0];
  event.target.value='';
  if(!file)return;
  if(!String(file.name||'').toLowerCase().endsWith('.novabackup')){
    $('message').textContent='NOVAバックアップ（.novabackup）を選択してください。';
    return;
  }
  const device=$('initialDevice').value||'01';
  const id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
  await put({id,kind:'source',fileName:file.name,fileSize:file.size,mimeType:file.type||'application/octet-stream',lastModified:file.lastModified||Date.now(),blob:file,receivedAt:Date.now(),initialFor:device});
  const settings=loadSettings();
  settings.devices=settings.devices||{};
  settings.devices[device]={...(settings.devices[device]||{}),baseFile:id,pinnedBaseFile:id};
  saveSettings(settings);
  await Promise.all([renderFiles(),renderInitialStatus()]);
  $('message').textContent=`端末${device}の初期データを固定しました。変更するまでこのデータを使用します。`;
});

$('backupFileInput').addEventListener('change',async event=>{
  const files=[...event.target.files];
  let saved=0;
  for(const file of files){
    if(!String(file.name||'').toLowerCase().endsWith('.novabackup'))continue;
    const id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
    await put({id,kind:'source',fileName:file.name,fileSize:file.size,mimeType:file.type||'application/octet-stream',lastModified:file.lastModified||Date.now(),blob:file,receivedAt:Date.now()});
    saved++;
  }
  event.target.value='';
  await renderFiles();
  $('message').textContent=saved?`${saved}件のNOVAバックアップを端末内に保存しました。`:'NOVAバックアップ（.novabackup）を選択してください。';
});

initDeviceSelect();
Promise.all([renderFiles(),renderInitialStatus()]).catch(()=>{$('message').textContent='ファイル一覧を読み込めませんでした。'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body>
</html>
