<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest?v=4">
<title>画面配置管理</title>
<style>
@font-face{font-family:"Corporate Logo Rounded";src:url("./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#000;color:#fff}body{font-family:"Corporate Logo Rounded","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:15px}.wrap{width:min(760px,100%);margin:auto;padding:10px 10px 0;overflow-x:hidden}.cut{border:3px solid #fff;background:#000;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}.top{display:grid;grid-template-columns:76px 1fr;gap:8px;margin-bottom:12px}.back,.title,button,select,input{min-height:48px;border:2px solid #fff;border-radius:0;background:#000;color:#fff;font:inherit;min-width:0;max-width:100%}.back,.title{display:grid;place-items:center;text-decoration:none}.title{font-size:19px;font-weight:900}.menu{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:12px 0 0;padding:0}.menu button{width:100%;padding:6px 3px;font-size:13px;font-weight:900}.menu button:nth-child(1),.menu button:nth-child(2){grid-column:span 3}.menu button:nth-child(3),.menu button:nth-child(4),.menu button:nth-child(5){grid-column:span 2}.menu button.active{border-color:#70c8ff;background:#14375a}.bottomSpacer{height:24px}.panel{display:none;padding:14px;min-width:0;max-width:100%}.panel.show{display:block}.panel h2{margin:0 0 12px;font-size:18px}.panel>*{min-width:0;max-width:100%}.row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:8px}.row.three{grid-template-columns:1fr 1fr auto}.row button{padding:5px 10px}.danger{border-color:#ff6868;color:#ff9b9b}.blue{border-color:#70c8ff;color:#aaddff}.item{padding:9px 5px;border-top:1px solid #777;line-height:1.55}.item:first-child{border-top:0}.muted{color:#aaa;font-size:12px}.number{color:#ffd43b;font-size:19px}.status{min-height:24px;margin:9px 0;color:#ffd43b;white-space:pre-line}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:7px 4px;border:1px solid #777;text-align:left}.scroll{overflow:auto;max-height:55vh}.gridBulk{display:grid;gap:12px;min-width:0;max-width:100%}.fieldBulk{display:grid;gap:6px;min-width:0;max-width:100%}.bulkChoices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;min-width:0;max-width:100%}.bulkChoices label{display:flex;align-items:center;justify-content:center;min-width:0;max-width:100%;min-height:46px;border:2px solid #777;padding:5px;text-align:center;white-space:normal;overflow:hidden}.bulkChoices input{width:auto;min-width:0;min-height:0;margin-right:6px;flex:0 0 auto}.rangeBulk{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;min-width:0;max-width:100%}.rangeBulk input{text-align:center;width:100%;min-width:0;max-width:100%}.fieldBulk select{width:100%}#bulkSave{max-width:100%}
@media(max-width:480px){#bulk.panel{padding:10px}.gridBulk{gap:10px}.bulkChoices{gap:6px}.bulkChoices label{font-size:13px;padding:4px 2px}.rangeBulk{gap:5px}.rangeBulk input{font-size:14px}.menu{gap:6px}.menu button{font-size:12px;padding:5px 2px}.bottomSpacer{height:24px}}
@media(max-width:390px){.panel{padding:10px}.table{font-size:10px}.menu button{font-size:11px}}
body,button,input,select,textarea,option{font-family:"Corporate Logo Rounded","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif!important;font-weight:700;font-synthesis:none;letter-spacing:.02em}
</style>
</head>
<body><main class="wrap">
<header class="top"><a class="back" href="./home-layout.html">◀ 戻る</a><div class="title cut">画面配置 管理画面</div></header>
<section id="bulk" class="panel cut"><h2>作業一括設定</h2>
  <div class="gridBulk">
    <label class="fieldBulk"><span class="muted">キャンペーン</span><select id="bulkCampaign"></select></label>
    <div class="fieldBulk"><span class="muted">7段目の結果</span><div class="bulkChoices"><label><input type="radio" name="bulkResult" value="winner"> 当選</label><label><input type="radio" name="bulkResult" value="loser" checked> ハズレ</label></div></div>
    <div class="fieldBulk"><span class="muted">作業対象</span><div class="bulkChoices"><label><input type="radio" name="bulkTarget" value="default" checked> デフォルト配置</label><label><input type="radio" name="bulkTarget" value="additional"> 追加ページ</label></div></div>
    <label class="fieldBulk"><span class="muted">作業範囲</span><div class="rangeBulk"><input id="bulkStart" type="number" min="1" value="1" inputmode="numeric"><span>～</span><input id="bulkEnd" type="number" min="1" value="150" inputmode="numeric"></div></label>
  </div>
  <button id="bulkSave" class="blue" style="width:100%;margin-top:12px">全端末へ適用</button>
  <div id="bulkState" class="status"></div>
</section>
<section id="campaigns" class="panel cut"><h2>キャンペーン編集</h2><div class="row"><input id="campaignName" maxlength="30" placeholder="キャンペーン名"><button id="campaignAdd" class="blue">追加</button></div><div id="campaignList"></div></section>
<section id="csv" class="panel cut"><h2>CSV出力</h2><div class="row"><select id="csvCampaign"></select><button id="csvDownload" class="blue">出力</button></div><p class="muted">LINE番号・キャンペーン名・端末・状況・更新日時を出力します。</p></section>
<section id="stats" class="panel cut"><h2>統計</h2><div id="statsList"></div></section>
<section id="correction" class="panel cut"><h2>当落訂正</h2><div class="row three"><select id="correctCampaign"></select><select id="correctAccount"></select><select id="correctStatus"><option value="undrawn">未抽選</option><option value="winner">当選</option><option value="loser">外れ</option><option value="hold">判定保留</option></select></div><button id="correctSave" class="blue" style="width:100%">訂正内容を確認</button></section>
<section id="accounts" class="panel cut show"><h2>端末・アカウント</h2><div id="accountList" class="scroll"></div></section>
<section id="capacity" class="panel"><div id="capacityList"></div></section>
<section id="history" class="panel"><div id="historyList"></div></section>
<section id="sync" class="panel"><div id="syncState"></div></section>
<section id="generations" class="panel"><div id="generationList"></div></section>
<div id="status" class="status" aria-live="polite"></div>
<nav class="menu" aria-label="管理メニュー">
  <button data-panel="campaigns">キャンペーン編集</button>
  <button data-panel="bulk">作業一括設定</button>
  <button data-panel="csv">CSV出力</button>
  <button data-panel="stats">統計</button>
  <button data-panel="correction">当落訂正</button>
</nav>
<div class="bottomSpacer" aria-hidden="true"></div>
</main><script>
const API='https://winning-url-api.45kikurage.workers.dev';const $=id=>document.getElementById(id);let data={campaigns:[],accounts:[],history:[],generations:[],capacity:[]};let bulkSettings=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(path,options={}){let token='';try{token=localStorage.getItem('winning-url-manager-token')||''}catch{}const response=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(token?{'X-Manager-Token':token}:{}),...(options.headers||{})}});if(response.status===401&&!options._retried){const entered=prompt('管理端末キーを入力してください。');if(entered){localStorage.setItem('winning-url-manager-token',entered);return call(path,{...options,_retried:true})}}const text=await response.text();let body;try{body=JSON.parse(text)}catch{body={error:text}}if(!response.ok)throw new Error(body.error||('HTTP '+response.status));return body}
const status=text=>$('status').textContent=text;const statusName=value=>({undrawn:'未抽選',winner:'当選',loser:'外れ',hold:'判定保留'})[value]||value;
function options(rows,all=false){return (all?'<option value="">すべて</option>':'')+rows.map(row=>`<option value="${esc(row.id)}">${esc(row.name)}</option>`).join('')}
function render(){
  $('campaignList').innerHTML=data.campaigns.map(row=>`<div class="item row"><span>${esc(row.name)}<br><span class="muted">${row.status==='active'?'表示中':'終了・非表示'}</span></span><span><button data-rename="${row.id}">名称変更</button> <button class="danger" data-toggle="${row.id}" data-status="${row.status}">${row.status==='active'?'終了':'再表示'}</button></span></div>`).join('')||'<p class="muted">登録なし</p>';
  $('csvCampaign').innerHTML=options(data.campaigns,true);$('correctCampaign').innerHTML=options(data.campaigns.filter(row=>row.status==='active'));$('bulkCampaign').innerHTML=options(data.campaigns.filter(row=>row.status==='active'));if(bulkSettings?.campaign_id&&data.campaigns.some(row=>row.id===bulkSettings.campaign_id))$('bulkCampaign').value=bulkSettings.campaign_id;
  $('correctAccount').innerHTML=data.accounts.filter(row=>row.is_active).map(row=>`<option value="${esc(row.id)}">端末${esc(row.device_id)}：LINE${esc(row.line_number||row.display_name)}</option>`).join('');
  const months=[...new Set(data.capacity.map(row=>row.month))];$('capacityList').innerHTML=months.map(month=>{const rows=data.capacity.filter(row=>row.month===month),total=rows.reduce((sum,row)=>sum+Number(row.account_count||0),0);return `<div class="item"><strong>${esc(month)}</strong>　<span class="number">合計 ${total}垢</span><div class="muted">${rows.map(row=>`端末${esc(row.device_id)} ${row.account_count}垢`).join('／')}</div></div>`}).join('')||'<p class="muted">初期配置を読み込むと記録されます。</p>';
  $('accountList').innerHTML=`<table class="table"><tr><th>端末</th><th>LINE</th><th>アプリID</th><th>状態</th></tr>${data.accounts.map(row=>`<tr><td>${esc(row.device_id)}</td><td>${esc(row.line_number||row.display_name)}</td><td>${esc(row.app_id)}</td><td>${row.is_active?'使用中':'休止'}</td></tr>`).join('')}</table>`;
  $('historyList').innerHTML=data.history.map(row=>`<div class="item">${esc(row.campaign_name)}／端末${esc(row.device_id)}：LINE${esc(row.line_number||row.display_name)}<br>${statusName(row.old_status)} → ${statusName(row.new_status)}<br><span class="muted">${esc(row.changed_at)}</span></div>`).join('')||'<p class="muted">履歴なし</p>';
  $('generationList').innerHTML=data.generations.map(row=>`<div class="item">${esc(row.file_name)}<br><span class="muted">端末${esc(row.device_id)}／${esc(row.campaign_name||'')}／${esc(row.created_at)}</span></div>`).join('')||'<p class="muted">履歴なし</p>';
  $('syncState').innerHTML=`<div class="item"><span class="number">サーバー正常</span><br>キャンペーン ${data.campaigns.length}件／アカウント ${data.accounts.filter(row=>row.is_active).length}件<br><span class="muted">最終同期 ${new Date().toLocaleString('ja-JP')}</span></div>`;
}
async function load(){status('サーバーから読み込み中…');const [admin,stats,settingsRes]=await Promise.all([call('/api/layout/admin'),call('/api/layout/stats'),call('/api/layout/settings')]);data=admin;bulkSettings=settingsRes.settings||null;$('statsList').innerHTML=(stats.campaigns||[]).map(row=>{const drawn=Number(row.drawn_count||0),winner=Number(row.winner_count||0),rate=drawn?((winner/drawn)*100).toFixed(2):'0.00';return `<div class="item"><strong>${esc(row.name)}</strong><br><span class="number">${winner}/${drawn}　${rate}%</span><br><span class="muted">当選数／抽選数　当選確率</span></div>`}).join('')||'<p class="muted">集計なし</p>';render();applyBulkForm();status('同期しました。')}
function applyBulkForm(){const s=bulkSettings||{};const r=document.querySelector('input[name="bulkResult"][value="'+(s.draw_result||'loser')+'"]');if(r)r.checked=true;const t=document.querySelector('input[name="bulkTarget"][value="'+(s.work_target||'default')+'"]');if(t)t.checked=true;$('bulkStart').value=Number(s.range_start||1);$('bulkEnd').value=Number(s.range_end||150);if(s.campaign_id&&data.campaigns.some(row=>row.id===s.campaign_id))$('bulkCampaign').value=s.campaign_id;$('bulkState').textContent=s.updated_at?'現在の共通設定を読み込み済み：'+new Date(s.updated_at).toLocaleString('ja-JP'):'';}
$('bulkSave').onclick=async()=>{const campaign_id=$('bulkCampaign').value,draw_result=document.querySelector('input[name="bulkResult"]:checked')?.value||'loser',work_target=document.querySelector('input[name="bulkTarget"]:checked')?.value||'default',range_start=Number($('bulkStart').value),range_end=Number($('bulkEnd').value);if(!campaign_id)return status('キャンペーンを選択してください。');if(!Number.isInteger(range_start)||!Number.isInteger(range_end)||range_start<1||range_end<range_start)return status('作業範囲を正しく入力してください。');const res=await call('/api/layout/settings',{method:'POST',body:JSON.stringify({campaign_id,draw_result,work_target,range_start,range_end})});bulkSettings=res.settings;applyBulkForm();status('作業一括設定を保存しました。以後、各端末の編集画面で都度この設定を取得します。');};
document.querySelectorAll('.menu button').forEach(button=>button.onclick=()=>{const wasActive=button.classList.contains('active');document.querySelectorAll('.menu button').forEach(item=>item.classList.remove('active'));document.querySelectorAll('.panel').forEach(panel=>panel.classList.remove('show'));if(wasActive){$('accounts').classList.add('show');return}button.classList.add('active');$(button.dataset.panel).classList.add('show')});
$('campaignAdd').onclick=async()=>{const name=$('campaignName').value.trim();if(!name)return;await call('/api/layout/campaigns',{method:'POST',body:JSON.stringify({action:'create',name})});$('campaignName').value='';await load()};
$('campaignList').onclick=async event=>{const rename=event.target.dataset.rename,toggle=event.target.dataset.toggle;if(rename){const current=data.campaigns.find(row=>row.id===rename);const name=prompt('変更後のキャンペーン名',current?.name||'');if(name)await call('/api/layout/campaigns',{method:'POST',body:JSON.stringify({action:'rename',id:rename,name})})}else if(toggle){const state=event.target.dataset.status;await call('/api/layout/campaigns',{method:'POST',body:JSON.stringify({action:state==='active'?'archive':'restore',id:toggle})})}else return;await load()};
$('csvDownload').onclick=async()=>{const id=$('csvCampaign').value,res=await call('/api/layout/csv'+(id?'?campaign_id='+encodeURIComponent(id):''));const rows=[['LINE番号','表示名','キャンペーン名','端末','アプリID','状況','更新日時'],...(res.rows||[]).map(row=>[row.line_number,row.display_name,row.campaign_name,row.device_id,row.app_id,statusName(row.status),row.updated_at||''])];const csv='\uFEFF'+rows.map(row=>row.map(value=>'"'+String(value??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='画面配置_当落一覧_'+new Date().toISOString().slice(0,10).replaceAll('-','')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status('CSVをダウンロードしました。')};
$('correctSave').onclick=async()=>{const campaign=$('correctCampaign').value,account=$('correctAccount').value,target=data.accounts.find(row=>row.id===account),next=$('correctStatus').value;if(!campaign||!target)return;const updates=[{account_id:account,status:next}],preview=await call('/api/layout/results/preview',{method:'POST',body:JSON.stringify({campaign_id:campaign,device:target.device_id,updates})});const old=Object.keys(preview.transitions||{}).find(key=>key!=='unchanged'&&preview.transitions[key])||'変更なし';if(!confirm(`更新内容：${old.replace('_to_',' → ')}\n端末${target.device_id}：LINE${target.line_number||target.display_name}\n\n変更しますか？`))return;await call('/api/layout/results',{method:'POST',body:JSON.stringify({campaign_id:campaign,device:target.device_id,updates,confirm_winner_to_loser:true})});await load();status('当落を訂正しました。')};
load().catch(error=>status('読み込み失敗：'+error.message));
</script></body></html>
