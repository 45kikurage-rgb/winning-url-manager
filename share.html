<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>当選データ送信</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(640px,100%);min-height:min(620px,calc(100vh - 24px));background:#fff;border-radius:26px;padding:30px 26px;box-shadow:0 14px 38px rgba(0,0,0,.13);text-align:center;display:flex;flex-direction:column;justify-content:center}
.icon{width:112px;height:112px;border-radius:28px;object-fit:cover;margin:0 auto 14px}
h1{font-size:28px;margin:0 0 14px}
.state{padding:24px 18px;border-radius:18px;font-size:30px;line-height:1.35;font-weight:1000;background:#eef2ff;color:#3730a3;margin:14px 0 10px}
.state.ok{background:#dcfce7;color:#166534}
.state.ng{background:#fee2e2;color:#991b1b}
.destination{display:block;margin:10px 0 12px;padding:16px 18px;border:2px solid #bfdbfe;border-radius:16px;background:#eff6ff;text-align:center}.destinationLabel{font-size:13px;font-weight:900;color:#1d4ed8;margin-bottom:4px}.destinationName{font-size:24px;line-height:1.3;font-weight:1000;color:#111827;word-break:break-word}.destinationCount{margin-top:3px;font-size:24px;line-height:1.3;font-weight:1000;color:#4b5563}
.stats{display:flex;gap:10px;margin:0 0 12px;align-items:stretch;justify-content:center}.stat{flex:1 1 0;min-width:0;padding:15px 8px;border-radius:16px;text-align:center;border:2px solid transparent}.stat[hidden]{display:none!important}.statLabel{font-size:13px;font-weight:1000;margin-bottom:3px}.statValue{font-size:28px;line-height:1.1;font-weight:1000}.stat.received{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}.stat.saved{background:#dcfce7;border-color:#86efac;color:#166534}.stat.duplicate{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.stat.received .statLabel,.stat.received .statValue,.stat.saved .statLabel,.stat.saved .statValue,.stat.duplicate .statLabel,.stat.duplicate .statValue{color:inherit}
.url{font-size:13px;word-break:break-all;background:#f8fafc;border-radius:12px;padding:14px;text-align:left;margin-top:10px;max-height:110px;overflow:auto}
.meta{font-size:13px;color:#6b7280;margin-top:10px}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-size:16px;font-weight:800;text-decoration:none}
button:disabled{opacity:.55}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./icon-any.png" alt="">
  <h1>当選データ送信</h1>
  <div id="state" class="state">共有データを確認しています…</div>
  <div id="destination" class="destination" aria-live="polite">
    <div class="destinationLabel">保存先</div>
    <div id="destinationName" class="destinationName">確認中…</div>
    <div id="destinationCount" class="destinationCount"></div>
  </div>
  <div id="stats" class="stats" aria-live="polite">
    <div id="receivedStat" class="stat received"><div class="statLabel">受信</div><div id="receivedCount" class="statValue">0件</div></div>
    <div id="savedStat" class="stat saved" hidden><div class="statLabel">保存</div><div id="savedCount" class="statValue">0件</div></div>
    <div id="duplicateStat" class="stat duplicate" hidden><div class="statLabel">重複</div><div id="duplicateCount" class="statValue">0件</div></div>
  </div>
  <div id="url" class="url" style="display:none"></div>
  <div id="meta" class="meta"></div>
  <button id="retry" class="primary" style="display:none">もう一度送信</button>
  <a class="btn secondary" href="./index.html">管理画面を開く</a>
  <div class="meta">送信成功後はAndroidの「戻る」で元のアプリへ戻れます。</div>
</div>
<script>
const API = 'https://winning-url-api.45kikurage.workers.dev';
const state = document.getElementById('state');
const urlBox = document.getElementById('url');
const destinationName = document.getElementById('destinationName');
const destinationCount = document.getElementById('destinationCount');
const receivedStat = document.getElementById('receivedStat');
const savedStat = document.getElementById('savedStat');
const duplicateStat = document.getElementById('duplicateStat');
const receivedCount = document.getElementById('receivedCount');
const savedCount = document.getElementById('savedCount');
const duplicateCount = document.getElementById('duplicateCount');
const meta = document.getElementById('meta');
const retry = document.getElementById('retry');
let sending = false;
let returnTimer = null;

function cleanExtractedUrl(raw) {
  return String(raw || '').trim().replace(/[)\]、。,.!?！？]+$/g,'');
}

function extractSharedItems(isPayPayDestination) {
  const p = new URLSearchParams(location.search);
  // Android共有では通常 text に共有内容全体が入るため、
  // まず text を優先し、無ければ url → title の順で確認する。
  const sources = [p.get('text'), p.get('url'), p.get('title')].filter(Boolean);
  for (const source of sources) {
    const text = String(source);
    const urlMatches = text.match(/https?:\/\/[^\s<>"']+/gi) || [];
    const urls = urlMatches.map(cleanExtractedUrl).filter(Boolean);
    const withoutUrls=urlMatches.reduce((value,url)=>value.replace(url,' '),text);
    const drinkCodes=[...withoutUrls.matchAll(/(?:^|[^A-Za-z0-9])(cd[A-Za-z0-9]{12})(?![A-Za-z0-9])/g)].map(x=>x[1]);
    if(drinkCodes.length)return drinkCodes;
    if(isPayPayDestination){
      const hyphenCodes=withoutUrls.match(/(?:^|[^A-Za-z0-9])([A-Za-z0-9]{4}(?:-[A-Za-z0-9]{4}){3})(?![A-Za-z0-9])/g)
        ?.map(x=>x.trim().match(/[A-Za-z0-9]{4}(?:-[A-Za-z0-9]{4}){3}/)?.[0]).filter(Boolean)||[];
      const plainCodes=[...withoutUrls.matchAll(/(?:^|[^A-Za-z0-9])(?!dc)([A-Za-z0-9]{16})(?![A-Za-z0-9])/g)].map(x=>x[1]);
      const payPayCodes=[...hyphenCodes,...plainCodes];
      if(payPayCodes.length)return payPayCodes;
    }
    if(urls.length) return urls;
  }
  return [];
}

async function loadDestination(){
  try{
    const r=await fetch(API + '/api/active-list',{cache:'no-store'});
    const data=await r.json();
    if(r.ok && data.ok && data.active){
      destinationName.textContent=data.active.name || '保存先';
      return data.active;
    }
  }catch(_){}
  destinationName.textContent='確認中…';
  return null;
}

function updateStats(saved, duplicates) {
  savedCount.textContent = `${saved}件`;
  duplicateCount.textContent = `${duplicates}件`;
  savedStat.hidden = saved === 0;
  duplicateStat.hidden = duplicates === 0;
}

async function send() {
  if (sending) return;
  const destination=await loadDestination();
  const sharedItems = extractSharedItems(String(destination?.name||'').trim().toLowerCase()==='paypay');
  retry.style.display = 'none';
  state.style.display = 'block';
  destinationCount.textContent = '';
  receivedCount.textContent = `${sharedItems.length}件`;
  updateStats(0, 0);

  if (!sharedItems.length) {
    state.textContent = 'データを取得できませんでした';
    state.className = 'state ng';
    meta.textContent = '共有元から対応するURLまたはコードが渡されていない可能性があります。';
    retry.style.display = 'block';
    return;
  }

  urlBox.style.display = 'block';
  urlBox.textContent = sharedItems.join('\n');
  state.textContent = sharedItems.length > 1 ? `${sharedItems.length}件をサーバーへ送信中…` : 'サーバーへ送信中…';
  state.className = 'state';
  meta.textContent = '';
  sending = true;
  retry.disabled = true;

  let saved = 0,duplicates = 0;

  try {
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(),20000);
    let r;
    try{
      r=await fetch(API+'/api/submit-batch',{
        method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,
        body:JSON.stringify({items:sharedItems,device_id:navigator.userAgent.includes('Android')?'android-share':'web-share'})
      });
    }finally{clearTimeout(timeoutId)}
    const responseText=await r.text();
    let data;try{data=JSON.parse(responseText)}catch{throw new Error(`サーバー応答を確認できませんでした（HTTP ${r.status}）`)}
    if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));
    saved=Number(data.saved_count||0);duplicates=Number(data.duplicate_count||0);
    receivedCount.textContent=`${Number(data.received_count||sharedItems.length)}件`;
    updateStats(saved,duplicates);
    destinationName.textContent=data.list_name||destination?.name||'保存先';
    destinationCount.textContent=`現在 ${Number(data.list_count||0).toLocaleString()}件`;
    if(Number(data.invalid_count||0)>0)meta.textContent=`未対応 ${Number(data.invalid_count)}件は保存されませんでした。`;

    state.style.display = 'none';
    if(!Number(data.invalid_count||0))meta.textContent = '2秒後に元の画面へ戻ります';
    clearTimeout(returnTimer);
    returnTimer = setTimeout(() => {
      try {
        if (history.length > 1) history.back();
        else window.close();
      } catch (_) { window.close(); }
    }, 2000);
  } catch (e) {
    state.textContent = '送信に失敗しました';
    state.className = 'state ng';
    meta.textContent = e?.name === 'AbortError'
      ? `受信 ${sharedItems.length}件。通信が20秒以内に完了しませんでした。画面は閉じません。`
      : `受信 ${sharedItems.length}件。${String(e.message || e)}　画面は閉じません。再送信してください。`;
    retry.style.display = 'block';
  } finally {
    sending = false;
    retry.disabled = false;
  }
}

retry.onclick = send;
send();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}
</script>
</body>
</html>
