<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>URL送信</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.10);text-align:center}
.icon{width:96px;height:96px;border-radius:24px;object-fit:cover;margin-bottom:12px}
h1{font-size:24px;margin:0 0 12px}
.state{padding:20px;border-radius:16px;font-size:28px;line-height:1.35;font-weight:1000;background:#eef2ff;color:#3730a3;margin:14px 0}
.state.ok{background:#dcfce7;color:#166534}
.state.ng{background:#fee2e2;color:#991b1b}
.url{font-size:12px;word-break:break-all;background:#f8fafc;border-radius:12px;padding:12px;text-align:left;margin-top:12px}
.meta{font-size:13px;color:#6b7280;margin-top:10px}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-size:16px;font-weight:800;text-decoration:none}
button:disabled{opacity:.55}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./icon-any.png" alt="">
  <h1>当選URL送信</h1>
  <div id="state" class="state">共有URLを確認しています…</div>
  <div id="url" class="url" style="display:none"></div>
  <div id="meta" class="meta"></div>
  <button id="retry" class="primary" style="display:none">もう一度送信</button>
  <a class="btn secondary" href="./index.html">管理画面を開く</a>
  <div class="meta">送信成功後はAndroidの「戻る」で元のアプリへ戻れます。</div>
</div>
<script>
const API = 'https://winning-url-api.45kikurage.workers.dev';
const state = document.getElementById('state');
const urlBox = document.getElementById('url');
const meta = document.getElementById('meta');
const retry = document.getElementById('retry');
let sending = false;
let returnTimer = null;

function extractUrls() {
  const p = new URLSearchParams(location.search);
  const candidates = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean);
  const urls = [];
  for (const v of candidates) {
    const matches = String(v).match(/https?:\/\/[^\s<>"']+/gi) || [];
    for (const match of matches) {
      const cleaned = match.replace(/[)\]、。,.!?！？]+$/g,'');
      if (cleaned) urls.push(cleaned);
    }
  }
  return urls;
}

async function send() {
  if (sending) return;
  const sharedUrls = extractUrls();
  retry.style.display = 'none';

  if (!sharedUrls.length) {
    state.textContent = 'URLを取得できませんでした';
    state.className = 'state ng';
    meta.textContent = '共有元からURLが渡されていない可能性があります。';
    retry.style.display = 'block';
    return;
  }

  urlBox.style.display = 'block';
  urlBox.textContent = sharedUrls.join('\n');
  state.textContent = 'サーバーへ送信中…';
  state.className = 'state';
  meta.textContent = '';
  sending = true;
  retry.disabled = true;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);

  try {
    const r = await fetch(API + '/api/submit-batch', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      signal: controller.signal,
      body: JSON.stringify({
        urls: sharedUrls,
        device_id: navigator.userAgent.includes('Android') ? 'android-share' : 'web-share'
      })
    });
    const responseText = await r.text();
    let data;
    try { data = JSON.parse(responseText); }
    catch { throw new Error(`サーバー応答を確認できませんでした（HTTP ${r.status}）`); }

    if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));

    const listName = data.list_name || '保存先';
    const invalidText = Number(data.invalid_count||0) ? `　無効${Number(data.invalid_count)}件` : '';
    state.textContent = `✓ ${Number(data.received_count||0)}件受信 / ${Number(data.saved_count||0)}件保存　${Number(data.duplicate_count||0)}件重複${invalidText}`;
    state.className = 'state ok';
    urlBox.textContent = `${listName}　現在${Number(data.list_count||0)}件`;
    meta.textContent = '2秒後に元の画面へ戻ります';
    clearTimeout(returnTimer);
    returnTimer = setTimeout(() => {
      try {
        if (history.length > 1) history.back();
        else window.close();
      } catch (_) { window.close(); }
    }, 2000);
  } catch (e) {
    state.textContent = '送信に失敗しました';
    state.className = 'state ng';
    meta.textContent = e?.name === 'AbortError'
      ? '通信が20秒以内に完了しませんでした。画面は閉じません。通信状態を確認して再送信してください。'
      : `${String(e.message || e)}　画面は閉じません。再送信してください。`;
    retry.style.display = 'block';
  } finally {
    clearTimeout(timeoutId);
    sending = false;
    retry.disabled = false;
  }
}
retry.onclick = send;
send();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}
</script>
</body>
</html>
