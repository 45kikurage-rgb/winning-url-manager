<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script src="./device-access.js?v=7"></script>
<script src="./layout-backup-share.js?v=20260919-layout-backup-share"></script>
<link rel="manifest" href="./manifest.webmanifest?v=20260919-layout-backup-share">
<link rel="apple-touch-icon" href="./icon-transparent-192.png?v=20260914-white-splash">
<title>当選データ送信</title>
<style>
@font-face{font-family:"Corporate Logo Rounded";src:url("./fonts/Corporate-Logo-Rounded-Bold-ver3.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:"Corporate Logo Rounded","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:700;font-synthesis:none;letter-spacing:.02em;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(640px,100%);min-height:min(620px,calc(100vh - 24px));background:#000;border:3px solid #fff;border-radius:0;padding:30px 26px;box-shadow:inset 0 0 0 3px #000,0 0 0 1px #000;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);text-align:center;display:flex;flex-direction:column;justify-content:center}
.icon{width:112px;height:112px;border-radius:28px;object-fit:cover;margin:0 auto 14px}
h1{font-size:28px;margin:0 0 14px}
.state{padding:24px 18px;border-radius:18px;font-size:30px;line-height:1.35;font-weight:1000;background:#eef2ff;color:#3730a3;margin:14px 0 10px}
.state.ok{background:#dcfce7;color:#166534}
.state.ng{background:#fee2e2;color:#991b1b}
.state.inspect{background:#dbeafe;color:#1e3a8a}
.destination{display:block;margin:10px 0 12px;padding:16px 18px;border:2px solid #bfdbfe;border-radius:16px;background:#eff6ff;text-align:center}.destinationLabel{font-size:13px;font-weight:900;color:#1d4ed8;margin-bottom:4px}.destinationName{font-size:24px;line-height:1.3;font-weight:1000;color:#111827;word-break:break-word}.destinationCount{margin-top:3px;font-size:24px;line-height:1.3;font-weight:1000;color:#4b5563}
.stats{display:flex;gap:10px;margin:0 0 12px;align-items:stretch;justify-content:center}.stat{flex:1 1 0;min-width:0;padding:15px 8px;border-radius:16px;text-align:center;border:2px solid transparent}.stat[hidden]{display:none!important}.statLabel{font-size:13px;font-weight:1000;margin-bottom:3px}.statValue{font-size:28px;line-height:1.1;font-weight:1000}.stat.received{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}.stat.saved{background:#dcfce7;border-color:#86efac;color:#166534}.stat.duplicate{background:#fef3c7;border-color:#fcd34d;color:#92400e}.stat.received .statLabel,.stat.received .statValue,.stat.saved .statLabel,.stat.saved .statValue,.stat.duplicate .statLabel,.stat.duplicate .statValue{color:inherit}
.url{font-size:13px;word-break:break-all;background:#f8fafc;border-radius:12px;padding:14px;text-align:left;margin-top:10px;max-height:110px;overflow:auto}
.meta{font-size:13px;color:#6b7280;margin-top:10px}
.jobBox,.deviceBox{margin:8px 0;padding:14px 16px;border-radius:16px;background:#eff6ff;color:#1e3a8a;font-size:18px;line-height:1.35}
.deviceBox label{display:block;font-size:13px;margin-bottom:6px}
.deviceBox select{width:100%;min-height:44px;border:2px solid #93c5fd;border-radius:12px;background:#fff;color:#111827;font:inherit;text-align:center}
.fileName{margin-top:8px;font-size:14px;color:#4b5563;word-break:break-all}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-size:16px;font-weight:800;text-decoration:none}
button:disabled{opacity:.55}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
.filePick{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./icon-any.png" alt="">
  <h1 id="pageTitle">当選データ送信</h1>
  <div id="state" class="state">共有データを確認しています…</div>
  <div id="urlShareUi">
    <div id="destination" class="destination" aria-live="polite">
      <div class="destinationLabel">保存先</div>
      <div id="destinationName" class="destinationName">確認中…</div>
      <div id="destinationCount" class="destinationCount"></div>
    </div>
    <div id="stats" class="stats" aria-live="polite">
      <div id="receivedStat" class="stat received"><div class="statLabel">受信</div><div id="receivedCount" class="statValue">0件</div></div>
      <div id="savedStat" class="stat saved" hidden><div class="statLabel">一時箱へ受付</div><div id="savedCount" class="statValue">0件</div></div>
      <div id="duplicateStat" class="stat duplicate" hidden><div class="statLabel">一時箱合計</div><div id="duplicateCount" class="statValue">0件</div></div>
    </div>
    <div id="url" class="url" style="display:none"></div>
  </div>
  <div id="backupShareUi" hidden>
    <div id="deviceBox" class="deviceBox">端末 未選択</div>
    <div id="jobBox" class="jobBox" hidden></div>
    <div id="fileName" class="fileName"></div>
    <label id="devicePickWrap" class="deviceBox" hidden>
      <span>この端末番号（01〜15）</span>
      <select id="deviceSelect" aria-label="端末番号"></select>
    </label>
    <button id="downloadBtn" class="primary" hidden type="button">タップして保存</button>
    <input id="backupPick" class="filePick" type="file" accept=".novabackup,application/octet-stream">
    <button id="pickBackup" class="secondary" type="button" hidden>別の.novabackupを選ぶ</button>
  </div>
  <div id="meta" class="meta"></div>
  <button id="retry" class="primary" style="display:none">もう一度送信</button>
  <a class="btn secondary" href="./index.html">管理画面を開く</a>
  <div id="footerNote" class="meta">送信成功後はAndroidの「戻る」で元のアプリへ戻れます。</div>
</div>
<script>
const API = 'https://winning-url-api.45kikurage.workers.dev';
const Share = window.LayoutBackupShare;
const state = document.getElementById('state');
const pageTitle = document.getElementById('pageTitle');
const urlShareUi = document.getElementById('urlShareUi');
const backupShareUi = document.getElementById('backupShareUi');
const urlBox = document.getElementById('url');
const destinationName = document.getElementById('destinationName');
const destinationCount = document.getElementById('destinationCount');
const receivedStat = document.getElementById('receivedStat');
const savedStat = document.getElementById('savedStat');
const duplicateStat = document.getElementById('duplicateStat');
const receivedCount = document.getElementById('receivedCount');
const savedCount = document.getElementById('savedCount');
const duplicateCount = document.getElementById('duplicateCount');
const meta = document.getElementById('meta');
const retry = document.getElementById('retry');
const deviceBox = document.getElementById('deviceBox');
const jobBox = document.getElementById('jobBox');
const fileNameBox = document.getElementById('fileName');
const devicePickWrap = document.getElementById('devicePickWrap');
const deviceSelect = document.getElementById('deviceSelect');
const downloadBtn = document.getElementById('downloadBtn');
const backupPick = document.getElementById('backupPick');
const pickBackup = document.getElementById('pickBackup');
const footerNote = document.getElementById('footerNote');
let sending = false;
let returnTimer = null;
let pollTimer = null;
let backupFile = null;
let currentJob = {id:'', status:'', fileName:'', downloadUrl:'', reason:''};
const requestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
const client = Share.createClient({api:API});

function cleanExtractedUrl(raw) {
  return String(raw || '').trim().replace(/[)\]、。,.!?！？]+$/g,'');
}

function extractSharedItems() {
  const p = new URLSearchParams(location.search);
  // Android共有では通常 text に共有内容全体が入るため、
  // まず text を優先し、無ければ url → title の順で確認する。
  const sources = [p.get('text'), p.get('url'), p.get('title')].filter(Boolean);
  for (const source of sources) {
    const text = String(source).trim();
    if(!text)continue;
    const urlMatches = text.match(/https?:\/\/[^\s<>"']+/gi) || [];
    const urls = urlMatches.map(cleanExtractedUrl).filter(Boolean);
    let withoutUrls=urlMatches.reduce((value,url)=>value.replace(url,' '),text);
    const drinkCodes=[...withoutUrls.matchAll(/(?:^|[^A-Za-z0-9])(cd[A-Za-z0-9]{12})(?![A-Za-z0-9])/g)].map(x=>x[1]);
    drinkCodes.forEach(code=>{withoutUrls=withoutUrls.replace(code,' ')});
    const hyphenCodes=withoutUrls.match(/(?:^|[^A-Za-z0-9])([A-Za-z0-9]{4}(?:-[A-Za-z0-9]{4}){3})(?![A-Za-z0-9])/g)
      ?.map(x=>x.trim().match(/[A-Za-z0-9]{4}(?:-[A-Za-z0-9]{4}){3}/)?.[0]).filter(Boolean)||[];
    hyphenCodes.forEach(code=>{withoutUrls=withoutUrls.replace(code,' ')});
    const plainCodes=[...withoutUrls.matchAll(/(?:^|[^A-Za-z0-9])([A-Za-z0-9]{16})(?![A-Za-z0-9])/g)].map(x=>x[1]);
    plainCodes.forEach(code=>{withoutUrls=withoutUrls.replace(code,' ')});
    const recognized=[...urls,...drinkCodes,...hyphenCodes,...plainCodes];
    if(recognized.length){
      return [...new Set(recognized.map(value=>String(value).trim()).filter(Boolean))].slice(0,200);
    }
    return [text];
  }
  return [];
}

async function loadDestination(){
  try{
    const r=await fetch(API + '/api/active-list',{cache:'no-store'});
    const data=await r.json();
    if(r.ok && data.ok && data.active){
      destinationName.textContent=data.active.name || '保存先';
      return data.active;
    }
  }catch(_){}
  destinationName.textContent='確認中…';
  return null;
}

function updateStats(saved, pending) {
  savedCount.textContent = `${saved}件`;
  duplicateCount.textContent = `${pending}件`;
  savedStat.hidden = saved === 0;
  duplicateStat.hidden = pending === 0;
}

async function send() {
  if (sending) return;
  const destination=await loadDestination();
  const sharedItems = extractSharedItems();
  retry.style.display = 'none';
  state.style.display = 'block';
  destinationCount.textContent = '';
  receivedCount.textContent = `${sharedItems.length}件`;
  updateStats(0, 0);

  if (!sharedItems.length) {
    state.textContent = 'データを取得できませんでした';
    state.className = 'state ng';
    meta.textContent = '共有元から転送データが渡されていない可能性があります。';
    retry.style.display = 'block';
    return;
  }

  urlBox.style.display = 'block';
  urlBox.textContent = sharedItems.join('\n');
  state.textContent = sharedItems.length > 1 ? `${sharedItems.length}件をサーバーへ送信中…` : 'サーバーへ送信中…';
  state.className = 'state';
  meta.textContent = '';
  sending = true;
  retry.disabled = true;

  let saved = 0,pending = 0;

  try {
    const controller=new AbortController();
    const timeoutId=setTimeout(()=>controller.abort(),20000);
    let r;
    try{
      r=await fetch(API+'/api/submit-batch',{
        method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,
        body:JSON.stringify({items:sharedItems,device_id:navigator.userAgent.includes('Android')?'android-share':'web-share',request_id:requestId})
      });
    }finally{clearTimeout(timeoutId)}
    const responseText=await r.text();
    let data;try{data=JSON.parse(responseText)}catch{throw new Error(`サーバー応答を確認できませんでした（HTTP ${r.status}）`)}
    if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));
    saved=Number(data.accepted_count??data.saved_count??0);pending=Number(data.pending_count||0);
    receivedCount.textContent=`${Number(data.received_count||sharedItems.length)}件`;
    updateStats(saved,pending);
    destinationName.textContent=data.list_name||destination?.name||'保存先';
    destinationCount.textContent=`継続 ${Number(data.list_count||0).toLocaleString()}件 / 未確認 ${pending.toLocaleString()}件`;
    if(Number(data.invalid_count||0)>0)meta.textContent=`未対応 ${Number(data.invalid_count)}件は保存されませんでした。`;

    state.style.display = 'none';
    if(!Number(data.invalid_count||0))meta.textContent = '一時箱へ受付しました。重複確認後に継続箱へ反映されます。2秒後に元の画面へ戻ります';
    clearTimeout(returnTimer);
    returnTimer = setTimeout(() => {
      try {
        if (history.length > 1) history.back();
        else window.close();
      } catch (_) { window.close(); }
    }, 2000);
  } catch (e) {
    state.textContent = '送信に失敗しました';
    state.className = 'state ng';
    meta.textContent = e?.name === 'AbortError'
      ? `受信 ${sharedItems.length}件。通信が20秒以内に完了しませんでした。画面は閉じません。`
      : `受信 ${sharedItems.length}件。${String(e.message || e)}　画面は閉じません。再送信してください。`;
    retry.style.display = 'block';
  } finally {
    sending = false;
    retry.disabled = false;
  }
}

function showBackupMode(){
  pageTitle.textContent='配置バックアップ検査';
  document.title='配置バックアップ検査';
  urlShareUi.hidden=true;
  backupShareUi.hidden=false;
  footerNote.textContent='検査OKのときだけ保存できます。Novaへの自動復元はしません。';
  retry.textContent='もう一度アップロード';
}

function fillDeviceSelect(selected){
  deviceSelect.innerHTML=Share.DEVICE_IDS.map(id=>`<option value="${id}" ${id===selected?'selected':''}>端末${id}</option>`).join('');
}

function boundDevice(){
  return Share.normalizeDeviceId(deviceSelect.value)||Share.readBoundDevice();
}

function applyBackupUi(status, extra={}){
  const ui=Share.describeBackupUi(status, extra);
  state.style.display='block';
  state.textContent=ui.title;
  state.className=ui.className;
  meta.textContent=ui.meta;
  const device=extra.deviceId||boundDevice();
  deviceBox.textContent=device?`端末 ${device}`:'端末 未選択';
  if(extra.jobId){
    jobBox.hidden=false;
    jobBox.textContent=`ジョブ ${extra.jobId}`;
  }
  fileNameBox.textContent=extra.fileName||(backupFile&&backupFile.name)||'';
  downloadBtn.hidden=!ui.download;
  downloadBtn.disabled=!ui.download;
  currentJob={
    id:extra.jobId||currentJob.id,
    status:ui.status,
    fileName:extra.fileName||currentJob.fileName,
    downloadUrl:extra.downloadUrl||'',
    reason:extra.reason||''
  };
}

async function promptTokenIfNeeded(error){
  if(!error||error.status!==401)return false;
  const entered=window.prompt('管理端末キーを入力してください。');
  if(!entered)return false;
  Share.writeManagerToken(entered);
  return true;
}

async function downloadCurrentJob(){
  if(!currentJob.id||currentJob.status!=='ok')return;
  downloadBtn.disabled=true;
  meta.textContent='保存用ファイルを取得しています…';
  try{
    if(currentJob.downloadUrl){
      const r=await fetch(currentJob.downloadUrl,{cache:'no-store'});
      if(!r.ok)throw new Error('保存用URLを取得できませんでした。');
      const blob=await r.blob();
      const fileName=Share.parseContentDispositionFilename(r.headers.get('content-disposition'))||currentJob.fileName||Share.fallbackEditedFilename({device:boundDevice(),jobId:currentJob.id});
      Share.triggerBrowserDownload(blob,fileName);
      meta.textContent=`保存しました：${fileName}`;
      return;
    }
    const result=await client.downloadJob(currentJob.id);
    if(result.blob){
      Share.triggerBrowserDownload(result.blob,result.fileName);
      meta.textContent=`保存しました：${result.fileName}`;
      return;
    }
    if(result.url){
      const r=await fetch(result.url,{cache:'no-store'});
      if(!r.ok)throw new Error('保存用URLを取得できませんでした。');
      const blob=await r.blob();
      const fileName=Share.parseContentDispositionFilename(r.headers.get('content-disposition'))||result.fileName;
      Share.triggerBrowserDownload(blob,fileName);
      meta.textContent=`保存しました：${fileName}`;
    }
  }catch(error){
    if(await promptTokenIfNeeded(error))return downloadCurrentJob();
    state.textContent='保存に失敗しました';
    state.className='state ng';
    meta.textContent=String(error.message||error);
  }finally{
    downloadBtn.disabled=currentJob.status!=='ok';
  }
}

function stopPolling(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

async function refreshJob(jobId){
  const data=await client.getJob(jobId);
  if(data.stub)return data;
  applyBackupUi(data.status||'received',{
    jobId:data.jobId||jobId,
    reason:data.reason,
    fileName:data.fileName,
    downloadUrl:data.downloadUrl,
    deviceId:boundDevice()
  });
  if(data.status==='ok'||data.status==='ng')stopPolling();
  return data;
}

function startPolling(jobId){
  stopPolling();
  pollTimer=setInterval(()=>{refreshJob(jobId).catch(()=>{})},2500);
}

async function subscribePush(){
  if(!('serviceWorker' in navigator))return;
  try{
    const registration=await navigator.serviceWorker.ready;
    await Share.ensurePushSubscription({registration,client,deviceId:boundDevice()});
  }catch(_){}
}

async function uploadBackup(file){
  const device=boundDevice();
  if(!device){
    devicePickWrap.hidden=false;
    applyBackupUi('ng',{reason:'端末01〜15を選んでからアップロードしてください。'});
    retry.style.display='block';
    return;
  }
  Share.writeBoundDevice(device);
  if(!Share.isNovaBackupFile(file)){
    applyBackupUi('ng',{reason:'NOVAバックアップ（.novabackup）だけ送れます。',deviceId:device});
    pickBackup.hidden=false;
    retry.style.display='block';
    return;
  }
  backupFile=file;
  applyBackupUi('received',{deviceId:device,fileName:file.name});
  retry.style.display='none';
  pickBackup.hidden=true;
  try{
    const created=await client.createJob({file,deviceId:device,requestId});
    if(created.stub){
      applyBackupUi('received',{deviceId:device,fileName:file.name,jobId:created.jobId||''});
      meta.textContent=created.error;
      retry.style.display='block';
      pickBackup.hidden=false;
      await subscribePush();
      return;
    }
    applyBackupUi(created.status||'received',{
      jobId:created.jobId,
      deviceId:device,
      fileName:created.fileName||file.name,
      reason:created.reason
    });
    await subscribePush();
    if(created.jobId&&created.status!=='ok'&&created.status!=='ng'){
      applyBackupUi(created.status||'inspecting',{jobId:created.jobId,deviceId:device,fileName:created.fileName||file.name});
      startPolling(created.jobId);
    }
    if(created.jobId){
      const latest=await refreshJob(created.jobId).catch(()=>null);
      if(latest&&latest.status!=='ok'&&latest.status!=='ng')startPolling(created.jobId);
    }
  }catch(error){
    if(await promptTokenIfNeeded(error))return uploadBackup(file);
    applyBackupUi('ng',{reason:String(error.message||error),deviceId:device,fileName:file.name});
    retry.style.display='block';
    pickBackup.hidden=false;
  }
}

async function runBackupFlow(params){
  showBackupMode();
  const selected=Share.readBoundDevice();
  fillDeviceSelect(selected||'01');
  devicePickWrap.hidden=!!selected;
  deviceBox.textContent=selected?`端末 ${selected}`:'端末 未選択';
  retry.onclick=()=>{
    if(backupFile)uploadBackup(backupFile);
    else pickBackup.hidden=false;
  };
  downloadBtn.onclick=downloadCurrentJob;
  pickBackup.onclick=()=>backupPick.click();
  backupPick.onchange=()=>{
    const file=backupPick.files&&backupPick.files[0];
    backupPick.value='';
    if(file)uploadBackup(file);
  };
  deviceSelect.onchange=()=>Share.writeBoundDevice(deviceSelect.value);

  if(params.get('backup_error')==='1'){
    applyBackupUi('ng',{reason:'共有されたファイルを受け取れませんでした。'});
    pickBackup.hidden=false;
    retry.style.display='none';
    await subscribePush();
    return;
  }

  const jobId=params.get('job');
  if(jobId){
    applyBackupUi('inspecting',{jobId,deviceId:selected});
    try{
      const data=await refreshJob(jobId);
      if(data.stub){
        applyBackupUi('received',{jobId,deviceId:selected});
        meta.textContent=data.error;
      }else if(data.status!=='ok'&&data.status!=='ng'){
        startPolling(jobId);
      }
      if(params.get('download')==='1'&&currentJob.status==='ok')await downloadCurrentJob();
    }catch(error){
      applyBackupUi('ng',{jobId,reason:String(error.message||error),deviceId:selected});
    }
    await subscribePush();
    return;
  }

  const backupId=params.get('backup');
  if(backupId){
    try{
      const record=await Share.readPendingShare(backupId);
      if(!record||!record.blob){
        applyBackupUi('ng',{reason:'共有ファイルを読み取れませんでした。',deviceId:selected});
        pickBackup.hidden=false;
        return;
      }
      const file=record.blob instanceof File?record.blob:new File([record.blob],record.fileName||'backup.novabackup',{type:record.mimeType||'application/octet-stream'});
      fileNameBox.textContent=file.name;
      await uploadBackup(file);
      if(currentJob.id&&currentJob.status!=='ng'){
        try{await Share.deletePendingShare(backupId)}catch(_){}
      }
    }catch(error){
      applyBackupUi('ng',{reason:String(error.message||error),deviceId:selected});
      pickBackup.hidden=false;
    }
    return;
  }

  applyBackupUi('',{title:'バックアップを確認しています…',meta:'Novaの「バックアップを共有」から URL送信 を選んでください。'});
  pickBackup.hidden=false;
}

function isBackupShare(params){
  return !!(params.get('backup')||params.get('job')||params.get('backup_error')||params.get('download'));
}

retry.onclick = send;

if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',event=>{
    const data=event.data||{};
    if(data.type!=='layout-backup-push')return;
    const payload=data.payload||{};
    const jobId=payload.jobId||payload.job_id;
    if(!jobId||(currentJob.id&&currentJob.id!==jobId))return;
    applyBackupUi(Share.normalizePushType(payload.type||payload.status),{
      jobId,
      reason:payload.reason||payload.error,
      fileName:payload.fileName||payload.file_name,
      downloadUrl:payload.downloadUrl||payload.download_url,
      deviceId:boundDevice()
    });
    if(currentJob.status==='ok'||currentJob.status==='ng')stopPolling();
  });
}

(async function boot(){
  const params=new URLSearchParams(location.search);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js?v=20260919-layout-backup-share',{updateViaCache:'none'}).catch(console.error);
