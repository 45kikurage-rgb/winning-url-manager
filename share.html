<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-any.png">
<title>URL送信</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}
.card{width:min(640px,100%);min-height:min(620px,calc(100vh - 24px));background:#fff;border-radius:26px;padding:30px 26px;box-shadow:0 14px 38px rgba(0,0,0,.13);text-align:center;display:flex;flex-direction:column;justify-content:center}
.icon{width:112px;height:112px;border-radius:28px;object-fit:cover;margin:0 auto 14px}
h1{font-size:28px;margin:0 0 14px}
.state{padding:24px 18px;border-radius:18px;font-size:30px;line-height:1.35;font-weight:1000;background:#eef2ff;color:#3730a3;margin:14px 0 10px}
.state.ok{background:#dcfce7;color:#166534}
.state.ng{background:#fee2e2;color:#991b1b}
.destination{display:block;margin:10px 0 12px;padding:16px 18px;border:2px solid #bfdbfe;border-radius:16px;background:#eff6ff;text-align:center}.destinationLabel{font-size:13px;font-weight:900;color:#1d4ed8;margin-bottom:4px}.destinationName{font-size:24px;line-height:1.3;font-weight:1000;color:#111827;word-break:break-word}.destinationCount{margin-top:3px;font-size:13px;font-weight:800;color:#4b5563}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 12px}.stat{padding:12px 6px;border-radius:14px;background:#f8fafc;border:1px solid #e5e7eb;text-align:center}.statLabel{font-size:11px;font-weight:900;color:#6b7280}.statValue{margin-top:2px;font-size:24px;line-height:1.15;font-weight:1000;color:#111827}.stat.saved .statValue{color:#166534}.stat.duplicate .statValue{color:#b45309}
.url{font-size:13px;word-break:break-all;background:#f8fafc;border-radius:12px;padding:14px;text-align:left;margin-top:10px;max-height:110px;overflow:auto}
.meta{font-size:13px;color:#6b7280;margin-top:10px}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin-top:12px;font-size:16px;font-weight:800;text-decoration:none}
button:disabled{opacity:.55}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e5e7eb;color:#111827}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="./icon-any.png" alt="">
  <h1>当選URL送信</h1>
  <div id="state" class="state">共有URLを確認しています…</div>
  <div id="destination" class="destination" aria-live="polite">
    <div class="destinationLabel">保存先</div>
    <div id="destinationName" class="destinationName">確認中…</div>
    <div id="destinationCount" class="destinationCount"></div>
  </div>
  <div id="stats" class="stats" aria-live="polite">
    <div class="stat received"><div class="statLabel">受信</div><div id="receivedCount" class="statValue">0件</div></div>
    <div class="stat saved"><div class="statLabel">保存</div><div id="savedCount" class="statValue">0件</div></div>
    <div class="stat duplicate"><div class="statLabel">重複</div><div id="duplicateCount" class="statValue">0件</div></div>
  </div>
  <div id="url" class="url" style="display:none"></div>
  <div id="meta" class="meta"></div>
  <button id="retry" class="primary" style="display:none">もう一度送信</button>
  <a class="btn secondary" href="./index.html">管理画面を開く</a>
  <div class="meta">送信成功後はAndroidの「戻る」で元のアプリへ戻れます。</div>
</div>
<script>
const API = 'https://winning-url-api.45kikurage.workers.dev';
const state = document.getElementById('state');
const urlBox = document.getElementById('url');
const destinationName = document.getElementById('destinationName');
const destinationCount = document.getElementById('destinationCount');
const receivedCount = document.getElementById('receivedCount');
const savedCount = document.getElementById('savedCount');
const duplicateCount = document.getElementById('duplicateCount');
const meta = document.getElementById('meta');
const retry = document.getElementById('retry');
let sending = false;
let returnTimer = null;

function cleanExtractedUrl(raw) {
  return String(raw || '').trim().replace(/[)\]、。,.!?！？]+$/g,'');
}

function extractUrls() {
  const p = new URLSearchParams(location.search);
  // Android共有では通常 text に共有内容全体が入るため、
  // まず text を優先し、無ければ url → title の順で確認する。
  const sources = [p.get('text'), p.get('url'), p.get('title')].filter(Boolean);
  for (const source of sources) {
    const text = String(source);
    const matches = text.match(/https?:\/\/[^\s<>"']+/gi) || [];
    const urls = matches.map(cleanExtractedUrl).filter(Boolean);
    if (urls.length) return urls;
  }
  return [];
}

async function loadDestination(){
  try{
    const r=await fetch(API + '/api/active-list',{cache:'no-store'});
    const data=await r.json();
    if(r.ok && data.ok && data.active){
      destinationName.textContent=data.active.name || '保存先';
      return data.active;
    }
  }catch(_){}
  destinationName.textContent='確認中…';
  return null;
}

async function send() {
  if (sending) return;
  const sharedUrls = extractUrls();
  retry.style.display = 'none';
  destinationCount.textContent = '';
  receivedCount.textContent = `${sharedUrls.length}件`;
  savedCount.textContent = '0件';
  duplicateCount.textContent = '0件';
  loadDestination();

  if (!sharedUrls.length) {
    state.textContent = 'URLを取得できませんでした';
    state.className = 'state ng';
    meta.textContent = '共有元からURLが渡されていない可能性があります。';
    retry.style.display = 'block';
    return;
  }

  urlBox.style.display = 'block';
  urlBox.textContent = sharedUrls.join('\n');
  state.textContent = sharedUrls.length > 1 ? `${sharedUrls.length}件をサーバーへ送信中…` : 'サーバーへ送信中…';
  state.className = 'state';
  meta.textContent = '';
  sending = true;
  retry.disabled = true;

  let saved = 0;
  let duplicates = 0;
  let listName = '';
  let finalListCount = null;

  try {
    // 1件ずつ送信して、各URLをサーバー側の重複判定に通す。
    for (let i = 0; i < sharedUrls.length; i++) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);
      try {
        const r = await fetch(API + '/api/submit', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          signal: controller.signal,
          body: JSON.stringify({
            url: sharedUrls[i],
            device_id: navigator.userAgent.includes('Android') ? 'android-share' : 'web-share'
          })
        });
        const responseText = await r.text();
        let data;
        try { data = JSON.parse(responseText); }
        catch { throw new Error(`サーバー応答を確認できませんでした（HTTP ${r.status}）`); }
        if (!r.ok || !data.ok) throw new Error(data.error || ('HTTP ' + r.status));

        listName = data.list_name || listName || '保存先';
        if (Number.isFinite(Number(data.list_count))) finalListCount = Number(data.list_count);
        if (data.duplicate) duplicates += 1;
        else saved += 1;

        savedCount.textContent = `${saved}件`;
        duplicateCount.textContent = `${duplicates}件`;
        destinationName.textContent = listName;
        if (finalListCount !== null) destinationCount.textContent = `現在 ${finalListCount.toLocaleString()}件`;
        state.textContent = sharedUrls.length > 1 ? `${i + 1}/${sharedUrls.length}件 処理中…` : '処理中…';
      } finally {
        clearTimeout(timeoutId);
      }
    }

    state.textContent = '✓ 送信完了';
    state.className = 'state ok';
    meta.textContent = `受信 ${sharedUrls.length}件 / 保存 ${saved}件 / 重複 ${duplicates}件　2秒後に元の画面へ戻ります`;
    clearTimeout(returnTimer);
    returnTimer = setTimeout(() => {
      try {
        if (history.length > 1) history.back();
        else window.close();
      } catch (_) { window.close(); }
    }, 2000);
  } catch (e) {
    state.textContent = '送信に失敗しました';
    state.className = 'state ng';
    meta.textContent = e?.name === 'AbortError'
      ? `途中結果：受信 ${sharedUrls.length}件 / 保存 ${saved}件 / 重複 ${duplicates}件。通信が20秒以内に完了しませんでした。画面は閉じません。`
      : `途中結果：受信 ${sharedUrls.length}件 / 保存 ${saved}件 / 重複 ${duplicates}件。${String(e.message || e)}　画面は閉じません。再送信してください。`;
    retry.style.display = 'block';
  } finally {
    sending = false;
    retry.disabled = false;
  }
}

retry.onclick = send;
send();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}
</script>
</body>
</html>
